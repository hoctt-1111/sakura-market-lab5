# Tiêu chí audit ticket trên GitHub Project — dữ liệu, không phải mã. Người duyệt sửa `muc` / `ap_dung` ở đây.
# Thước đo: quy ước vận hành GitHub Project của công ty (bản mã hoá: tracker, khuôn tiêu đề, field bắt buộc, nhãn, cha–con,
# trùng, trạng thái, quá hạn, bug) cộng quy ước tự khai của dự án (task-breakdown, cấu hình đội, nhãn, quy ước sprint).
# muc: B = chặn (sai cấu trúc hoặc đếm sai) · W = lệch quy ước, nên sửa · I = ghi nhận, ngoại lệ đã khai, khoảng cách cơ chế.
# nguon_ngoai: tiêu chí cần tệp ngoài ảnh chụp (seed, sprint_plan, phu_thuoc); không truyền tệp → «bỏ qua: thiếu nguồn».
# nguon, gate: tham chiếu tệp và gate của bộ công cụ LAB-5 (nằm ngoài repo nộp) để truy vết; skill không gọi chúng.
nguon_quy_uoc: "Quy ước vận hành GitHub Project của công ty, bản mã hoá trong công cụ audit nội bộ; không phải nguyên văn"
ngay: "2026-10-23"
tieu_chi:
  - {ma: A1, chieu: A, ten: "Mọi khoá seed có đúng một issue sống; không issue lạ", nguon: "quy ước A · gate G-BOARD", cach_do: "khoá từ tiêu đề so với seed, bỏ bản thay thế", muc: B, ap_dung: true, nguon_ngoai: seed, gate: "check-board --snapshot"}
  - {ma: A2, chieu: A, ten: "Epic có story; story có sub-issue; điều tra không có con", nguon: "task-breakdown §1", cach_do: "đếm con sống theo cha", muc: B, ap_dung: true, gate: "check-board --seed"}
  - {ma: A3, chieu: A, ten: "Bản thay thế đã đóng, Status Closed, không giữ Sprint, ngày, giờ đã làm, Done Date", nguon: "dong_thua · ticket đóng không còn là việc", cach_do: "lọc nhãn thay thế, soi state, Status, Sprint, Start, Due, Spent, Done", muc: W, ap_dung: true, gate: "một phần (state + nhãn)"}
  - {ma: B1, chieu: B, ten: "Item có Sprint khi và chỉ khi có trong kế hoạch sprint; Start, Due đúng ngày sprint", nguon: "quy ước B · quy-uoc-sprint", cach_do: "so khoá và 3 field với sprint-plan", muc: B, ap_dung: true, nguon_ngoai: sprint_plan, gate: "check-board --truong sprint"}
  - {ma: B2, chieu: B, ten: "Chỉ việc lá và điều tra được gán Sprint; epic, story để trống", nguon: "quy-uoc-sprint", cach_do: "tracker × Sprint", muc: W, ap_dung: true}
  - {ma: B3, chieu: B, ten: "Item trong Sprint có Owner, Start không sau Due", nguon: "quy ước C (Start, Due bắt buộc)", cach_do: "3 field", muc: W, ap_dung: true}
  - {ma: B4, chieu: B, ten: "Tổng giờ ước của một Owner trong một Sprint không vượt trần năng lực", nguon: "quy-uoc-sprint (tran, so_nguoi)", cach_do: "cộng Estimated theo Owner × Sprint", muc: W, ap_dung: true}
  - {ma: C1, chieu: C, ten: "Tiêu đề đúng khuôn [TRACKER] KHOÁ, tracker hợp lệ", nguon: "quy ước C · seed_luat", cach_do: "regex tiêu đề", muc: W, ap_dung: true, gate: "check-board --snapshot"}
  - {ma: C2, chieu: C, ten: "Khoá đúng khuôn theo tầng (epic, story, lá có hậu tố bộ phận)", nguon: "board_seed_rules", cach_do: "regex theo tracker", muc: W, ap_dung: true, gate: "check-board --seed"}
  - {ma: C3, chieu: C, ten: "Lá FE, BE, DB, INFRA, PM, BRSE mang nhãn team khớp bộ phận", nguon: "quy ước C (lá thiếu team)", cach_do: "nhãn team so hậu tố khoá", muc: W, ap_dung: true}
  - {ma: C3b, chieu: C, ten: "Lá TEST mang nhãn team", nguon: "quy ước C (lá thiếu team)", cach_do: "nhãn team trên lá TEST", muc: I, ap_dung: true, ghi_chu: "bộ nhãn dự án không có nhãn team cho QA; ghi khoảng cách"}
  - {ma: C4, chieu: C, ten: "Đúng một nhãn type, khớp tracker", nguon: "quy ước C · labels.yaml", cach_do: "đếm nhãn type", muc: W, ap_dung: true, gate: "check-board --snapshot"}
  - {ma: C5, chieu: C, ten: "Đủ Status, Priority, Owner, Story Point, Estimated time và người phụ trách", nguon: "quy ước C (field bắt buộc) · đề LAB-5", cach_do: "5 field + assignee", muc: W, ap_dung: true, gate: "check-board --snapshot"}
  - {ma: C6, chieu: C, ten: "Priority hợp lệ; story ràng buộc đặc thù hoặc epic ưu tiên ít nhất High", nguon: "priority_map · muc_uu_tien", cach_do: "field + nhãn ràng buộc + epic", muc: W, ap_dung: true, gate: "check-board --seed"}
  - {ma: C7, chieu: C, ten: "Status thuộc luồng giả lập; QA Testing chỉ ở lá TEST", nguon: "status_gia_lap", cach_do: "field × tracker", muc: W, ap_dung: true}
  - {ma: C8, chieu: C, ten: "Tiêu đề story song ngữ Nhật - Anh", nguon: "quy ước C", cach_do: "-", muc: W, ap_dung: false, ly_do: "Bài nộp viết tiếng Việt, thuật ngữ Nhật đặt trong ngoặc; repo không dành cho khách Nhật"}
  - {ma: C9, chieu: C, ten: "Field Plan Sprint, Roadmap, Target version", nguon: "quy ước C (field bắt buộc)", cach_do: "-", muc: I, ap_dung: false, ly_do: "Board không có ba field này; sprint kế hoạch nằm ở tệp kế hoạch, Iteration Sprint đóng vai Target"}
  - {ma: D1, chieu: D, ten: "Story Point, Estimated time, Spent time của cha bằng tổng con", nguon: "quy ước D · luật tổng phần = gốc", cach_do: "cộng theo cha", muc: B, ap_dung: true, gate: "check-board --truong swp,gio"}
  - {ma: D2, chieu: D, ten: "Status cha suy đúng từ con; epic, story không Closed trong giả lập", nguon: "luật suy Status cha", cach_do: "suy rồi so", muc: W, ap_dung: true, gate: "check-board --truong gia-lap"}
  - {ma: D3, chieu: D, ten: "Sub-issues progress khớp số con thật", nguon: "GitHub", cach_do: "so tổng con trên GitHub với đếm cha", muc: I, ap_dung: true}
  - {ma: D4, chieu: D, ten: "Owner lá đúng luật theo bộ phận, miền và ngoại lệ", nguon: "owner_theo_leaf · owner_mien · owner_ngoai_le", cach_do: "tra luật theo khoá và epic", muc: W, ap_dung: true, gate: "check-board --seed"}
  - {ma: D5, chieu: D, ten: "Sprint ghi trong thân khớp field; Slip đúng", nguon: "quy ước D", cach_do: "-", muc: W, ap_dung: false, ly_do: "Cần thân issue (ngoài phạm vi đọc field) và board không có field Slip"}
  - {ma: E1, chieu: E, ten: "Mọi item trừ epic có cha đúng tầng", nguon: "quy ước E · task-breakdown §1", cach_do: "cha + tracker hai đầu", muc: B, ap_dung: true, gate: "check-board --snapshot"}
  - {ma: E2, chieu: E, ten: "Item nằm đúng epic của seed", nguon: "board_snapshot_rules", cach_do: "epic theo chuỗi cha so epic seed", muc: W, ap_dung: true, nguon_ngoai: seed, gate: "check-board --snapshot"}
  - {ma: E3, chieu: E, ten: "Không cha nào quá 100 con", nguon: "giới hạn sub-issue của GitHub", cach_do: "đếm", muc: W, ap_dung: true, gate: "check-board --seed"}
  - {ma: F1, chieu: F, ten: "Không hai issue sống cùng khoá", nguon: "quy ước F", cach_do: "nhóm theo khoá, bỏ bản thay thế", muc: B, ap_dung: true, gate: "check-board --snapshot"}
  - {ma: G1, chieu: G, ten: "Cha Closed mà còn con chưa Closed", nguon: "quy ước G", cach_do: "cây", muc: B, ap_dung: true}
  - {ma: G2, chieu: G, ten: "Closed khi và chỉ khi có Done Date; Done Date không sau ngày chụp; chưa làm thì không có giờ đã làm", nguon: "luật giả lập", cach_do: "field", muc: W, ap_dung: true, gate: "check-board --truong gia-lap"}
  - {ma: G3, chieu: G, ten: "Status Closed mà issue GitHub còn mở", nguon: "quy ước G (trạng thái xong)", cach_do: "field so state", muc: I, ap_dung: true, ghi_chu: "ngoại lệ đã khai: giả lập không đóng issue trên GitHub"}
  - {ma: G4, chieu: G, ten: "Lá Closed không trái phụ thuộc; Done Date lá sau không trước lá trước", nguon: "phu-thuoc-la.yaml", cach_do: "cây + Done Date", muc: B, ap_dung: true, nguon_ngoai: phu_thuoc, gate: "board_gia_lap_phu_thuoc"}
  - {ma: H1, chieu: H, ten: "Quá hạn: Due trước ngày chụp mà chưa Closed", nguon: "quy ước H", cach_do: "field", muc: W, ap_dung: true}
  - {ma: H2, chieu: H, ten: "Trượt: Done Date sau Due", nguon: "quy ước H", cach_do: "field", muc: I, ap_dung: true}
  - {ma: H3, chieu: H, ten: "Field Slip", nguon: "quy ước H", cach_do: "-", muc: I, ap_dung: false, ly_do: "Board không có field Slip; trượt đo bằng H2"}
  - {ma: I1, chieu: I, ten: "Bug có Priority và dẫn chiếu lần chạy kiểm thử", nguon: "quy ước I", cach_do: "-", muc: I, ap_dung: false, ly_do: "Backlog không có tracker bug (một sprint giả lập, chưa có bug)"}
  - {ma: J1, chieu: J, ten: "Thân lá khớp phạm vi story cha", nguon: "quy ước J", cach_do: "-", muc: W, ap_dung: false, ly_do: "Cần thân issue; băm thân đã khoá bằng bản đồ board khi chụp có thân"}
  - {ma: K1, chieu: K, ten: "Story thay đổi yêu cầu đủ link pull request", nguon: "quy ước K", cach_do: "-", muc: W, ap_dung: false, ly_do: "Backlog không có tracker thay đổi yêu cầu, chưa có pull request"}
  - {ma: L1, chieu: L, ten: "Giờ ước của một lá không vượt trần một sprint của vai", nguon: "task-breakdown §1 · P-58", cach_do: "Estimated × Owner", muc: W, ap_dung: true}
  - {ma: L2, chieu: L, ten: "Lá kế thừa nhãn ràng buộc đặc thù của story", nguon: "seed_luat RANG_BUOC", cach_do: "nhãn cha so con", muc: I, ap_dung: true, gate: "check-board --seed"}
  - {ma: L3, chieu: L, ten: "Project public, đủ field theo cấu hình", nguon: "đề LAB-5 · field_map", cach_do: "project.public, project.fields", muc: B, ap_dung: true, gate: "check-board --snapshot"}
