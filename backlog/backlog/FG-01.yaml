  - G-FG01-02
  mo_ta: Mọi người dùng nội bộ đăng nhập bằng tài khoản cá nhân và nhận vai ngay lúc vào hệ thống. Vai quản trị và vai duyệt phải qua MFA, thao tác hiện trường thì không (ADR-011). Tablet dùng chung theo ca nên phiên ngắn và tài khoản bị khoá tạm khi nhập sai nhiều lần, ngưỡng lấy từ cấu hình (P-15).
  pham_vi: Màn SC-001 (SPEC-SKM-101); API-201; bảng `sessions` (chủ migration), đọc `profiles`, ghi `audit_log`; định danh người dùng ở Cognito user pool.
  luong_chinh:
  - Người dùng nhập tên đăng nhập, mật khẩu rồi bấm Đăng nhập.
  - Máy chủ chuyển cho Cognito xác thực; vai quản trị hoặc vai duyệt phải nhập thêm mã MFA 6 chữ số.
  - Máy chủ tạo phiên qua cookie HttpOnly, đọc vai trong `profiles`, đưa người dùng tới vùng làm việc của vai đó.
  - Máy chủ ghi nhật ký đăng nhập; sai liên tiếp tới ngưỡng cấu hình thì khoá tạm tài khoản (P-15).
  tieu_chi_nghiem_thu:
  - Khi thiếu trường, sai email hoặc sai mật khẩu thì API-201 trả cùng một câu báo, không lộ email nào có thật.
  - Khi tài khoản vai quản trị hoặc vai duyệt chưa qua MFA thì không có phiên; tài khoản hiện trường không bị hỏi mã.
  - Khi số lần sai chạm ngưỡng thì lần sau bị từ chối kể cả đúng mật khẩu, tới hết thời gian khoá.
  - Khi phiên hết hạn thì lời gọi API kế tiếp trả 401 M_29 và người dùng quay về SC-001.
  dinh_nghia_xong:
  - Spec SC-001 và API-201 cập nhật theo G-FG01-01, G-FG01-02.
