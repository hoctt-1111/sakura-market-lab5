  mo_ta: Nhóm chức năng này cho người dùng nội bộ của chợ đăng nhập bằng tài khoản cá nhân, nhận đúng vai ngay lúc vào hệ thống, và cho quản trị cấp, dừng, mở lại quyền kèm lịch sử trước và sau. Vì tablet hiện trường dùng chung theo ca, epic còn lo phiên ngắn, khoá tạm khi nhập sai, bàn giao ca tường minh và MFA cho vai quản trị, vai duyệt (ADR-011). Ma trận quyền mà API-203 cập nhật là nơi mọi epic khác đọc khi kiểm quyền.
