- key: API-202
  cha: FG-01
  tracker: story
  title_vi: API đăng xuất
  spec_refs:
    sc: []
    api:
    - API-202
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
  labels:
  - type:story
  - spec-gap
  owner: BE-2
  priority: 2
  premise_refs: []
  gap_refs:
  - G-FG01-02
  mo_ta: 'Người dùng nội bộ đăng xuất để huỷ phiên phía máy chủ, nhất là trên tablet dùng chung khi rời ca. API công khai: chưa đăng nhập vẫn trả thành công, chỉ bỏ qua bước ghi nhật ký. Đây cũng là đường đóng phiên khi đổi người trên thiết bị chung (ADR-011).'
  pham_vi: API-202 (SKM_AUTH_SIGN_OUT, SPEC-SKM-202), không gắn màn nào; huỷ phiên trong `sessions` (migration thuộc SC-001/DB), ghi `audit_log`.
  luong_chinh:
  - Người dùng bấm đăng xuất ở bất kỳ màn nào.
  - Máy chủ kiểm có phiên hay không; có thì ghi một dòng nhật ký đăng xuất trước.
  - Máy chủ huỷ phiên, xoá cookie rồi trả thành công.
  - Có lỗi hệ thống bất ngờ thì máy chủ trả thân JSON lỗi chuẩn, không để lỗi trần lọt ra trình duyệt.
  tieu_chi_nghiem_thu:
  - Khi đang có phiên thì nhật ký có đúng một dòng đăng xuất, ghi trước khi phiên bị huỷ.
  - Khi chưa đăng nhập thì API vẫn trả 200 và không ghi dòng nhật ký nào.
  - Khi đã đăng xuất thì dùng lại cookie cũ gọi API cần đăng nhập nhận 401 M_29.
  - Khi có lỗi bất ngờ thì trả 500 với câu chung, chi tiết chỉ nằm ở nhật ký lỗi của máy chủ.
  dinh_nghia_xong:
  - Nhật ký ghi vào bảng `audit_log` của SKM_DB, không theo tên của prototype (G-FG01-02).
