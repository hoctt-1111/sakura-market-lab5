  owner: BE-1
  priority: 2
  premise_refs: []
  gap_refs:
  - G-FG01-08
  - G-FG01-11
  - G-FG01-12
  mo_ta: Quản trị ghi đè ma trận quyền vai × thao tác; thay đổi áp ngay ở lời gọi kế tiếp vì kiểm quyền đọc bảng mỗi lần, không lưu đệm. Hệ đích dùng vai đích thay cho bốn vai của prototype (P-05). Vai thiếu dòng là không được phép, nên khi INV-Q-SD4 có đáp chỉ cần thêm dòng, không sửa mã (P-12).
  pham_vi: API-203 (SPEC-SKM-203), chưa gắn màn nào (G-FG01-11); ghi `permission_matrix` (migration thuộc SC-053/DB của FG-06, G-FG01-12) và `audit_log`.
  luong_chinh:
  - Quản trị gửi cả mảng dòng gồm vai, thao tác và cho phép hay không.
  - Máy chủ kiểm vai của phiên, rồi kiểm cả mảng trước khi ghi.
  - Máy chủ ghi đè theo khoá vai, thao tác trong một giao dịch, kèm dòng `audit_log` có trước và sau (G-FG01-08).
  tieu_chi_nghiem_thu:
  - Khi mảng rỗng hoặc có phần tử sai kiểu, sai giá trị thì trả 400 cho cả mảng, không ghi dòng nào.
  - Khi người gọi không mang vai được phép thì trả 403 M_05; phiên hết hạn thì 401 M_29.
  - Khi ghi thành công thì lời gọi kế tiếp của vai vừa bị bỏ quyền nhận 403 ngay, không chờ lưu đệm.
  - Khi ghi lỗi thì trả 500 M_25, bảng giữ nguyên như trước lời gọi.
  dinh_nghia_xong:
  - Spec API-203 đổi giá trị vai, thao tác sang danh sách đích và ghi đường gọi theo G-FG01-11.
