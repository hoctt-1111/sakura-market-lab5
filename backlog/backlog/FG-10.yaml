  mo_ta: '照合部門長 (trưởng bộ phận đối soát) hoặc 承認者 (người duyệt) xem bản nháp và duyệt kèm lý do; bản được duyệt có hiệu lực từ 発効日 (ngày hiệu lực). Người duyệt phải khác người lập, không có ngoại lệ theo vai, và mỗi khoá chỉ được duyệt tối đa 4 lần mỗi năm dương lịch.


    Ràng buộc đặc thù: Bản chỉ có hiệu lực khi người duyệt khác người lập bấm duyệt kèm lý do; hệ thống ghi người duyệt từ phiên, thời điểm và giá trị trước, sau.'
  pham_vi: Màn SC-092 (SPEC-SKM-143); API-218 theo luồng TECH-303; đổi trạng thái bản trong `business_rules`, `rule_versions`; lý do vào nhật ký kiểm toán.
  luong_chinh:
  - Người duyệt mở bản nháp từ SC-090; màn hiện khoá, bản, ngày hiệu lực, giá trị, người lập, mọi ô chỉ đọc.
  - Người duyệt nhập lý do 5–500 ký tự rồi bấm duyệt.
  - Máy chủ kiểm bản còn là nháp, người bấm khác người lập và khoá chưa đủ 4 lần duyệt trong năm.
  - Máy chủ đổi bản sang đã duyệt, ghi người duyệt, thời điểm và nhật ký có giá trị trước, sau cùng lý do.
  tieu_chi_nghiem_thu:
  - Khi người bấm duyệt là người lập thì trả 422 M_26, bản giữ nguyên.
  - Khi khoá đã có 4 lần duyệt trong cùng năm dương lịch của 発効日 thì trả 422 M_20.
  - Khi bản không còn là nháp thì trả 409 M_15; không tìm thấy bản thì trả 404 M_14.
  - Khi duyệt thành công thì nhật ký ghi giá trị đang hiệu lực trước khi đổi, giá trị mới và lý do.
  dinh_nghia_xong:
  - Câu hỏi về số người giữ vai lập và vai duyệt (G-FG10-06) có đáp, hoặc khách xác nhận có ít nhất hai người.
