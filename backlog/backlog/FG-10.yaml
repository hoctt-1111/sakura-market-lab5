  - P-10
  gap_refs:
  - G-FG10-02
  - G-FG10-05
  mo_ta: 'ルール管理者 (người quản lý quy tắc và suất) lập bản mới cho một trong năm khoá quy tắc kèm 発効日 (ngày hiệu lực) và giá trị, ví dụ 交付率 (tỷ lệ chi thưởng) của 完納奨励金 (thưởng thanh toán đủ hạn). Mỗi lần lưu tạo một bản nháp mới, bản đã lưu không bị sửa tại chỗ, và nháp chỉ có hiệu lực sau khi được duyệt ở SC-092.


    Ràng buộc đặc thù: 交付率 do người nhập, không có số mặc định; hệ số thuế 110/100 và làm tròn xuống yên cố định; bản chỉ có hiệu lực khi người khác người lập duyệt ở SC-092.'
  pham_vi: Màn SC-091 (SPEC-SKM-142); API-217 (lập bản nháp); bảng `business_rules` và `rule_versions` (chủ migration cả hai).
  luong_chinh:
  - ルール管理者 chọn khoá, nhập 発効日 và giá trị theo khoá.
  - Với khoá incentive, màn hiện hệ số thuế 110/100 và cách làm tròn xuống yên ở dạng chỉ đọc; người dùng chỉ nhập suất.
  - ルール管理者 bấm Lưu; máy chủ kiểm khoá, ngày, hình dạng giá trị và chặn hệ số thuế khác 110/100.
  - Máy chủ ghi một bản nháp mới, người lập là người của phiên, người duyệt còn trống.
  - Bản nháp hiện ở SC-090 chờ duyệt.
  tieu_chi_nghiem_thu:
  - Khi khoá không thuộc năm khoá, ngày sai định dạng hoặc giá trị sai hình dạng thì trả 400, không ghi gì.
  - Khi đã có bản cùng khoá và cùng 発効日 thì trả 409.
  - Khi client gửi hệ số thuế khác 110/100 cho khoá incentive thì máy chủ từ chối, dù giao diện đã khoá ô.
  - Khi lưu thành công thì bản ở trạng thái nháp và không có hiệu lực dù đã tới 発効日, cho tới khi được duyệt.
  - Khi lập khoá incentive thì suất do người nhập, không có số mặc định viết sẵn; bảng nhiều bậc chờ đáp của INV-GD-03 (P-10).
  dinh_nghia_xong:
  - Spec SC-091 ghi cách chống chồng hiệu lực theo ADR-004 sau khi SC-091/DB chốt (G-FG10-02).
