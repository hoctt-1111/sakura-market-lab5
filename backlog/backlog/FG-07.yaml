    Ràng buộc đặc thù: Ngoại lệ chỉ có hiệu lực khi người khác người ghi bấm Xác nhận; hệ thống ghi người xác nhận từ phiên và giờ máy chủ, ngày còn ngoại lệ chờ thì không khoá được.'
  pham_vi: Màn SC-063 (SPEC-SKM-132) trên tablet hiện trường, mở từ SC-062 hoặc khi SC-060 báo lệch; bảng `delivery_exceptions` (chủ migration, chỉ thêm dòng); API ghi và xác nhận chưa có spec, SC-063/BE viết rồi làm (P-01).
  luong_chinh:
  - Người giao hàng chọn loại, lý do trong danh mục, nhập số lượng rồi bấm Lưu; máy chủ ghi ngoại lệ ở trạng thái chờ xác nhận.
  - Người xác nhận mở ngoại lệ đang chờ, đối chiếu số và lý do rồi bấm Xác nhận.
  - Máy chủ ghi người xác nhận từ phiên và giờ máy chủ; từ đó ngoại lệ không sửa trực tiếp được.
  - Ngoại lệ đã xác nhận đi vào số ngoại lệ của đối soát ngày (SC-070).
  tieu_chi_nghiem_thu:
  - Khi người xác nhận bấm Xác nhận thì hệ thống ghi mã người xác nhận lấy từ phiên và thời điểm theo giờ máy chủ; giá trị gửi từ trình duyệt bị bỏ qua.
  - Khi người đã ghi ngoại lệ tự bấm Xác nhận thì máy chủ từ chối; giả định này giữ tới khi INV-FG07-XAC-NHAN có đáp.
  - Khi loại không thuộc bốn loại hoặc lý do không có trong danh mục thì máy chủ từ chối.
  - Khi ngày còn ngoại lệ chờ xác nhận thì SC-071 không cho khoá 業務日 (ngày nghiệp vụ) đó.
  - Khi cần sửa ngoại lệ đã xác nhận thì ghi dòng mới có lý do, dòng cũ giữ nguyên.
  dinh_nghia_xong:
  - Spec SC-063 thêm người xác nhận, nút Xác nhận và danh mục lý do theo G-FG07-05, G-FG07-06.
