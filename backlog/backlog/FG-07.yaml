  mo_ta: '配送部門 (bộ phận giao hàng) ghi từng lần 引渡し (giao hàng) của một giao dịch đã chốt: lần thứ mấy, bao nhiêu, lúc nào, ai giao. Một giao dịch giao được nhiều lần, mỗi lần là một dòng mới; số đã giao và số còn lại tính từ các dòng này và là một nguồn của đối soát ngày.'
  pham_vi: Màn SC-060 (SPEC-SKM-129) trên tablet hiện trường; bảng `deliveries` (chủ migration, chỉ thêm dòng), đọc `transactions`; API ghi chưa có spec, SC-060/BE viết rồi làm (P-01).
  luong_chinh:
  - Người giao hàng chọn giao dịch; màn hiện số lượng giao dịch, số đã giao và số còn lại.
  - Người giao hàng nhập số lượng lần này, thời điểm giao rồi bấm Đăng ký.
  - Máy chủ kiểm 業務日 (ngày nghiệp vụ) của lần giao chưa khoá, gán lần thứ kế tiếp và người thực hiện từ phiên.
  - Máy chủ thêm một dòng deliveries; luỹ kế vượt số giao dịch thì màn báo lệch và mở SC-063.
  tieu_chi_nghiem_thu:
  - Khi bấm Đăng ký thì hệ thống ghi người thực hiện của phiên và giờ máy chủ; người thực hiện gửi từ trình duyệt bị bỏ qua.
  - Khi ghi thêm lần giao cho cùng giao dịch thì có dòng mới mang lần thứ kế tiếp, các dòng cũ giữ nguyên.
  - Khi số lượng không phải số dương hoặc quá hai chữ số lẻ thì cả màn và máy chủ từ chối.
  - Khi 業務日 của lần giao đã khoá thì máy chủ từ chối bằng mã ngày đã khoá (P-24).
  - Khi luỹ kế vượt số lượng giao dịch thì máy không tự điều chỉnh; phần lệch thành ngoại lệ chờ người xử lý (P-13).
  dinh_nghia_xong:
  - Spec SC-060 ghi lại kiểu ô và cách gán lần thứ, người thực hiện theo G-FG07-01.
