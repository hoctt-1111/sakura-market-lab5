  tracker: story
  title_vi: Khung giao diện và thành phần dùng chung
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr:
    - ADR-010
    nfr: []
  labels:
  - type:story
  - spec-gap
  owner: FE-2
  priority: 3
  premise_refs:
  - P-54
  - P-55
  gap_refs:
  - G-E20-phan-trang
  - G-E20-ma-loi-ngon-ngu
  mo_ta: 'FE dựng khung giao diện dùng chung cho 72 màn và 2 khuôn báo cáo: bố cục trang, menu theo vai, bảng danh sách có lọc và phân trang, biểu mẫu báo lỗi tại ô, lớp gọi API hiện câu báo theo mã lỗi M_nn, nhãn ngày giờ theo JST. Lá FE của từng màn chỉ ghép item và luật của màn mình, không dựng lại bảng, biểu mẫu hay cách bắt lỗi. Giao diện chỉ tiếng Nhật (P-55), chuỗi nhãn đặt một chỗ để đáp của INV-UI-NGON-NGU không làm sửa từng màn.'
  pham_vi: 'Thư viện thành phần ở kho mã hệ đích: khung trang hai lớp văn phòng và tablet (chuẩn P-11: vùng chạm 64 px, tương phản 7 trên 1), menu đọc vai từ phiên, bảng lọc và phân trang theo quy ước CMN-01, biểu mẫu báo lỗi tại ô, lớp gọi API xử lý 401 M_29, 403 M_05, 500 M_06 và câu báo theo mã, ngày giờ dạng YYYY/MM/DD HH:mm theo JST, chỉ báo mất kết nối cho ba thao tác của ADR-010 (hàng đợi thuộc FG-14). Không gồm màn nghiệp vụ. Nguồn: P-54, P-55, P-11.'
  luong_chinh:
  - FE-2 cùng Tech Lead chốt danh sách thành phần dùng chung, ghi vào README kho mã.
  - FE-2 dựng khung trang, menu theo vai, hai lớp bố cục văn phòng và tablet.
  - FE-2 làm bảng danh sách lọc, phân trang theo quy ước của CMN-01 và biểu mẫu báo lỗi tại ô.
  - 'FE-2 làm lớp gọi API: 401 về màn đăng nhập rồi trở lại màn dở, 403 và 500 hiện câu chung, mã M_nn tra câu từ một bảng.'
  - FE-2 làm thành phần ngày giờ JST và một màn mẫu để lá FE khác chép theo.
  tieu_chi_nghiem_thu:
  - Khi lá FE dựng màn danh sách bằng thành phần bảng thì ô lọc, phân trang và trạng thái rỗng, lỗi, đang tải có sẵn, không viết lại.
  - Khi API trả 401 M_29 thì người dùng về màn đăng nhập, đăng nhập lại thì trở về màn dở, dữ liệu đã nhập còn nguyên.
  - Khi API trả mã M_nn thì câu báo đúng câu tiếng Nhật của bảng mã lỗi chung; 500 chỉ hiện câu chung.
  - Khi máy người dùng đặt UTC+7 thì ngày giờ trên màn vẫn theo JST; trên tablet, vùng chạm và tương phản đạt chuẩn P-11.
  dinh_nghia_xong:
  - README kho mã có danh sách thành phần dùng chung và màn mẫu.
