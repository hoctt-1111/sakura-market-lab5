  - Mọi story con của E15 đã đóng.
  - Khi một yêu cầu gộp mã làm đỏ kiểm thử hoặc vi phạm luật mỗi bảng chỉ một module được ghi thì CI chặn gộp.
  - Khi dựng lại dev hoặc môi trường thử từ cấu hình trong repo thì môi trường lên đủ thành phần và API-220 trả 200.
  - Khi ứng dụng chạy lệnh sửa hay xoá trực tiếp trên một bảng chỉ-thêm thì CSDL từ chối.
