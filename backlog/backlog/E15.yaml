- key: PLT-02-2
  cha: E15
  tracker: story
  title_vi: 'Môi trường dev: dịch vụ ADR-015 và bí mật (2/5)'
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr:
    - ADR-015
    nfr: []
  labels:
  - type:story
  owner: Infra
  priority: 3
  premise_refs: []
  gap_refs: []
  mo_ta: 'Phần 2/5: trên nền của phần 1, Infra dựng đủ dịch vụ của dev theo bảng dịch vụ của ADR-015 và đưa khoá, bí mật vào Secrets Manager. Dev chỉ chứa dữ liệu giả cho lập trình và kiểm thử tự động; môi trường thử là phần 3, nạp dữ liệu là phần 5.'
  pham_vi:
  - 'Dịch vụ của dev theo ADR-015: máy ứng dụng sau cân bằng tải có TLS, PostgreSQL, Cognito, S3, Secrets Manager, CloudWatch, CloudTrail.'
  - Khoá và bí mật đặt trong Secrets Manager, không để trong mã hay bản dựng (NFR-SEC-04).
  - Không gồm bản dự phòng đồng bộ của CSDL (phần 3) và nạp dữ liệu (phần 5).
  luong_chinh:
  - Infra thêm từng dịch vụ của ADR-015 vào cấu hình dạng mã, chạy lên dev.
  - Infra tạo bí mật trong Secrets Manager và cho ứng dụng đọc lúc khởi động.
  - Infra triển khai tay một bản dựng của PLT-01 lên dev và gọi API-220.
  - Infra ghi tên dịch vụ và cách đọc bí mật vào README hạ tầng.
  tieu_chi_nghiem_thu:
  - Khi rà dev thì có đủ dịch vụ của bảng ADR-015 và đều ở ap-northeast-1.
  - Khi quét repo và bản dựng thì không có khoá hay chuỗi kết nối; ứng dụng đọc bí mật từ Secrets Manager (NFR-SEC-04).
