  mo_ta: 'Phần 3/3, khép lại khung ghi chỉ-thêm với hai lớp chặn còn lại: Infra thu hồi quyền sửa, xoá của vai CSDL ứng dụng trên bảng chỉ-thêm và đưa luật «mỗi bảng chỉ một module được ghi» vào CI, sinh từ danh sách chủ ghi của phần 1 (G-E15-01). Phần này mang tiêu chí tổng của PLT-03: ba lớp chặn cùng có hiệu lực.'
  pham_vi:
  - Vai CSDL của ứng dụng không có quyền sửa, xoá trên 27 bảng chỉ-thêm; quyền cấp bằng script trong repo.
  - 'Luật kiểm kiến trúc trong CI: module không phải chủ bảng ghi vào bảng chỉ-thêm thì CI đỏ, sinh từ danh sách chủ ghi (G-E15-01).'
  - Không gồm migration của từng bảng (leaf DB của story làm chủ bảng).
  luong_chinh:
  - Infra viết script cấp quyền cho vai ứng dụng, bỏ quyền sửa, xoá trên bảng chỉ-thêm.
  - Infra sinh luật kiểm kiến trúc từ danh sách chủ ghi và đưa vào luồng CI của PLT-01-3.
  - BE thử ghi từ module không phải chủ bảng và thử sửa, xoá trực tiếp trên môi trường thử.
  - Kết quả hai lần thử ghi vào story; kẽ hở nếu có thì BE sửa thư viện ghi.
  tieu_chi_nghiem_thu:
  - Khi module không phải chủ bảng ghi vào bảng chỉ-thêm thì CI đỏ.
  - Khi ứng dụng sửa hay xoá trực tiếp dòng của bảng chỉ-thêm thì CSDL từ chối.
  - Khi chạy lại script cấp quyền trên môi trường thử thì không lỗi và quyền không đổi.
  dinh_nghia_xong:
  - README kho mã ghi cách thêm bảng chỉ-thêm mới vào danh sách chủ ghi và script quyền.
