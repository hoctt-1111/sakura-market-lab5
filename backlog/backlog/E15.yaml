  mo_ta: 'Nhóm việc này dựng nền kỹ thuật cho hệ đích Java 21, Spring Boot 3 chạy thành một khối triển khai trên AWS vùng Tokyo: kho mã cùng CI, môi trường phát triển (dev) và môi trường thử, khung ghi chỉ-thêm dùng chung và API kiểm sống. Mọi sub-issue BE, DB của FG-01…FG-14 đặt mã và migration vào kho này, nên mốc nền quyết định khi nào việc chức năng đóng được: kho mã và CI tối thiểu (PLT-01-1) trước khi gộp mã lá FE, BE, DB; môi trường dev (PLT-02-2) trước khi chạy ca TEST; môi trường thử (PLT-02-4) trước nghiệm thu AC, UAT, REG. Sprint của từng mốc in ở báo cáo tiến độ, tính từ chuỗi việc Infra. Nền tảng là lựa chọn của giai đoạn thiết kế (ADR-008, ADR-015), chưa phải điều khoản hợp đồng với khách.'
  pham_vi: ''
  luong_chinh: []
