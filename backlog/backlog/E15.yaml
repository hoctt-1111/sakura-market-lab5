  mo_ta: Infra tạo kho mã của hệ đích Java 21, Spring Boot 3, một khối triển khai chia module theo vùng dữ liệu (ADR-008, ADR-009), cùng luồng CI chạy ở mỗi yêu cầu gộp mã. Mọi sub-issue BE và DB đặt mã, migration vào kho này (P-02); prototype LAB-3 chỉ còn là tài liệu tham chiếu nghiệp vụ.
  pham_vi:
  - Kho mã tách khỏi kho spec LAB-4, README hai kho trỏ nhau (P-02).
  - Các module theo mục thành phần của thiết kế hệ thống, lớp api-gateway và module migration của ADR-016 (G-E15-01); không có module cho cân hay máy in (ADR-012).
  - Công cụ migration với khung trống; script của 45 bảng do leaf DB từng story viết (P-04).
  luong_chinh:
  - Infra tạo repo, bảo vệ nhánh chính, cấp quyền đẩy mã cho đội.
  - Infra dựng khung dự án, mỗi module một gói, module chỉ gọi nhau qua hàm công khai.
  - 'Infra thêm luồng CI: biên dịch, kiểm thử đơn vị, luật kiểm kiến trúc, quét bí mật.'
  - Một thành viên mở một yêu cầu gộp mã có kiểm thử đỏ và một bản sạch; kết quả CI ghi vào story.
  tieu_chi_nghiem_thu:
  - Khi yêu cầu gộp mã có kiểm thử đỏ thì CI đỏ và nhánh chính không nhận gộp.
  - Khi module gọi thẳng lớp ghi của module khác thì luật kiểm kiến trúc làm CI đỏ (ADR-009).
  - Khi mã chứa bí mật hay chuỗi kết nối thì bước quét làm CI đỏ (NFR-SEC-04).
  - Khi người mới làm theo README thì chạy được kiểm thử và một migration rỗng trên máy mình.
  dinh_nghia_xong:
  - README hai kho trỏ nhau và ghi rõ prototype LAB-3 chỉ để đối chiếu nghiệp vụ (P-02).
