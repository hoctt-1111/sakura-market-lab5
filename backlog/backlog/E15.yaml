  mo_ta: 'Phần 1/5 của việc dựng dev và môi trường thử trên AWS: Infra viết bộ cấu hình hạ tầng dạng mã trong repo, dùng chung cho hai môi trường, chỉ khác tham số, và dùng nó dựng nền của dev ở vùng ap-northeast-1 (ADR-015). Dịch vụ cụ thể của dev lên ở phần 2; phần này dừng ở cấu hình chạy được trên tài khoản trống.'
  pham_vi:
  - Một bộ cấu hình hạ tầng dạng mã cho cả hai môi trường, chỉ khác tham số; tham số của dev là bộ đầu tiên.
  - 'Nền của dev: vùng ap-northeast-1, mạng, vai và quyền cho công cụ triển khai (ADR-015).'
  - 'README hạ tầng: cách chạy cấu hình trên tài khoản trống.'
  luong_chinh:
  - Infra chọn công cụ hạ tầng dạng mã và đặt cấu hình trong repo của PLT-01.
  - Infra viết lớp nền dùng chung và tệp tham số riêng của dev.
  - Infra chạy cấu hình trên tài khoản trống để dựng nền dev, ghi các bước vào README hạ tầng.
  - Tech Lead rà cấu hình; chỗ còn làm tay phải ghi lại.
  tieu_chi_nghiem_thu:
  - Khi chạy cấu hình với tham số dev trên tài khoản trống thì nền dev lên, không có bước tay ngoài README.
  - Khi rà tài nguyên đã tạo thì mọi thứ ở ap-northeast-1 (ADR-015).
  - Khi đổi sang tham số của môi trường thử thì không phải sửa mã cấu hình, chỉ đổi tệp tham số.
  dinh_nghia_xong:
  - README hạ tầng có mục chạy cấu hình trên tài khoản trống.
