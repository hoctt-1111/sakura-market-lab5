    nfr: []
  labels:
  - type:story
  - spec-gap
  owner: PM
  priority: 3
  premise_refs:
  - P-19
  gap_refs:
  - G-E15-03
  mo_ta: Infra dựng dev và môi trường thử trên AWS, chỉ ở vùng ap-northeast-1 (ADR-015). Dev chỉ chứa dữ liệu giả cho lập trình và kiểm thử tự động; môi trường thử giống production ở quy mô nhỏ, chỉ nhận dữ liệu đã che, dùng cho nghiệm thu và các buổi diễn tập.
  pham_vi:
  - 'Thành phần theo bảng dịch vụ của ADR-015: máy ứng dụng sau cân bằng tải có TLS, PostgreSQL có bản dự phòng đồng bộ, Cognito, S3, Secrets Manager, CloudWatch, CloudTrail.'
  - Một bộ cấu hình hạ tầng dạng mã cho cả hai môi trường, chỉ khác tham số.
  - Quy trình che dữ liệu cho môi trường thử (G-E15-03); nơi lưu lạnh thêm khi INV-Q-19 có đáp (P-19).
  luong_chinh:
  - Infra viết cấu hình hạ tầng cho dev và môi trường thử trong repo.
  - Infra đặt khoá và bí mật trong Secrets Manager, không để trong mã hay bản dựng (NFR-SEC-04).
  - 'Infra nối CI của PLT-01: bản đã gộp tự lên dev, lên môi trường thử khi có người duyệt.'
  - Infra nạp dữ liệu giả vào dev và dữ liệu đã che vào môi trường thử.
  tieu_chi_nghiem_thu:
  - Khi dựng lại môi trường thử từ cấu hình trong repo trên tài khoản trống thì môi trường lên đủ, không có bước tay ngoài README.
  - Khi rà tài nguyên thì máy chạy, CSDL, sao lưu và nhật ký đều ở ap-northeast-1.
  - Khi kiểm dữ liệu thì dev không có bản ghi thật, môi trường thử không còn trường cá nhân chưa che.
  - Khi gọi API-220 trên hai môi trường sau lần triển khai đầu thì đều trả 200.
  dinh_nghia_xong:
  - Quy trình che dữ liệu có Tech Lead duyệt và ghi trong README hạ tầng (G-E15-03).
