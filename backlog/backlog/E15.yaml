- key: PLT-03
  cha: E15
  tracker: story
  title_vi: Khung ghi chỉ-thêm và bút toán đảo
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr:
    - ADR-003
    nfr: []
  labels:
  - type:story
  - spec-gap
  owner: PM
  priority: 3
  premise_refs: []
  gap_refs:
  - G-FG06-04
  - G-E15-01
  - G-E15-04
  mo_ta: 'BE làm khung dùng chung để 27 bảng chỉ-thêm chỉ có ba đường ghi: dòng gốc, dòng sửa trỏ về dòng cũ và dòng đảo, không có lệnh sửa hay xoá (ADR-003). Khung chặn ở ba lớp: luật kiểm kiến trúc trong CI, tầng dịch vụ không có hàm sửa, xoá, và quyền CSDL. Báo cáo đọc số hiện tại qua khung nhìn chuẩn nên không cộng nhầm dòng đảo.'
  pham_vi: Thư viện ghi và mẫu khung nhìn chuẩn ở phần dùng chung; danh sách bảng và module chủ ghi (G-E15-01); vai CSDL của ứng dụng không có quyền sửa, xoá. Migration của từng bảng thuộc leaf DB của story làm chủ bảng.
  luong_chinh:
  - BE cùng Tech Lead chốt nơi giữ dòng đảo (G-FG06-04) và module chủ ghi của từng bảng (G-E15-01).
  - BE làm ba hàm ghi; người ghi lấy từ phiên, giờ ghi lấy từ máy chủ.
  - BE làm mẫu khung nhìn và ca kiểm so tổng trên bảng thô với tổng trên khung nhìn (G-E15-04).
  - Infra thu hồi quyền sửa, xoá của vai ứng dụng và đưa luật kiểm kiến trúc vào CI.
  tieu_chi_nghiem_thu:
  - Khi module không phải chủ bảng ghi vào bảng chỉ-thêm thì CI đỏ.
  - Khi ứng dụng sửa hay xoá trực tiếp dòng của bảng chỉ-thêm thì CSDL từ chối.
  - Khi ghi một dòng đảo thì dòng gốc giữ nguyên và khung nhìn trả số đã trừ dòng đảo.
  - Khi bảng có dòng đảo thì tổng trên bảng thô khác tổng trên khung nhìn; ca kiểm này chạy trong CI.
  dinh_nghia_xong:
  - SKM_DB ghi nơi giữ dòng đảo, danh sách chủ ghi và khung nhìn chuẩn đã chốt.
