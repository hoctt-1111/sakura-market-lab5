  luong_chinh:
  - Infra tạo repo mã hệ đích, tách khỏi kho spec LAB-4.
  - 'Infra bật bảo vệ nhánh chính: không đẩy thẳng, chỉ gộp qua yêu cầu gộp mã.'
  - Infra cấp quyền đẩy mã cho đội và ghi danh sách quyền vào README.
