  luong_chinh:
  - Cân bằng tải gọi API-220 trên từng máy ứng dụng theo chu kỳ cấu hình.
  - Máy chủ chạy một truy vấn nhẹ tới CSDL.
  - Truy vấn thành công thì máy chủ trả 200 với status ok; lỗi thì trả 500 với status error, chi tiết chỉ vào nhật ký máy chủ.
  - Máy trả 500 bị cân bằng tải đưa ra khỏi vòng phục vụ; đồng hồ đo ghi lần hỏng nếu rơi vào cửa sổ dịch vụ.
  tieu_chi_nghiem_thu:
  - Khi CSDL nối được thì trả 200 và thân chỉ có status ok, không mang trường locale của prototype (G-E15-02).
  - Khi CSDL mất kết nối thì trả 500 với status error; thân không có mã lỗi, tên máy hay chuỗi kết nối.
  - Khi gọi không có phiên đăng nhập thì vẫn trả kết quả kiểm sống, không có 401 hay 403.
  - Khi CSDL lỗi thì nhật ký máy chủ có một dòng ghi chi tiết lỗi.
  dinh_nghia_xong:
  - Spec API-220 bỏ trường locale khỏi mẫu trả về (G-E15-02).
