  - Khi rà danh sách gói thì mỗi module của thiết kế hệ thống có đúng một gói, không có gói cho cân hay máy in (ADR-012).
  - Khi chạy kiểm thử mẫu thì mọi module xanh; migration rỗng chạy trên CSDL trống, chạy lại không lỗi.
  - Khi lá BE hay DB của một story cần đặt mã thì có sẵn gói của module chủ, không phải tạo thêm gói.
  dinh_nghia_xong:
  - README kho mã có danh sách module và gói tương ứng, ghi rõ module nào thuộc vùng dữ liệu nào.
