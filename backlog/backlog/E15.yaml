  mo_ta: 'Phần 3/5: Infra dựng môi trường thử bằng cùng bộ cấu hình, giống production ở quy mô nhỏ: PostgreSQL có bản dự phòng đồng bộ, sao lưu và khôi phục theo thời điểm, nhật ký và sao lưu đều ở ap-northeast-1 (ADR-015). Môi trường thử dùng cho nghiệm thu và diễn tập; dữ liệu nạp vào ở phần 5, nơi lưu lạnh chỉ thêm khi INV-Q-19 có đáp (P-19).'
  pham_vi:
  - Môi trường thử từ cùng cấu hình với tệp tham số riêng; đủ dịch vụ như dev.
  - CSDL có bản dự phòng đồng bộ, sao lưu tự động và khôi phục theo thời điểm, cùng kiểu cấu hình với production.
  - 'Nơi lưu lạnh cho dữ liệu đến hạn: chừa chỗ trong cấu hình, thêm khi INV-Q-19 có đáp (P-19).'
  luong_chinh:
  - Infra chạy cấu hình với tham số môi trường thử trên tài khoản trống.
  - Infra bật bản dự phòng đồng bộ và sao lưu cho CSDL, thử khôi phục về một thời điểm.
  - Infra triển khai tay một bản dựng lên môi trường thử và gọi API-220.
  - Tech Lead rà danh sách tài nguyên và vùng.
  tieu_chi_nghiem_thu:
  - Khi dựng lại môi trường thử từ cấu hình trong repo trên tài khoản trống thì môi trường lên đủ, không có bước tay ngoài README.
  - Khi rà tài nguyên thì máy chạy, CSDL, sao lưu và nhật ký đều ở ap-northeast-1.
  - Khi tắt máy CSDL chính thì bản dự phòng nhận việc; khôi phục về một thời điểm chạy được trên môi trường thử.
