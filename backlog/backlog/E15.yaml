  mo_ta: 'BE làm khung máy chủ dùng chung ở lớp api-gateway: xác thực qua Cognito với phiên cookie HttpOnly, kiểm vai theo ma trận quyền, bảng mã lỗi M_nn và định dạng lỗi chung, quy ước phân trang, hàm ghi nhật ký kiểm toán dùng chung. Lá BE của từng API chỉ còn viết luật nghiệp vụ; SC-001/BE làm API-201 trên nền phiên này (ADR-011). Ngưỡng phiên và khoá tạm đọc từ cấu hình (P-15).'
  pham_vi: 'Bộ lọc xác thực và phiên; kiểm vai đọc ma trận quyền, thiếu dòng là không cho phép (P-12); bảng mã lỗi 29 mã M_01 tới M_29 cộng hai mã theo P-46, câu tiếng Nhật (P-55), giữ ba cột ja/en/vi; quy ước phân trang cho API đọc danh sách của 55 màn chưa có API (P-01); hàm ghi audit_log trong giao dịch của bên gọi. Không gồm luật nghiệp vụ. Nguồn: P-54; ADR-011.'
  luong_chinh:
  - 'BE-1 làm bộ lọc ở api-gateway: không phiên thì 401 M_29; vai không có dòng trong ma trận thì 403 M_05, không chạm dữ liệu.'
  - 'BE-1 làm bảng mã lỗi và bộ xử lý lỗi: lỗi nghiệp vụ trả câu báo và mã; ngoại lệ bất ngờ trả 500 M_06, chi tiết vào nhật ký máy chủ.'
  - BE-1 viết quy ước phân trang, sắp xếp, lọc cho API đọc danh sách vào README kho mã.
  - BE-1 cùng SC-130/BE chốt hàm ghi audit_log dùng chung (người ghi từ phiên, giờ máy chủ, giá trị trước và sau) và luật kiểm kiến trúc chặn module khác tự ghi.
  tieu_chi_nghiem_thu:
  - Khi gọi API cần xác thực mà không có phiên hoặc phiên hết hạn thì trả 401 M_29; vai không có dòng trong ma trận thì 403 M_05, dữ liệu không đổi.
  - Khi có ngoại lệ bất ngờ thì trả 500 M_06, thân không lộ chi tiết; nhật ký máy chủ có một dòng chi tiết.
  - Khi API đọc danh sách nhận tham số trang ngoài khoảng thì trả 400; trang hợp lệ trả kèm tổng số dòng.
  - Khi module gọi hàm ghi audit_log thì dòng ghi nằm trong cùng giao dịch CSDL với thao tác; module tự thêm dòng thì CI đỏ.
  dinh_nghia_xong:
  - README kho mã có quy ước phân trang, bảng mã lỗi, cách gọi hàm ghi audit_log.
