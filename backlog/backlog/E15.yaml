  pham_vi:
  - Các module theo mục thành phần của thiết kế hệ thống, lớp api-gateway và module migration của ADR-016 (G-E15-01); không có module cho cân hay máy in (ADR-012).
  - Mỗi module một gói, chỉ gọi nhau qua hàm công khai (ADR-009); lá BE, DB của FG-01…FG-14 đặt mã và migration vào gói của module chủ (P-02).
