  pham_vi: ''
  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Mọi story con của E20 đã đóng.
  - Khi một trong sáu sprint đầu kết thúc thì có biên bản hai cuộc họp, hai báo cáo tuần đã gửi khách, và Status, Spent time, Done Date trên Project khớp việc thật.
  - Khi một nhóm chức năng vào sprint có lá dev thì story DSG của nhóm đã đóng, hoặc mọi INV mức chặn của nhóm đã có đáp.
  - Khi khách đáp khác giả định thì dòng PREMISE và issue bị ảnh hưởng được sửa trước khi lá dev liên quan bắt đầu.
