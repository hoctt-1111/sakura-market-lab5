- key: MGT-01
  cha: E20
  tracker: story
  title_vi: 'Vận hành Sprint 1: họp, báo cáo tuần khách'
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
  labels:
  - type:story
  owner: PM
  priority: 3
  premise_refs:
  - P-51
  - P-52
  - P-54
  gap_refs: []
  mo_ta: 'PM vận hành Sprint 1 (09/11/2026–22/11/2026, P-51): họp lập kế hoạch, họp cuối sprint, hai báo cáo tuần tiếng Nhật gửi khách, cập nhật Status, Spent time, Done Date trên Project, và gom câu hỏi còn mở của khách thành một gói gửi một lần. Là phần theo sprint của EF-30 LAB-1 (PM, 108 man-day), thành issue theo review PM 21/10. Sprint 1 trùng ngày khởi động theo lịch LAB-1 nên họp lập kế hoạch kiêm buổi khởi động với khách: chốt mẫu báo cáo tuần, lịch họp, kênh nhận câu hỏi; INV-PM-LICH-DOI (hạn 09/11/2026) có đáp ở buổi này.'
  pham_vi: 'Sprint 1 của 19 sprint, 14 ngày (P-51); năng lực theo số người mỗi Owner (P-52). Gồm biên bản hai cuộc họp, hai báo cáo tuần, field Project, một gói câu hỏi. Không gồm việc kỹ thuật của story và báo cáo nghiệm thu (E17). Nguồn: EF-30 (effort-other.yaml:219 của LAB-1).'
  luong_chinh:
  - 'Ngày 09/11/2026: PM chủ trì họp lập kế hoạch, chọn item theo năng lực P-52, kiểm INV chặn, đặt Sprint, Start Date, Due Date trên Project; biên bản ghi item vào sprint và lý do loại.'
  - 'Cuối mỗi tuần: PM viết báo cáo tuần tiếng Nhật (tiến độ theo story, rủi ro, câu hỏi mở), BrSE đọc lại rồi gửi khách.'
  - 'Trong sprint: PM gom câu hỏi khách còn mở (INV có hạn trong hoặc ngay sau sprint) thành một gói, gửi một lần cùng báo cáo tuần thứ nhất.'
  - 'Ngày 22/11/2026: PM chủ trì họp cuối sprint, cập nhật Status, Spent time, Done Date; item chưa xong dời sprint sau kèm lý do ở issue; biên bản gửi khách qua BrSE.'
  tieu_chi_nghiem_thu:
  - Khi sprint kết thúc ngày 22/11/2026 thì mọi issue trong sprint có Status đúng việc thật, issue đã đóng có Spent time và Done Date.
  - Khi một tuần kết thúc thì báo cáo tuần tiếng Nhật đã gửi khách, người thứ hai đã đọc, ngày gửi ghi ở issue.
  - Khi có câu hỏi khách còn mở thì chúng đi trong một gói của sprint, mỗi câu trỏ một INV; item dời sprint có lý do ở issue.
  - Khi khách chốt ngày khởi động khác 09/11/2026 thì mọi ngày Sprint và hạn INV tương đối trên Project đã dời cùng một khoảng (P-51).
  dinh_nghia_xong:
  - Biên bản họp lập kế hoạch và họp cuối sprint đính ở issue, gói câu hỏi có ngày gửi và danh sách INV.
