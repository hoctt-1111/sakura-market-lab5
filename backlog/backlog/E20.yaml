- key: DSG-01-1
  cha: E20
  tracker: story
  title_vi: 'Chốt thiết kế FG-03–FG-05: lô, 相対, せり (1/2)'
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
  labels:
  - type:story
  owner: BE-1
  priority: 3
  premise_refs:
  - P-54
  gap_refs: []
  mo_ta: 'Phần 1/2 của việc chốt thiết kế giao dịch với khách: Tech Lead (vị trí BE-1) cùng BrSE rà spec LAB-4 của ba nhóm FG-03 tiếp nhận lô, FG-04 相対取引 (giao dịch thỏa thuận) và FG-05 せり (đấu giá) trước khi nhóm vào sprint, để lá dev không làm trên giả định khách chưa thấy; điểm nặng là trạng thái bản ghi theo sơ đồ của khách và vai duyệt ở bước chờ xác nhận (P-46, P-47) và lượng khả dụng của lô khi bán một phần (P-30). Ba nhóm FG-06 tới FG-08 thuộc phần 2/2 (DSG-01-2). Đầu ra: spec sửa ở lần phát hành kế tiếp của kho spec LAB-4, PREMISE cập nhật, biên bản khách xác nhận, INV của ba nhóm có đáp. Là một phần theo nhóm của EF-01 LAB-1 (BrSE, 45 man-day), thành issue theo review PM 21/10.'
  pham_vi: 'Spec LAB-4 của FG-03, FG-04, FG-05; dòng PREMISE và chỗ hở G mà issue của ba nhóm trỏ; 10 INV của ba nhóm (1 của FG-03, 8 của FG-04, 1 của FG-05). Nguồn: EF-01 (effort-other.yaml:6 của LAB-1).'
  luong_chinh:
  - BE-1 gom dòng PREMISE, chỗ hở G và INV còn mở của FG-03 tới FG-05 thành danh sách điểm cần khách quyết, mỗi điểm kèm giả định đang dùng và phương án đề xuất.
  - BrSE viết tài liệu rà soát tiếng Nhật cho ba nhóm, người thứ hai đọc, gửi khách trước họp.
  - 'Họp với khách: BrSE dẫn, BE-1 giải thích kỹ thuật; khách quyết từng điểm, điểm chưa quyết ghi hạn mới.'
  - BrSE viết biên bản tiếng Nhật, khách xác nhận; câu trả lời ghi vào từng INV kèm ngày và người trả lời.
  - BE-1 sửa spec LAB-4 và PREMISE theo câu trả lời, ghi chú ở issue bị ảnh hưởng; PM đổi sprint nếu đáp khác giả định.
  tieu_chi_nghiem_thu:
  - Khi họp xong thì mỗi INV của ba nhóm có câu trả lời kèm ngày và người trả lời, hoặc hạn mới ghi ở issue.
  - Khi khách đáp khác giả định thì dòng PREMISE và issue bị ảnh hưởng được sửa trước khi lá dev của FG-03 tới FG-05 bắt đầu.
  - Khi biên bản gửi đi thì có xác nhận của khách kèm ngày và người thứ hai đã đọc.
  dinh_nghia_xong:
  - 'INV của ba nhóm đã đóng hoặc có hạn mới: INV-FG03-HANG-TUOI, INV-Q-11, INV-Q-21, INV-GD-01, INV-LOT-HUY, INV-Q-22, INV-FG04-XAC-NHAN, INV-LOT-KHA-DUNG, INV-FG04-BEN-BAN, INV-FG05-TAI-SERI.'
