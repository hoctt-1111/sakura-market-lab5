  - G-FG05-07
  mo_ta: 'TECH-302 lo nhánh lô ế của せり (đấu giá): lô được tái せり (đấu lại) tối đa một lần, vẫn không ai trả giá thì chuyển sang chờ 相対 (giao dịch thỏa thuận) để bán tiếp ở SC-030, hoặc bán trực tiếp qua API-209 khi quy tắc bán cho bên thứ ba bật. Bảng chuyển trạng thái của lô quyết lô đi đâu, không suy từ tên màn.

    Ràng buộc đặc thù: Lô ế không bị coi là hết hàng mà vào đúng luồng 相対 với kiểm tư cách bên mua của TECH-301, vì 相対 là kênh chính của chợ.'
  pham_vi: TECH-302 (SPEC-SKM-302) cho nhánh tái せり và chuyển 相対 của API-212; ghi `auction_results`, đổi trạng thái `lots`; phần chốt 相対 sau đó thuộc TECH-301, API-208 của FG-04, bán trực tiếp thuộc API-209 (mặc định tắt, P-18).
  luong_chinh:
  - せり進行役 (người điều hành phiên) chọn tái せり cho lô đang chờ せり; máy chủ ghi lần thử 1 là không bán được nếu chưa có dòng, rồi mở lần thử 2.
  - Lô vẫn ế thì せり進行役 chọn chuyển 相対; máy chủ kiểm lô còn chờ せり rồi chuyển lô sang chờ 相対.
  - Máy chủ ghi dòng kết quả chuyển 相対 cùng lượt đổi trạng thái lô và ghi nhật ký kiểm toán.
  - 取引運用 (nhóm vận hành giao dịch) chọn lô đó ở SC-030 để chốt 相対.
  tieu_chi_nghiem_thu:
  - Khi lô đã có lần thử 2 mà chọn tái せり nữa thì trả 409 M_23, không thêm dòng.
  - Khi lô không còn chờ せり mà chọn chuyển 相対 thì trả 409 M_10, trạng thái lô không đổi.
  - Khi chuyển 相対 thành công thì lô ở trạng thái chờ 相対, SC-030 chọn được lô và giao dịch sau đó qua kiểm tư cách của TECH-301.
  - Khi quy tắc bán cho bên thứ ba tắt thì lô ế chỉ đi được đường 相対 (P-18).
  dinh_nghia_xong:
  - Spec TECH-302 sửa bước 4.3 từ ghi đè sang thêm dòng (G-FG05-02).
