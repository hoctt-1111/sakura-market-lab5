  mo_ta: 'せり進行役 (người điều hành phiên せり) nhập kết quả cuối của từng lô: trúng giá kèm người trúng và đơn giá, tái せり (đấu lại), hoặc chuyển sang 相対 (giao dịch thỏa thuận). Hệ thống không đọc ảnh hay suy 符丁 (mật mã giá); người bấm Đăng ký được lưu làm người xác nhận.

    Ràng buộc đặc thù: Người trúng phải có quyền ứng giá せり và giấy còn hiệu lực tại ngày chốt: 仲卸 (trung gian bán buôn) theo 許可 (giấy phép), 売買参加者 (người tham gia mua bán) theo 承認 (chấp thuận); kiểm ở máy chủ.'
  pham_vi: Màn SC-040 (SPEC-SKM-123); API-212, nhánh lô ế theo TECH-302; bảng `auction_results` (chủ migration), ghi `transactions` kênh せり qua module trade, đổi trạng thái `lots`.
  luong_chinh:
  - せり進行役 chọn phiên của 業務日 (ngày nghiệp vụ) và một lô đang chờ せり.
  - Người điều hành chọn trúng giá, tái せり hoặc chuyển 相対; trúng giá thì chọn người trúng, nhập đơn giá yên/kg.
  - Máy chủ kiểm lô; với trúng giá thì kiểm quyền ứng giá và giấy của người trúng tại ngày chốt.
  - Máy chủ ghi kết quả mang người bấm, đổi trạng thái lô, và khi trúng giá ghi giao dịch kênh せり, cùng một giao dịch CSDL.
  tieu_chi_nghiem_thu:
  - Khi trúng giá mà thiếu người trúng hoặc đơn giá ≤ 0 thì trả 400 M_08, không ghi gì.
  - Khi người trúng không có quyền ứng giá せり thì trả 403 M_27; giấy tạm dừng, 失効 (mất hiệu lực) hoặc quá hạn tại ngày chốt thì trả 422 M_21.
  - Khi ghi thành công thì kết quả lưu người bấm lấy từ phiên và giờ máy chủ, không lấy giá trị gửi kèm.
  - Khi tái せり lần hai thì trả 409 M_23; lỗi ở lệnh ghi nào cũng không ghi gì, trả 500 M_25.
  dinh_nghia_xong:
  - Spec SC-040 thêm số lượng, thời điểm ghi (G-FG05-01).
