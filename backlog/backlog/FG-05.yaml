  mo_ta: 'せり進行役 (người điều hành phiên せり) nhập kết quả cuối của từng lô: trúng giá, tái せり (đấu lại) hoặc chuyển 相対 (giao dịch thỏa thuận). Hệ thống không đọc ảnh hay suy 符丁 (mật mã giá); kết quả trúng giá chờ người khác duyệt.

    Ràng buộc đặc thù: Giấy của người trúng xét tại ngày chốt: 仲卸 (trung gian bán buôn) theo 許可 (giấy phép), 売買参加者 (người tham gia mua bán) theo 承認 (chấp thuận); kiểm ở máy chủ.'
  pham_vi: Màn SC-040 (SPEC-SKM-123); API-212, lô ế theo TECH-302; bảng `auction_results` (chủ migration), `transactions` kênh せり, `lots`.
  luong_chinh:
  - せり進行役 chọn phiên của 業務日 (ngày nghiệp vụ) và một lô đang chờ せり.
  - Chọn trúng giá, tái せり hoặc chuyển 相対; trúng giá thì chọn người trúng, nhập đơn giá yên/kg và số lượng.
  - Máy chủ kiểm lô, quyền ứng giá và giấy; trúng giá thì ghi kết quả, giao dịch kênh せり ở 確認待ち, hai loại kia ghi ngay.
  - Người khác người nhập 承認 (lưu người duyệt, giờ; lô hết thì sang đã bán) hoặc 却下 kèm lý do.
  tieu_chi_nghiem_thu:
  - Khi trúng giá mà thiếu người trúng hoặc đơn giá thì trả 400 M_08; số lượng ≤ 0 hoặc vượt lô bị từ chối như SC-040/BE; không ghi gì.
  - Khi người trúng không có quyền ứng giá せり thì trả 403 M_27; giấy tạm dừng, 失効 (mất hiệu lực) hay quá hạn thì trả 422 M_21.
  - Khi gửi thì lưu người nhập, số lượng, giờ máy chủ từ phiên; khi duyệt thì lưu người duyệt, giờ máy chủ (FR-SERI-02).
  - Khi tự duyệt thì trả 422 SELF_CONFIRM_FORBIDDEN, vai không được duyệt thì 403 M_05.
  - Khi tái せり lần hai thì trả 409 M_23; lỗi ghi thì không ghi gì, trả 500 M_25.
  dinh_nghia_xong:
  - Spec SC-040 thêm ô số lượng, chế độ xác nhận, nhãn B-2 người nhập.
