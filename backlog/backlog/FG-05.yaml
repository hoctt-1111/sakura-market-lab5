  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Giao dịch kênh せり ghi qua cùng hàm chốt giao dịch của module trade mà API-208 dùng; ngày giao dịch là 業務日 (ngày nghiệp vụ) giờ Nhật (G-FG04-02).
  - Người nhập và người duyệt lấy từ phiên, hai người phải khác nhau (422 SELF_CONFIRM_FORBIDDEN); số lượng giao dịch lấy từ ô số lượng trúng, không vượt phần còn lại của lô (P-46, P-47).
  - 'Lúc gửi trúng giá: kết quả, giao dịch và sự kiện 提出 ghi cùng một giao dịch CSDL, lô chưa đổi; lúc 承認: sự kiện 承認 (basis_*, trade_no) và đổi lô khi phần còn lại tính từ dòng 確定, 更正 bằng 0 ghi cùng một giao dịch CSDL; 却下 không đổi lô.'
  - Lệnh 承認, 却下 viết spec theo khuôn P-01, chỉ nhận giao dịch đang 確認待ち (khác thì 409 RECORD_STATE_INVALID); lô đang có kết quả trúng giá 確認待ち thì kết quả khác cho lô trả 409 M_10; 却下 rồi nhập lại thì thêm dòng auction_results mới cùng lần thử.
  - Lệnh ghi thất bại trả 500 mã SAVE_FAILED (M_25) kèm câu của M_25 «Lưu thất bại», không dùng câu chung của M_06 (P-49).
  - Số lượng ≤ 0 trả 400 với câu 入力内容が不正です không mã M_nn, như spec SC-040 dùng cho giá trị lạ; M_08 chỉ cho thiếu người trúng hoặc đơn giá.
