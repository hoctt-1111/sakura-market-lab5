    Ràng buộc đặc thù: Nhánh trúng giá dùng chung luật hai tầng 許可 (giấy phép) / 承認 (chấp thuận) với 相対 (giao dịch thỏa thuận), chỉ đổi mã quyền thành quyền ứng giá せり.'
