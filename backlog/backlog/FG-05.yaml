  luong_chinh:
  - Mở màn thì máy chủ trả trang đầu của 業務日 hiện tại.
  - Người dùng lọc theo ngày và trạng thái; dữ liệu không đổi.
  - せり進行役 bấm tạo phiên cho một ngày; máy chủ tạo hai phiên theo khung giờ của 業務規程 (quy chế nghiệp vụ).
  tieu_chi_nghiem_thu:
  - Khi tạo phiên cho một ngày thì có đúng hai phiên, Ca 1 05:00–07:00 và Ca 2 15:00–16:30; tạo lần hai cho cùng ngày thì trả 409.
  - Khi lô có hai lần thử thì danh sách hiện cả hai dòng, mỗi dòng mang người nhập của lần đó.
  - Khi kết quả của lô đã sửa thì dòng hiện giá trị trước, sau và lý do (G-FG05-03).
  - Khi 内部監査 xem mà ma trận quyền chưa có dòng cho vai này thì máy chủ trả 403 (P-12).
  - Khi máy chạy kiểm thử đặt múi giờ UTC+7 và nhập lúc 02:31 JST thì 業務日 ghi đúng ngày JST và màn hiển thị giờ JST.
  dinh_nghia_xong:
  - Spec SC-041 thêm nút tạo phiên và cột trước, sau, lý do (G-FG05-03, G-FG05-04).
  - Ràng buộc duy nhất theo ngày và ca ghi lại vào SKM_DB (G-FG05-05).
