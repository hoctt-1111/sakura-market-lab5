  - Module notify hoặc tác vụ nền thêm một dòng alert_queue mang loại, mức khẩn, nguồn và giờ tạo.
  - 運用管理者 mở SC-122, lọc theo 業務日 (ngày nghiệp vụ) và trạng thái; dòng chưa xử lý đứng trước, mức khẩn cao hơn ở trên.
  - Người dùng xử lý xong ngoài màn (gửi lại, chạy lại tác vụ) rồi bấm Đã xử lý kèm ghi chú.
  - Máy chủ ghi người của phiên và giờ máy chủ vào dòng cảnh báo, thêm một dòng `audit_log`.
  tieu_chi_nghiem_thu:
  - Khi bấm Đã xử lý thì hệ thống ghi người xử lý của phiên, giờ máy chủ và ghi chú; người và giờ gửi từ trình duyệt bị bỏ qua.
  - Khi một thông báo hỏng sau 3 lần thử lại thì có đúng một cảnh báo mới trỏ về dòng nhật ký đó (AC-7).
  - Khi EV3 hết lượt thử thì có một cảnh báo; ngày đó chưa có bảng đối soát nên SC-071 chưa cho khoá (P-14).
  - Khi cảnh báo đã xử lý thì không đánh dấu lại được; máy không tự đóng cảnh báo nào.
  - Khi 運用管理者 chưa có dòng trong ma trận quyền thì API trả 403 M_05 (P-12).
  dinh_nghia_xong:
  - Spec SC-122 có nút Đã xử lý, cột nguồn và cách suy trạng thái theo G-FG12-04.
