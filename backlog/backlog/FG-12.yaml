  mo_ta: '運用管理者 (quản lý vận hành) đặt cho từng sự kiện thông báo: ai nhận, ngưỡng nào thì gửi, giờ nào gửi. Đổi cấu hình chỉ áp cho lần gửi sau, nhật ký các lần đã gửi giữ người nhận lúc đó (FR-NOTIFY-03). Vai 運用管理者 chưa gán vai nội bộ nên màn chưa dùng được tới khi khách trả lời Q-SD4 (P-12).'
  pham_vi: Màn SC-120 (SPEC-SKM-160) ở văn phòng; bảng `notification_settings` (chủ migration, sửa được, mỗi lần đổi ghi `audit_log` có trước và sau); API đọc và lưu chưa có spec, SC-120/BE viết rồi làm (P-01). Việc gửi thuộc SC-121/BE.
  luong_chinh:
  - 運用管理者 mở SC-120; máy chủ kiểm vai rồi trả cấu hình hiện hành của từng sự kiện.
  - Người dùng chọn sự kiện, sửa người nhận, ngưỡng hoặc giờ gửi rồi bấm Lưu.
  - Máy chủ kiểm bốn ô bắt buộc, ghi cấu hình mới và một dòng `audit_log` có trước, sau, người sửa của phiên, giờ máy chủ.
  - Lần gửi kế tiếp của sự kiện đó đọc cấu hình mới; nhật ký cũ không đổi.
  tieu_chi_nghiem_thu:
  - Khi bấm Lưu thì cấu hình mới có hiệu lực ngay, không phải bản nháp, và `audit_log` có một dòng trước, sau (G-FG12-05).
  - Khi sự kiện là tư cách sắp hết hạn thì ngưỡng chính là tham số 失効間近 (sắp hết hạn) mà SC-014 và SC-103 cùng đọc, khởi tạo 30 ngày (P-09); hệ thống không giữ hai số khác nhau.
  - Khi sự kiện mang mức Critical (khẩn nhất) thì giờ gửi không làm chậm việc gửi; mức khẩn của từng sự kiện chờ đáp của G-FG12-01.
  - Khi 運用管理者 chưa có dòng trong ma trận quyền thì mọi lời gọi bị trả 403 M_05; khách gán vai thì chỉ thêm dòng ma trận (P-12).
  dinh_nghia_xong:
  - Spec SC-120 ghi nghĩa của ngưỡng và giờ gửi theo từng sự kiện, bỏ chữ «bản nháp» ở nút Lưu (G-FG12-05).
