  mo_ta: 'Nhóm chức năng này gửi 通知 (thông báo) trong ứng dụng và qua email khi có bốn sự kiện nền: tư cách sắp hết hạn, tranh chấp đang mở, lỗi xuất dữ liệu và giao hàng tồn đọng; SMS và FAX nằm ngoài phạm vi. Mỗi lần gửi để lại một dòng nhật ký không sửa được; email lỗi thì thử lại tối đa 3 lần, vẫn hỏng thì thông báo chuyển vào hàng đợi cảnh báo để 運用管理者 (quản lý vận hành) xử lý. Hệ thống không dùng kênh đẩy thời gian thực (ADR-013), và thông báo mức Critical (khẩn nhất) phải gửi xong trong 5 phút.'
  pham_vi: ''
  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Mọi story con của FG-12 đã đóng.
  - Khi email của một thông báo lỗi ở mọi lần gửi thì hệ thống thử lại đúng 3 lần, ghi trạng thái cuối vào nhật ký gửi và đẩy một cảnh báo vào SC-122; thông báo trong ứng dụng vẫn hiện (AC-7).
  - Khi đổi người nhận hoặc ngưỡng ở SC-120 thì các dòng nhật ký của những lần gửi trước giữ nguyên người nhận lúc gửi.
  - Các issue điều tra của FG-12 đã có câu trả lời, hoặc khách xác nhận giữ giả định đang dùng.
  dinh_nghia_xong: []
