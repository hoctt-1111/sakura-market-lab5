  mo_ta: 運用管理者 (quản lý vận hành) tra nhật ký từng lần gửi thông báo để biết hệ thống đã báo cho ai, lúc nào, có tới nơi không. Nhật ký chỉ thêm dòng, mỗi dòng mang sự kiện, kênh gửi, giờ gửi, số lần thử lại và trạng thái cuối. Bảng thiếu người nhận và giờ phát sinh sự kiện, DATA-FG12 bổ sung (G-FG12-02).
  pham_vi:
  - Màn SC-121 (SPEC-SKM-161) ở văn phòng, chỉ đọc `notification_log` (migration thuộc DATA-FG12/DB); API đọc chưa có spec, SC-121/BE viết rồi làm (P-01).
