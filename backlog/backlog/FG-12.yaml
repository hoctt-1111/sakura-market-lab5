  luong_chinh:
  - Module party, settle hoặc delivery gọi hàm gửi khi có sự kiện; notify gửi trong ứng dụng và qua email.
  - Email lỗi thì notify thử lại tối đa 3 lần, rồi thêm một dòng nhật ký cho mỗi người nhận và mỗi kênh với trạng thái cuối.
  - Hết lượt mà vẫn lỗi thì notify đẩy một cảnh báo vào SC-122.
  - 運用管理者 mở SC-121, lọc theo 業務日 (ngày nghiệp vụ) và trạng thái; dòng mới nhất đứng trước.
  tieu_chi_nghiem_thu:
  - Khi email lỗi ở mọi lần gửi thì dòng nhật ký có trạng thái cuối là lỗi, số lần thử lại là 3, và SC-122 có một cảnh báo; thông báo trong ứng dụng vẫn hiện (AC-7).
  - Khi lọc theo 業務日 thì chỉ hiện dòng có giờ gửi thuộc ngày đó theo giờ Nhật.
  - Khi xem một dòng thì biết người nhận và độ trễ từ lúc sự kiện phát sinh tới lúc gửi xong (G-FG12-02).
  - Khi 運用管理者 chưa có dòng trong ma trận quyền thì API đọc trả 403 M_05 (P-12).
  - Khi máy chạy kiểm thử đặt múi giờ UTC+7 và nhập lúc 02:31 JST thì 業務日 ghi đúng ngày JST và màn hiển thị giờ JST.
  dinh_nghia_xong:
  - Spec SC-121 đổi nhãn cột kênh thành kênh gửi và thêm cột người nhận (G-FG12-03, G-FG12-02).
