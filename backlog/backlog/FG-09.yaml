  - G-FG09-05
  - G-FG09-06
  mo_ta: '照合事務 (nhóm đối soát) và 財務部門 (bộ phận tài chính) tra các dòng 次期差分 (chênh lệch đẩy sang kỳ sau) của 完納奨励金 (thưởng thanh toán đủ hạn): hoá đơn nào, kỳ phát sinh, kỳ phản ánh, số chênh và lý do. Dòng đã 確定 (xác nhận cuối) và báo cáo kỳ trước giữ nguyên; điều chỉnh về sau chỉ hiện ở đây.

    Ràng buộc đặc thù: Số chênh là hiệu của hai số tiền đã làm tròn xuống yên, cột chênh lệch lưu số nguyên yên, nên kỳ sau không cộng phần lẻ.'
  pham_vi: Màn SC-082 (SPEC-SKM-140); API đọc danh sách chênh lệch viết mới ở SC-082/BE (G-FG09-04); bảng `incentive_adjustments` (chỉ đọc, migration thuộc DATA-FG09).
  luong_chinh:
  - Người dùng mở màn; máy chủ trả các dòng chênh lệch, trang đầu.
  - Người dùng nhập 業務日 (ngày nghiệp vụ) rồi bấm Lọc.
  - Máy chủ trả danh sách đã lọc; màn không đổi dữ liệu.
  tieu_chi_nghiem_thu:
  - Khi một dòng đã 確定 được tính lại ra số khác thì có đúng một dòng chênh lệch mới, dòng thưởng gốc không đổi.
  - Khi chạy lại 判定 (xét) mà số không đổi thì danh sách không thêm dòng nào (G-FG09-05).
  - Khi lọc theo 業務日 thì danh sách chỉ còn dòng thuộc kỳ chứa ngày đó, theo đơn vị kỳ chốt ở G-FG09-02.
  - Khi người xem ngoài 照合事務 và 財務部門, hoặc 財務部門 chưa có dòng trong ma trận quyền, thì máy chủ trả 403 (P-12).
  dinh_nghia_xong:
  - Cách xác nhận và đưa chênh lệch vào kỳ sau cập nhật theo đáp của câu hỏi ở G-FG09-06.
