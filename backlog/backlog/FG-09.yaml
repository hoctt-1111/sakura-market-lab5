  mo_ta: '照合事務 (nhóm đối soát) chọn kỳ đã chốt sổ, bấm 判定 (xét) để máy gợi ý 完納奨励金 (thưởng thanh toán đủ hạn) cho từng hoá đơn, rồi 確定 (xác nhận cuối) từng dòng đủ điều kiện kèm lý do. Ô số tiền chỉ đọc; mỗi lần 確定 một hoá đơn.

    Ràng buộc đặc thù: Số gợi ý nhân 110/100 trước rồi làm tròn xuống yên, theo suất của bản quy tắc hiệu lực tại hạn thanh toán; trả sau hạn được 0.'
  pham_vi: Màn SC-080 (SPEC-SKM-138); API-215 (判定), API-216 (確定) theo TECH-304; bảng `incentives` (chủ migration), đọc `invoices`, `payments`, bản quy tắc của FG-10.
  luong_chinh:
  - 照合事務 chọn kỳ đã chốt sổ; màn hiện kết quả cũ nếu có.
  - 照合事務 bấm 判定; máy chủ tính theo TECH-304, lưu dòng gợi ý chưa có người xác nhận.
  - Màn hiện cờ 判定, số tiền đủ điều kiện, suất, hệ số thuế, số tiền, lý do từng dòng.
  - 照合事務 chọn một dòng đủ điều kiện, nhập lý do, bấm 確定.
  - Máy chủ ghi người bấm, giờ máy chủ, nhật ký trước, sau; dòng khoá lại.
  tieu_chi_nghiem_thu:
  - Khi tích số tiền đủ điều kiện, suất và 110/100 có phần lẻ thì số gợi ý là tích đó làm tròn xuống yên một lần ở cuối.
  - Khi hoá đơn trả sau hạn, dù một ngày nghiệp vụ, thì số tiền gợi ý bằng 0.
  - Khi 確定 thì lưu người của phiên, giờ máy chủ, nhật ký có lý do 5–500 ký tự; dòng không đủ điều kiện trả 422 M_12, dòng đã 確定 trả 409 M_03 và không đổi khi chạy lại 判定.
  - Khi lưu dòng gợi ý thất bại thì API trả 500 SAVE_FAILED, màn không cho 確定 (P-22).
  dinh_nghia_xong:
  - Spec SC-080 sửa theo đáp của INV-GD-03.
