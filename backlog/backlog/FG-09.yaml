  mo_ta: 'Nhóm chức năng này tính 完納奨励金 (thưởng thanh toán đủ hạn) cho từng hoá đơn của kỳ đã chốt sổ: máy 判定 (xét) đủ hay không đủ điều kiện và tính số tiền gợi ý, còn người của nhóm đối soát 確定 (xác nhận cuối) từng dòng kèm lý do. Dòng đã 確定 không bao giờ bị sửa; sai số phát hiện về sau ghi thành 次期差分 (chênh lệch đẩy sang kỳ sau).

    Ràng buộc đặc thù: Số tiền bằng số tiền đủ điều kiện nhân 交付率 (tỷ lệ chi thưởng) của bản quy tắc có hiệu lực tại hạn thanh toán và nhân hệ số thuế 110/100, nhân xong mới làm tròn xuống yên; trả sau hạn thì bằng 0, và tiền chỉ coi là chốt khi có người 確定.'
  pham_vi: ''
  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Mọi story con của FG-09 đã đóng.
  - Khi chạy 判定 cho một kỳ thì mỗi hoá đơn của kỳ có đúng một dòng gợi ý mang suất và ngày hiệu lực của bản quy tắc áp tại hạn thanh toán, chưa có người xác nhận.
  - Khi một dòng được 確定 thì hệ thống ghi người, thời điểm, lý do và giá trị trước, sau; không có đường nào 確定 nhiều dòng một lần hay 確定 không qua người bấm.
  - INV-GD-03 và INV-TECH-304 đã có câu trả lời, hoặc khách và Tech Lead xác nhận giữ giả định P-10, P-22.
  dinh_nghia_xong: []
