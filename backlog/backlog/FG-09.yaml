  mo_ta: '照合事務 (nhóm đối soát), 財務部門 (bộ phận tài chính) và 内部監査 (kiểm toán nội bộ) mở một dòng 完納奨励金 (thưởng thanh toán đủ hạn) để xem đủ điều kiện hay không, số tiền tính từ đâu, theo bản quy tắc nào và ai 確定 (xác nhận cuối) lúc nào. Màn chỉ đọc; đây là chỗ giải trình một khoản thưởng khi có tranh chấp.

    Ràng buộc đặc thù: Màn hiện đủ số tiền đủ điều kiện, suất, hệ số 110/100 và ngày hiệu lực bản quy tắc để người xem tự tính lại số tiền, và tách dòng gợi ý khỏi dòng đã 確定.'
  pham_vi: Màn SC-081 (SPEC-SKM-139); API đọc một dòng thưởng viết mới ở SC-081/BE (G-FG09-04); bảng `incentives` (chỉ đọc) kèm hoá đơn ở `invoices`.
  luong_chinh:
  - Người dùng mở chi tiết theo mã hoá đơn.
  - Máy chủ kiểm vai người xem rồi trả dòng thưởng cùng hoá đơn.
  - Màn hiện cờ 判定 (xét), số tiền đủ điều kiện, suất, hệ số thuế, số tiền, lý do, người và thời điểm 確定.
  - Người dùng bấm Quay lại; màn không ghi gì.
  tieu_chi_nghiem_thu:
  - Khi dòng chưa 確定 thì người và thời điểm xác nhận để trống và màn ghi rõ đây là gợi ý của máy.
  - Khi dòng đã 確定 thì người, thời điểm và ngày hiệu lực bản quy tắc hiện đúng như bản ghi.
  - Khi lấy số tiền đủ điều kiện nhân suất nhân 110/100 rồi làm tròn xuống yên thì ra đúng số tiền trên màn.
  - Khi người xem thuộc 財務部門 hoặc 内部監査 mà ma trận quyền chưa có dòng cho vai đó thì máy chủ trả 403 (P-12).
  dinh_nghia_xong:
  - Spec SC-081 sửa ánh xạ dữ liệu của ô số tiền đủ điều kiện (G-FG09-03).
