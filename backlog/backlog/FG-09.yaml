  mo_ta: 'TECH-304 là luồng lõi của 完納奨励金 (thưởng thanh toán đủ hạn): máy 判定 (xét) từng hoá đơn và lưu gợi ý, người 確定 (xác nhận cuối) từng dòng, dòng đã 確定 mà tính lại khác thì sinh 次期差分 (chênh lệch đẩy sang kỳ sau). Bảy yếu tố của BR-INC-01 nằm trong một dịch vụ dùng chung.

