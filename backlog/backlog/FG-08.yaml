  pham_vi: Bảng `daily_reconciliations` (chỉ thêm dòng), `disputes` (sửa được, lịch sử ở audit_log) và `monthly_closings` (chỉ thêm dòng, mỗi kỳ một dòng) theo SKM_DB; thêm cho disputes cột ngày hẹn xử lý, cột trỏ tới ngày đối soát và cột người đóng (G-FG08-05).
  luong_chinh:
