  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Mọi story con của FG-08 đã đóng.
  - Khi một 業務日 còn tranh chấp chưa đóng hoặc ngoại lệ giao hàng chờ xác nhận thì lệnh khoá ngày bị từ chối.
  - Khi ngày đã khoá thì mọi đường ghi thẳng vào dữ liệu của ngày đó (huỷ giao dịch, ghi giao hàng, ghi ngoại lệ) bị chặn bằng mã ngày đã khoá và có dòng audit_log.
  - Các issue điều tra của FG-08 đã có câu trả lời, hoặc người trả lời xác nhận giữ giả định đang dùng.
  dinh_nghia_xong: []
