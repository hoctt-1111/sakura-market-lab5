  - Khi sửa hoặc xoá dòng daily_reconciliations, monthly_closings thì bị chặn ở mức quyền cơ sở dữ liệu.
  dinh_nghia_xong:
  - SKM_DB ghi lại cột mới của disputes theo G-FG08-05.
