    - monthly_closings
    fr: []
    adr: []
    nfr: []
  labels:
  - type:story
  - spec-gap
  owner: PM
  priority: 2
  premise_refs: []
  gap_refs:
  - G-FG08-01
  mo_ta: Lệnh chốt hoá đơn tháng gom giao dịch せり (đấu giá) và 相対 (giao dịch thỏa thuận) của một tháng thành hoá đơn theo bên mua, loại 直販 (bán trực tiếp) vì đã trả tiền ngay. Spec LAB-4 gắn lệnh này vào nút Lưu của SC-071 nên mỗi lần khoá một 業務日 (ngày nghiệp vụ) sẽ chốt cả tháng; story này tách nó thành việc riêng, gọi độc lập với khoá ngày (G-FG08-01). Hoá đơn là đầu vào của 完納奨励金 (thưởng thanh toán đủ hạn) ở FG-09.
  pham_vi: API-213 SKM_BILLING_CLOSE trên module settle; ghi `monthly_closings` (migration thuộc DATA-FG08) và `invoices` (migration thuộc DATA-FG09). Màn gọi và vai được chạy chốt sổ chốt cùng PM; thứ tự với khoá ngày chờ INV-FG08-KHOA-NGAY.
  luong_chinh:
  - Người được giao việc chốt sổ chọn tháng áp dụng rồi gửi lệnh chốt.
  - Máy chủ kiểm định dạng tháng, tháng chưa chốt và quy tắc hạn thanh toán đã có.
  - Máy chủ gom giao dịch せり và 相対 còn hiệu lực của tháng theo bên mua, bỏ 直販 và giao dịch có dòng huỷ.
  - Máy chủ ghi một dòng chốt tháng và các hoá đơn trong cùng giao dịch CSDL; FG-09 dùng mã kỳ của lần chốt này.
  tieu_chi_nghiem_thu:
  - Khi tháng đã chốt thì trả 409 ALREADY_CLOSED; khi tháng không có giao dịch thì trả 422 NO_TRANSACTIONS; cả hai không ghi gì.
  - Khi chốt thành công thì mỗi bên mua có đúng một hoá đơn và tổng hoá đơn bằng tổng giao dịch còn hiệu lực của tháng.
  - Khi lỗi ghi ở bất kỳ bước nào thì không còn dòng chốt hay hoá đơn nào, trả 500 M_25.
  - Khi người đối soát khoá một 業務日 ở SC-071 thì không có lệnh chốt tháng nào chạy kèm.
  dinh_nghia_xong:
  - Spec API-213 ghi lệnh gọi độc lập với khoá ngày, màn gọi, vai được chạy và thứ tự với khoá ngày theo đáp của INV-FG08-KHOA-NGAY.
