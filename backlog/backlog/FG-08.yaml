  - G-FG08-04
  mo_ta: '照合事務 (nhóm đối soát) xem bảng 日次照合 (đối soát ngày): mỗi 業務日 (ngày nghiệp vụ) có số giao dịch, số lần giao, số ngoại lệ, tổng tiền và giờ lập. Bảng do tác vụ nền EV3 lập sau khi hết ngày; chỗ lệch giữa ba nguồn được mở thành tranh chấp chứ không tự sửa số.'
  pham_vi: Màn SC-070 (SPEC-SKM-134) ở văn phòng, chỉ xem; tác vụ EV3 thêm dòng `daily_reconciliations` (migration thuộc DATA-FG08) và mở `disputes`; đọc `transactions`, `transaction_cancellations`, `deliveries`, `delivery_exceptions`; API đọc chưa có spec, SC-070/BE viết rồi làm (P-01).
  luong_chinh:
  - Hết 業務日, tác vụ EV3 đếm giao dịch còn hiệu lực, lần giao và ngoại lệ của ngày, cộng tổng tiền rồi thêm một dòng đối soát.
  - Khi ba nguồn lệch nhau, tác vụ mở tranh chấp cho ngày đó; ngày chưa khoá được tới khi tranh chấp đóng.
  - Lỗi thì tác vụ thử lại theo tham số; hết lượt thì dừng và đẩy cảnh báo vào SC-122 (P-14).
  - Người đối soát lọc theo khoảng ngày và xem dòng mới nhất của từng ngày.
  tieu_chi_nghiem_thu:
  - Khi EV3 chạy lại cho cùng 業務日 thì có thêm dòng mới, dòng cũ giữ nguyên và màn hiện dòng có giờ lập mới nhất.
  - Khi giao dịch đã có dòng huỷ thì không được tính vào số giao dịch và tổng tiền của ngày (G-FG08-04).
  - Khi ba nguồn lệch thì có một tranh chấp đang mở cho ngày đó.
  - Khi tác vụ hết số lần thử thì không có dòng đối soát mới, ngày không bị khoá và SC-122 có một cảnh báo (P-14).
  - Khi người gọi không mang vai 照合事務 thì máy chủ trả 403 M_05; vai hệ đích theo P-12.
  dinh_nghia_xong:
  - Spec SC-070 ghi cách đếm giao dịch còn hiệu lực và luật lệch của EV3 theo G-FG08-04.
