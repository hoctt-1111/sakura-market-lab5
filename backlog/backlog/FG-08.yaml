  mo_ta: 'API ghi một khoản 入金 (tiền về) cho một hoá đơn rồi trả trạng thái chưa trả, trả một phần hay đã trả đủ theo tổng đã nhận. Số này là đầu vào của 完納奨励金 (thưởng thanh toán đủ hạn) ở FG-09: trả sau hạn hoặc chưa đủ thì không được thưởng. API chưa gắn màn nào, nên màn gọi và vai được ghi phải chốt trước khi làm (G-FG08-07).'
  pham_vi: API-214 SKM_PAYMENT_CREATE trên module settle; thêm dòng `payments`, đọc `invoices` (migration của hai bảng thuộc FG-09); trạng thái hoá đơn tính từ tổng các dòng payments theo ADR-003.
  luong_chinh:
  - Người được giao việc ghi tiền về gửi mã hoá đơn, số tiền, ngày trả và cách trả.
  - Máy chủ kiểm hoá đơn tồn tại, số tiền dương và ngày trả không ở tương lai theo giờ Nhật.
  - Máy chủ thêm một dòng payments với người ghi lấy từ phiên.
  - Máy chủ tính lại trạng thái hoá đơn từ tổng đã trả và trả về.
  tieu_chi_nghiem_thu:
  - Khi thiếu trường, số tiền không dương, ngày trả sai định dạng hoặc ở tương lai thì trả 400, không ghi gì.
  - Khi hoá đơn không tồn tại thì trả 404 M_14.
  - Khi ghi thành công thì có đúng một dòng payments mang người ghi của phiên; trạng thái trả về khớp tổng đã trả.
  - Khi lỗi ghi thì không có dòng nào được thêm, trả 500 M_25.
  dinh_nghia_xong:
  - Spec API-214 ghi màn gọi, vai được ghi và cách tính trạng thái hoá đơn theo G-FG08-07.
