  mo_ta: Nhóm chức năng này gom giao dịch, giao hàng và ngoại lệ của mỗi 業務日 (ngày nghiệp vụ) thành bảng 日次照合 (đối soát ngày), mở tranh chấp cho chỗ lệch, rồi để người của bộ phận đối soát khoá ngày. Sau khi khoá, mọi sửa đổi đi đường điều chỉnh có duyệt của FG-06, còn lần sửa thẳng bị chặn và ghi nhật ký. Hai API chốt hoá đơn tháng và ghi tiền về chỉ hỗ trợ việc tính 完納奨励金 (thưởng thanh toán đủ hạn) ở FG-09.
