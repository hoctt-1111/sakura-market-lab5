  owner: PM
  priority: 2
  premise_refs:
  - P-12
  gap_refs:
  - G-FG08-06
  mo_ta: '照合事務 (nhóm đối soát) xem một tranh chấp, gán người phụ trách, đặt ngày hẹn và ghi diễn biến xử lý tới khi đóng bằng kết quả cuối. Máy không tự đóng tranh chấp: người đóng phải ghi kết quả, hệ thống lưu ai đóng, lúc nào, và mọi lần cập nhật đều tra lại được. Spec màn mới có nhãn và nút Quay lại, chưa có ô ghi xử lý (G-FG08-06).


    Ràng buộc đặc thù: Chỉ người đối soát đóng được tranh chấp và phải ghi kết quả cuối; hệ thống ghi người đóng từ phiên và giờ máy chủ, mỗi lần đổi người phụ trách, ngày hẹn hay trạng thái có một dòng audit_log.'
  pham_vi: Màn SC-073 (SPEC-SKM-137) ở văn phòng; cập nhật `disputes` (migration thuộc DATA-FG08, bảng sửa được), lịch sử cập nhật đọc từ `audit_log`; API ghi chưa có spec, SC-073/BE viết rồi làm (P-01).
  luong_chinh:
  - Người đối soát mở tranh chấp từ SC-072.
  - Người đối soát gán người phụ trách và ngày hẹn xử lý, rồi ghi từng bước xử lý.
  - Người đối soát đóng tranh chấp bằng kết quả cuối; máy chủ ghi người đóng từ phiên và giờ máy chủ.
  - Mỗi lần cập nhật có một dòng audit_log giữ giá trị trước và sau; màn hiện lịch sử đó.
  tieu_chi_nghiem_thu:
  - Khi người đối soát đóng tranh chấp thì hệ thống ghi kết quả cuối, người đóng lấy từ phiên và giờ máy chủ; thiếu kết quả thì không đóng được.
  - Khi đổi người phụ trách, ngày hẹn hay trạng thái thì có một dòng audit_log với giá trị trước và sau.
  - Khi tranh chấp đã đóng thì màn chỉ cho xem, không cho sửa.
  - Khi mọi tranh chấp của một 業務日 (ngày nghiệp vụ) đã đóng thì SC-071 cho khoá ngày đó.
  - Khi người gọi không mang vai 照合事務 thì máy chủ trả 403 M_05.
  dinh_nghia_xong:
  - Spec SC-073 thêm ô người phụ trách, ngày hẹn, kết quả và nút Đóng theo G-FG08-06.
