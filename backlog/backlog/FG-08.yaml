  gap_refs:
  - G-FG08-01
  - G-FG08-03
  mo_ta: '照合事務 (nhóm đối soát) hoặc 照合部門長 (trưởng bộ phận đối soát) khoá một 業務日 (ngày nghiệp vụ) sau khi xem bảng đối soát; khoá rồi thì chỉ còn đường điều chỉnh có duyệt của FG-06. Khoá là quyết định của người; máy kiểm điều kiện rồi ghi ai khoá, lúc nào, vì sao.


    Ràng buộc đặc thù: Khoá 業務日 là quyết định của người đối soát; máy chỉ kiểm điều kiện rồi ghi người khoá từ phiên, giờ máy chủ và lý do.'
  pham_vi:
  - Màn SC-071 (SPEC-SKM-135) ở văn phòng; bảng `business_day_locks` (chủ migration, chỉ thêm dòng).
  - Lệnh khoá ngày và dịch vụ kiểm ngày đã khoá chưa có spec, SC-071/BE viết rồi làm; chốt hoá đơn tháng cho FG-09 tách thành story API-213, gọi riêng (G-FG08-01).
  luong_chinh:
  - Người đối soát chọn 業務日, nhập lý do rồi bấm Khoá.
  - Máy chủ kiểm ngày đã có bảng đối soát, không còn tranh chấp mở hay ngoại lệ giao hàng chờ xác nhận, và chưa bị khoá.
  - Máy chủ thêm một dòng business_day_locks với người khoá lấy từ phiên, giờ máy chủ, và ghi audit_log.
  tieu_chi_nghiem_thu:
  - Khi người đối soát bấm Khoá thì hệ thống ghi người khoá của phiên, giờ máy chủ và lý do; người và giờ gửi từ trình duyệt bị bỏ qua.
  - Khi ngày còn tranh chấp mở, ngoại lệ chờ xác nhận, chưa có bảng đối soát hoặc đã khoá thì lệnh khoá bị từ chối, không ghi dòng nào.
  - Khi mất kết nối thì màn báo không khoá được và không lưu cục bộ (ADR-010).
  - Khi API-223, SC-060 hay SC-063 ghi vào ngày đã khoá thì bị chặn bằng mã ngày đã khoá (P-24) và có dòng audit_log.
  dinh_nghia_xong:
  - Spec SC-071, API-213 cập nhật theo G-FG08-01, G-FG08-02 và đáp của INV-FG08-KHOA-NGAY.
