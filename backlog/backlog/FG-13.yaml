  - type:story
  - spec-gap
  owner: BE-1
  priority: 3
  premise_refs:
  - P-12
  gap_refs:
  - G-FG13-03
  - G-FG13-05
  mo_ta: '運用担当者 (người phụ trách vận hành tư cách) hoặc 事務部門 (bộ phận hành chính) ghi một yêu cầu về 個人情報 (dữ liệu cá nhân) do người tham gia gửi tới: 開示 (xin xem), 訂正 (xin sửa) hay 削除 (xin xoá). Mỗi yêu cầu có hạn xử lý và người phụ trách để không yêu cầu nào bị bỏ quên. Giờ nhận và trạng thái đầu do máy chủ gán, không gõ tay (G-FG13-03).'
  pham_vi: 'Màn SC-131 (SPEC-SKM-164) ở văn phòng; bảng `personal_data_requests` (chủ migration, chỉ thêm dòng), ghi `audit_log`; API ghi chưa có spec, SC-131/BE viết rồi làm (P-01). Không gồm việc trả lời yêu cầu: bước xử lý ghi ở SC-132, cách xử lý yêu cầu xoá chờ G-FG13-05.'
  luong_chinh:
  - Người nhận yêu cầu chọn người yêu cầu và loại yêu cầu, nhập hạn xử lý, chọn người phụ trách.
  - Người nhận bấm Đăng ký; máy chủ kiểm các ô bắt buộc và loại yêu cầu.
  - Máy chủ thêm một dòng personal_data_requests với giờ nhận theo giờ máy chủ, trạng thái đã tiếp nhận, người ghi của phiên, và ghi audit_log.
  tieu_chi_nghiem_thu:
  - Khi bấm Đăng ký thì giờ nhận là giờ máy chủ và trạng thái là đã tiếp nhận; giờ và trạng thái gửi từ trình duyệt bị bỏ qua.
  - Khi loại yêu cầu không phải xem, sửa hay xoá thì cả màn và máy chủ từ chối (P-03).
  - Khi hạn xử lý sớm hơn giờ nhận thì máy chủ từ chối; hạn mặc định chưa có số, để cấu hình.
  - Khi người gọi chưa mang vai có dòng trong ma trận quyền thì API trả 403 M_05 (P-12).
  dinh_nghia_xong:
  - Spec SC-131 bỏ hai ô nhập tay giờ nhận và trạng thái, ghi ba loại yêu cầu (G-FG13-03).
