  gap_refs:
  - G-FG13-01
  - G-FG13-02
  mo_ta: '内部監査 (kiểm toán nội bộ) và 事務部門 (bộ phận hành chính) tra vết kiểm toán của cả hệ thống: ai làm thao tác gì, trên bản ghi nào, giá trị trước và sau, lý do, kết quả. Màn chỉ đọc audit_log và là bằng chứng cho FR-AUDIT-02, nên phải lọc được theo mã giao dịch, ngày nghiệp vụ, người tham gia và loại thao tác (G-FG13-01). Cả hai vai chưa gán vai nội bộ (P-12).'
  pham_vi: Màn SC-130 (SPEC-SKM-163) ở văn phòng, chỉ đọc `audit_log` (migration thuộc DATA-FG13/DB); mọi module ghi qua hàm của module audit (G-FG13-02). API đọc chưa có spec, SC-130/BE viết rồi làm (P-01); SC-004 của FG-01 là lát cắt đổi quyền của cùng nguồn.
  luong_chinh:
  - Người xem mở SC-130; máy chủ kiểm vai của phiên theo ma trận quyền trước khi đọc.
  - Người xem lọc theo 業務日 (ngày nghiệp vụ), mã giao dịch, người tham gia hoặc loại thao tác rồi bấm Lọc.
  - Màn hiện người làm, vai, thao tác, bảng và mã đối tượng, lý do, kết quả, thời điểm.
  - Người xem mở một dòng để xem đủ giá trị trước và sau; màn không có nút sửa hay xoá.
  tieu_chi_nghiem_thu:
  - Khi lọc theo mã giao dịch thì hiện mọi dòng audit_log của giao dịch đó, kể cả lần chốt bị từ chối và lần huỷ.
  - Khi lọc theo 業務日 thì chỉ hiện dòng tạo trong ngày đó theo giờ Nhật.
  - Khi mở một dòng thì màn hiện giá trị trước và sau; hai khối này không chứa dữ liệu cá nhân thô, mật khẩu hay mã bí mật.
  - Khi người xem chưa mang vai có dòng trong ma trận quyền thì API trả 403 M_05 (P-12).
  - Màn và API không có lệnh nào sửa hay xoá dòng audit_log.
  - Khi máy chạy kiểm thử đặt múi giờ UTC+7 và nhập lúc 02:31 JST thì 業務日 ghi đúng ngày JST và màn hiển thị giờ JST.
  dinh_nghia_xong:
  - Spec SC-130 có bốn ô lọc và khung giá trị trước, sau theo G-FG13-01.
