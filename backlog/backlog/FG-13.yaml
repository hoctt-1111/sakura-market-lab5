  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Mọi story con của FG-13 đã đóng.
  - Khi một thao tác nhạy cảm ở bất kỳ module nào chạy xong thì audit_log có một dòng ghi người làm, giờ máy chủ, giá trị trước, sau và lý do; không đường nào sửa hay xoá dòng đó.
  - Khi một yêu cầu dữ liệu cá nhân được nhận thì mọi lần đổi trạng thái tới khi đóng đều tra lại được người làm và thời điểm.
  - Các issue điều tra của FG-13 đã có câu trả lời, hoặc khách xác nhận giữ giả định đang dùng.
  dinh_nghia_xong: []
