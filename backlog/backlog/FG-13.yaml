  mo_ta: Nhóm chức năng này giữ 監査証跡 (vết kiểm toán) cho mọi thao tác tạo, sửa, duyệt, khoá và đổi quyền, kèm giá trị trước, sau và lý do, để kiểm toán nội bộ tra lại theo giao dịch, ngày, người tham gia và loại thao tác. Phần 個人情報 (dữ liệu cá nhân) nhận và theo dõi yêu cầu xem, sửa, xoá của người tham gia theo luật bảo vệ thông tin cá nhân, đồng thời ghi người dùng nội bộ nào đã đọc dữ liệu cá nhân của ai. Ba bảng vết đều chỉ thêm dòng, và chỉ module audit được thêm dòng vào audit_log.
