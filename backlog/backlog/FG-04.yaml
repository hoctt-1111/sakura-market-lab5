  mo_ta: 'Nhóm chức năng này ghi và chốt 相対取引 (giao dịch thỏa thuận) giữa bán buôn đầu mối và bên mua, kênh chiếm phần lớn giá trị giao dịch theo tải tham chiếu của RFP (giả định 90/10), khác hẳn せり (đấu giá). Lúc chốt, hệ thống kiểm lại tư cách bên mua theo đúng loại giấy, từ chối kèm lý do khi không đạt, và cho huỷ giao dịch khi ngày nghiệp vụ chưa khoá.

    Ràng buộc đặc thù: Luồng 相対 là luồng chính, nên dữ liệu, màn và kiểm thử của epic đi từ giao dịch thỏa thuận; せり chỉ ghi chung bảng transactions qua kênh riêng.'
  pham_vi: Các màn SC-030 đến SC-034, API-207 đến API-210, API-221 đến API-223, luồng TECH-301 và các bảng transactions, transaction_cancellations, reservations; bán trực tiếp và đặt trước giữ ở mức có điều kiện theo P-18 và P-20.
  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Mọi story con của FG-04 đã đóng.
  - Khi chốt một giao dịch 相対 với bên mua có giấy hết hạn tại ngày chốt thì hệ thống từ chối, hiện lý do và không tạo dòng giao dịch nào.
  - Khi huỷ một giao dịch 相対 chưa khoá ngày thì có đúng một dòng huỷ, lượng của lô được hoàn, dòng giao dịch gốc không bị sửa.
  - Các issue điều tra của FG-04 đã có câu trả lời, hoặc khách xác nhận giữ giả định đang dùng.
  - Giao dịch 相対 chỉ sang 確定 (đã chốt) khi một người khác người nhập duyệt; dòng 確認待ち chưa đổi trạng thái lô nhưng đã trừ vào lượng khả dụng (P-46, P-30).
  dinh_nghia_xong: []
