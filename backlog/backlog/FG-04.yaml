- key: SC-032
  cha: FG-04
  tracker: story
  title_vi: Chi tiết giao dịch 相対
  ten_ja: 取引詳細
  spec_refs:
    sc:
    - SC-032
    api:
    - API-222
    tech: []
    bang:
    - transactions
    fr:
    - FR-AITAI-01
    adr: []
    nfr: []
  labels:
  - type:story
  - constraint:aitai
  owner: PM
  priority: 2
  premise_refs: []
  gap_refs: []
  mo_ta: '取引運用 (nhóm vận hành giao dịch), 照合事務 (nhóm đối soát) và 内部監査 (kiểm toán nội bộ) xem một giao dịch: kênh, lô, hai bên, giá, lượng, ngày, nguồn gốc, khối huỷ nếu có và cờ ngày đã khoá. Màn chỉ đọc, phục vụ tra cứu và kiểm toán.

    Ràng buộc đặc thù: Chi tiết phải cho biết giao dịch là 相対取引 (giao dịch thỏa thuận) hay せり (đấu giá) và đã huỷ hay chưa, vì hai kênh dùng chung một bảng.'
  pham_vi:
  - Màn SC-032 (SPEC-SKM-120), dùng ở văn phòng.
  - API-222 SKM_TRADE_DETAIL_READ (thiết kế đích), thêm trạng thái 更正 (sửa sau xác nhận) và bản quy tắc đã áp theo P-25.
  - Đọc `transactions`, `transaction_cancellations`, `business_day_locks`.
  luong_chinh:
  - Người dùng mở chi tiết một giao dịch từ SC-031.
  - Máy chủ trả giao dịch, thông tin huỷ nếu có (vì sao, ai huỷ, lúc nào, hoàn bao nhiêu) và cờ ngày đã khoá.
  - Người dùng xem rồi bấm Quay lại.
  tieu_chi_nghiem_thu:
  - Khi giao dịch chưa huỷ thì không có khối huỷ; đã huỷ thì hiện lý do huỷ, ai huỷ, lúc huỷ và lượng đã hoàn.
  - Khi mã giao dịch không tồn tại thì trả 404 M_14; đọc lỗi thì trả 500 M_11.
  - Khi API của FG-06 và FG-10 đã có thì chi tiết hiện thêm trạng thái 更正 và bản quy tắc đã áp (P-25).
  - Khi người dùng mang vai 内部監査 mà ma trận quyền chưa có dòng (P-12) thì bị chặn 403.
  dinh_nghia_xong:
  - SC-032/BE chỉ xếp vào sprint sau khi API của FG-06 và FG-10 đã xong (P-25).
