  tieu_chi_nghiem_thu:
  - Gửi ghi transactions và sự kiện 提出 trong một giao dịch CSDL; 承認 ghi sự kiện 承認 (người duyệt, giờ máy chủ, basis_* chụp và trade_no cấp lúc đó, không ghi vào transactions) cùng việc đổi lô khi phần còn lại tính từ dòng 確定, 更正 bằng 0, trong một giao dịch CSDL khác; 却下 ghi sự kiện 却下 kèm lý do, không đổi lô.
