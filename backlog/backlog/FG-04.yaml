  mo_ta: 'Làm API-221 trên module trade: đọc giao dịch của cả hai kênh theo khoảng ngày, suy cờ đã huỷ từ transaction_cancellations.

    Ràng buộc đặc thù: Không tách danh sách theo kênh; giao dịch 相対 (giao dịch thỏa thuận) và せり (đấu giá) trả chung một danh sách.'
  pham_vi: ''
  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Trả đúng 10 cột của SC-031 cộng mã giao dịch và cờ đã huỷ.
  - Cỡ trang, thứ tự sắp xếp và khoảng ngày mặc định theo quy ước chung của dự án (G-19).
  - Vai được đọc là 取引運用 (nhóm vận hành giao dịch) và 照合事務 (nhóm đối soát) theo giả định P-12.
  - Trả thêm trạng thái (sự kiện mới nhất; không có sự kiện thì 確定), 確認者 và giờ duyệt, nhận bộ lọc trạng thái 確認待ち, 確定, 更正, 取消 (P-46).
  - Cột trade_no và basis_* đọc từ dòng sự kiện 承認 mới nhất, không từ transactions; giao dịch đang 確認待ち trả trade_no rỗng và màn hiện «—» (P-46).
  dinh_nghia_xong: []
