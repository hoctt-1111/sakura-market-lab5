  mo_ta: '取引運用 (nhóm vận hành giao dịch) ghi 相対取引 (giao dịch thỏa thuận) đã thương lượng; giá do người quyết.

    Ràng buộc đặc thù: 仲卸 (trung gian bán buôn) phải còn 許可 (giấy phép), 売買参加者 (người tham gia mua bán) phải còn 承認 (chấp thuận) tại ngày chốt; kiểm ở máy chủ.'
  pham_vi: Màn SC-030 (SPEC-SKM-118); API-208 theo TECH-301; bảng `transactions` (chủ migration), đổi trạng thái `lots`.
  luong_chinh:
  - Chọn lô 相対 (kể cả lô せり (đấu giá) ế đã chuyển), bên mua, đơn giá, số lượng rồi gửi.
  - Máy chủ kiểm lô, số lượng, tư cách theo TECH-301, ghi giao dịch và sự kiện 提出 (sang 確認待ち); bị từ chối thì sang SC-033.
  - Người khác người nhập 承認 (kiểm tư cách lần nữa, sang 確定; lô hết thì sang đã bán) hoặc 却下 kèm lý do (sang 取消).
  tieu_chi_nghiem_thu:
  - Khi số lượng vượt phần còn lại của lô thì trả 422 M_09, không ghi gì.
  - Khi bên mua không có quyền 相対 thì trả 403 M_01; giấy tạm dừng, 失効 (mất hiệu lực) hay quá hạn thì trả 422 M_21.
  - Khi gửi thì có dòng giao dịch và sự kiện 提出; khi duyệt thì có sự kiện 承認 mang người duyệt, giờ máy chủ; lỗi thì hoàn tác, trả 500 M_25.
  - Khi người duyệt trùng người nhập thì trả 422 SELF_CONFIRM_FORBIDDEN, vai không được duyệt thì 403 M_05.
  - Khi mất kết nối lúc gửi thì màn báo không gửi được (ADR-010); vai được ghi theo P-12.
  - Khi máy chạy kiểm thử đặt múi giờ UTC+7 và nhập lúc 02:31 JST thì 業務日 ghi đúng ngày JST và màn hiển thị giờ JST.
  dinh_nghia_xong:
  - Spec SC-030, TECH-301 theo đáp của G-FG04-01, G-FG04-03.
