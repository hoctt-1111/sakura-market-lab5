  - Lệnh ghi thất bại trả 500 mã SAVE_FAILED (M_25) kèm câu của M_25 «Lưu thất bại», không dùng câu chung của M_06 (P-49).
  - Thêm hai hàng 422 SELF_CONFIRM_FORBIDDEN và 409 RECORD_STATE_INVALID, kèm câu ja, en, vi của P-46, vào bảng mã lỗi chung của LAB-4.
  - Mọi lệnh đổi trạng thái giao dịch kiểm trạng thái hiện tại trong lúc khoá dòng giao dịch (SELECT … FOR UPDATE); người ghi thứ hai cùng lúc nhận 409 RECORD_STATE_INVALID (P-46).
