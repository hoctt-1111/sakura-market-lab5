  - G-FG04-02
  mo_ta: 'Luồng này là lõi của việc chốt 相対取引 (giao dịch thỏa thuận): xác định bên mua có quyền giao dịch thỏa thuận theo ma trận quyền và còn hiệu lực giấy tại ngày chốt. Làm thành một dịch vụ dùng chung để SC-030 và mọi đường chốt khác áp cùng một luật.

    Ràng buộc đặc thù: 仲卸 (trung gian bán buôn) xét theo hạn 許可 (giấy phép), 売買参加者 (người tham gia mua bán) xét theo hạn 承認 (chấp thuận); hai cột riêng, không dùng cột gộp, và chặn cả ca còn hoạt động nhưng đã quá hạn.'
  pham_vi: TECH-301 (SPEC-SKM-301) phục vụ API-208; đọc `participants` (hai bộ cột 許可, 承認) và `permission_matrix` mỗi lần gọi, không lưu đệm.
  luong_chinh:
  - Dịch vụ nhận bên mua và ngày chốt từ API-208.
  - Dịch vụ ánh xạ loại người tham gia sang vai giao dịch; loại không có vai (bán buôn đầu mối, người mua lẻ) bị từ chối.
  - Dịch vụ đọc ma trận quyền của vai đó; không có quyền 相対 thì từ chối 403.
  - Dịch vụ chọn cột hạn theo loại giấy và so với 業務日 (ngày nghiệp vụ) của ngày chốt; tạm dừng, mất hiệu lực hay quá hạn thì từ chối 422.
  - Dịch vụ ghi nhật ký kiểm toán cho ca bị từ chối và trả kết quả cho API-208.
  tieu_chi_nghiem_thu:
  - Khi bên mua là 卸売業者 (bán buôn đầu mối) hay 買出人 (người mua lẻ) thì trả 403 M_01, kể cả khi người gọi có đủ quyền.
  - Khi trạng thái tư cách còn hoạt động nhưng hạn của đúng loại giấy đã qua trước ngày chốt thì trả 422 M_21.
