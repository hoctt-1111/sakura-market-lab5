  pham_vi: Màn SC-052 (SPEC-SKM-127); API duyệt, từ chối viết mới ở SC-052/BE (P-01); bảng `adjustment_entries` (chủ migration), đổi trạng thái `adjustment_requests`.
  luong_chinh:
  - 承認者 chọn một yêu cầu chờ duyệt ở SC-051; màn hiện đối tượng, nội dung sửa, lý do, bằng chứng và người lập, mọi ô chỉ đọc.
