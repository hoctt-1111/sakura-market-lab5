  - Khi duyệt loại đảo thì dòng đảo mang số tiền ngược dấu bản ghi gốc; loại chênh lệch thì mang đúng số đã khai; bản ghi gốc không đổi.
  - Khi từ chối thì không sinh dòng nào; yêu cầu lưu người từ chối, thời điểm và lý do.
  - Khi yêu cầu đã duyệt hoặc đã từ chối thì máy chủ không cho duyệt lại, trạng thái giữ nguyên.
  dinh_nghia_xong:
  - Số cấp duyệt và người giữ vai cập nhật theo đáp của INV-Q-02 (P-16).
