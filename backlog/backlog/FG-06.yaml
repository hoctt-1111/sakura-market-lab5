  owner: PM
  priority: 3
  premise_refs:
  - P-01
  - P-12
  gap_refs:
  - G-FG06-05
  - G-FG06-06
  mo_ta: 'システム管理者 (quản trị hệ thống) và 照合部門長 (trưởng bộ phận đối soát) đặt vai nào được lập yêu cầu điều chỉnh và vai nào được duyệt. Ma trận là dữ liệu: thiếu dòng nghĩa là không cho phép, và API của luồng sửa đọc nó ở máy chủ chứ không chỉ ẩn nút.'
  pham_vi: Màn SC-053 (SPEC-SKM-128); API đọc và ghi ma trận viết mới ở SC-053/BE (P-01); bảng `permission_matrix` (chủ migration theo seed, dùng chung với API-203 của FG-01).
  luong_chinh:
  - Người dùng mở màn; máy chủ trả các dòng vai × thao tác của luồng sửa.
  - Người dùng bật hoặc tắt quyền lập, quyền duyệt cho từng vai rồi bấm Lưu.
  - Máy chủ kiểm toàn bộ thay đổi, ghi trong một giao dịch CSDL và ghi nhật ký trước, sau.
  - Lần gọi kế tiếp của SC-050 và SC-052 đọc ma trận mới.
  tieu_chi_nghiem_thu:
  - Khi một vai không có dòng cho thao tác lập hay duyệt thì API của SC-050 hay SC-052 trả 403 cho vai đó.
  - Khi lưu thì quyền mới có hiệu lực ngay ở lần gọi kế tiếp.
  - Khi một phần tử thay đổi sai thì cả lần lưu bị từ chối, không ghi một phần.
  - Khi lưu thành công thì nhật ký ghi người lưu, thời điểm và giá trị trước, sau.
  - Khi システム管理者 chưa có dòng nào trong ma trận quyền chung thì vai đó chưa dùng được màn (P-12).
  dinh_nghia_xong:
  - Mã thao tác lập, duyệt của luồng sửa ghi vào SKM_DB và bảng ánh xạ vai của System Design (G-FG06-05).
