  mo_ta: 権限付与済みユーザー (người dùng được cấp quyền lập ở ma trận của luồng sửa) chọn bản ghi đã chốt cần sửa, khai nội dung sửa, ghi lý do và đính bằng chứng để gửi duyệt. Bản ghi gốc không đổi cho tới khi yêu cầu được duyệt ở SC-052; người lập không tự chọn người duyệt.
  pham_vi: Màn SC-050 (SPEC-SKM-125); API ghi yêu cầu viết mới ở SC-050/BE, vì FG-06 chưa có API nào (P-01); bảng `adjustment_requests` (chủ migration), bằng chứng lưu qua `attachments`.
  luong_chinh:
  - Người có quyền lập chọn loại đối tượng và bản ghi đã chốt cần sửa.
  - Người lập khai loại sửa (đảo hay chênh lệch), số tiền, kỳ áp dụng, ghi lý do và đính bằng chứng.
  - Máy chủ kiểm quyền lập theo ma trận của luồng sửa và kiểm bản ghi tồn tại, đã chốt.
  - Máy chủ ghi yêu cầu ở trạng thái chờ duyệt, người lập là người của phiên.
  - Yêu cầu hiện ở SC-051 để người duyệt xử lý.
  tieu_chi_nghiem_thu:
  - Khi lý do hoặc bằng chứng trống thì không ghi yêu cầu nào.
  - Khi tài khoản chưa có quyền lập ở ma trận của luồng sửa thì máy chủ trả 403, dù màn đã ẩn nút.
  - Khi bản ghi đích chưa chốt thì máy chủ từ chối, vì sửa trước khi chốt đi đường khác theo ADR-003.
  - Khi ghi thành công thì yêu cầu ở trạng thái chờ duyệt, người lập và thời điểm lấy ở máy chủ, người duyệt còn trống; bản ghi gốc không đổi.
  dinh_nghia_xong:
  - Tập loại đối tượng sửa được và quan hệ của target_id ghi lại vào SKM_DB (G-18).
