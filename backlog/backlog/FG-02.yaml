epic:
  key: FG-02
  tracker: epic
  title_vi: Tư cách người tham gia 許可・承認
  feature: participant-qualification
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
  labels:
  - type:epic
  - constraint:two-tier
  owner: PM
  priority: 2
  premise_refs:
  - P-09
  gap_refs: []
  mo_ta: 'Nhóm chức năng này lưu hồ sơ bốn loại người tham gia và tư cách của họ, tách hai loại giấy: 仲卸 (trung gian bán buôn) giữ 許可 (giấy phép), 売買参加者 (người tham gia mua bán) giữ 承認 (chấp thuận), không gộp thành một quyền. Hệ thống chỉ ghi kết quả xét duyệt làm trên giấy, giữ lịch sử đổi tư cách và cảnh báo giấy sắp hết hạn để chợ gia hạn trước khi giao dịch bị chặn lúc chốt.


    Ràng buộc đặc thù: 許可 của 仲卸 và 承認 của 売買参加者 là hai bộ cột riêng, một hồ sơ không mang cả hai; hệ thống chỉ ghi kết quả người xét duyệt trên giấy, và lúc chốt giao dịch kiểm lại hạn của đúng loại giấy theo TECH-301.'
  pham_vi: ''
  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Mọi story con của FG-02 đã đóng.
  - Khi lưu hồ sơ 仲卸 thì chỉ bộ cột 許可 có giá trị, hồ sơ 売買参加者 chỉ có bộ cột 承認; ghi cả hai bộ cho một hồ sơ bị chặn ở CSDL.
  - Khi đổi trạng thái tư cách thì lịch sử có thêm một dòng với trước, sau, người quyết, ngày quyết và lý do; dòng cũ không bị sửa.
  - Các issue điều tra của FG-02 đã có câu trả lời, hoặc khách xác nhận giữ giả định đang dùng (P-09).
  dinh_nghia_xong: []
