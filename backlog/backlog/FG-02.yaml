  mo_ta: '運用担当者 (người phụ trách vận hành tư cách) tạo và sửa hồ sơ người tham gia thuộc bốn loại 卸売業者 (bán buôn đầu mối), 仲卸 (trung gian bán buôn), 売買参加者 (người tham gia mua bán), 買出人 (người mua lẻ). Đây là một trong các màn lõi mà LAB-4 đã viết đủ luật kiểm tra đầu vào. Màn chỉ ghi kết quả cấp giấy đã xét ngoài hệ thống.

    Ràng buộc đặc thù: 仲卸 nhập số, hạn 許可, 売買参加者 nhập số, hạn 承認 vào hai bộ ô riêng; đổi loại thì bộ ô kia bị xoá trắng.'
  pham_vi: Màn SC-011 (SPEC-SKM-108); bảng `participants` (chủ migration, ràng buộc ck_participants_tier_exclusive). SC-011/BE viết spec API rồi làm theo P-01.
  luong_chinh:
  - Người dùng chọn loại người tham gia, nhập mã và tên.
  - Màn chỉ hiện bộ ô giấy của đúng loại; người dùng nhập số, hạn giấy và trạng thái.
  - Trạng thái đổi, kể cả lúc tạo hồ sơ, thì người dùng nhập ngày đổi và lý do.
  - Máy chủ kiểm vai và từng luật, ghi `participants` với bộ giấy kia để trống; trạng thái đổi thì ghi kèm dòng lịch sử (G-FG02-01).
  tieu_chi_nghiem_thu:
  - Khi mã trống hoặc trùng thì máy chủ từ chối; mã là khoá đối chiếu với hệ kế toán (IF-ACC-01).
  - Khi 仲卸 thiếu số hoặc hạn 許可 (giấy phép), hay 売買参加者 thiếu số hoặc hạn 承認 (chấp thuận), thì trả 400; ghi giấy của loại kia bị CSDL chặn.
  - Khi trạng thái đổi mà thiếu ngày đổi hoặc lý do thì trả 400; hệ đích bắt buộc lý do, khác prototype.
  - Khi lưu 卸売業者 hoặc 買出人 thì cả hai bộ cột giấy để trống.
  dinh_nghia_xong:
  - Mã thông báo lỗi cho từng luật của SC-011 được cấp vào bảng mã lỗi chung.
  - Cột ngày bắt đầu hiệu lực của hai loại giấy chốt theo G-FG02-04.
