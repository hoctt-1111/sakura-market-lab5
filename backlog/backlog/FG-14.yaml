  mo_ta: Nhóm chức năng này giữ chứng từ và ảnh làm bằng chứng cho lô, giao hàng và tranh chấp, đặt thời hạn lưu trữ rồi chuyển sang lưu lạnh, phát hiện trùng khoá nghiệp vụ trước khi nhận dữ liệu, và gom các thao tác chờ đồng bộ từ thiết bị hiện trường. Máy chỉ phát hiện và xếp hàng; chọn bản đúng khi trùng khoá hay khi đồng bộ xung đột luôn là việc của người (ADR-010). Bảng giám sát SC-150 cho người vận hành thấy sớm lệch đối soát và lỗi vận hành mà không cần kênh thời gian thực (ADR-013).
