  mo_ta: 照合事務 (nhóm đối soát) tra chứng từ đã đính kèm theo loại đối tượng, đối tượng và thời điểm tải, để lấy bằng chứng khi đối soát ngày hay khi có tranh chấp. Chứng từ do nơi khác tải lên, như phiếu nhận ở SC-025 hay bằng chứng của yêu cầu điều chỉnh ở SC-050; màn này chỉ xem và mở tệp, không sửa hay xoá vì bảng chỉ thêm dòng.
  pham_vi: Màn SC-140 (SPEC-SKM-167) ở văn phòng, chỉ đọc `attachments` (migration thuộc SC-025/DB); tệp nằm ở kho tệp do SC-025/BE dựng. API đọc và đường mở tệp chưa có spec, SC-140/BE viết rồi làm (P-01).
  luong_chinh:
  - Người đối soát mở SC-140; máy chủ kiểm vai của phiên.
  - Người đối soát lọc theo 業務日 (ngày nghiệp vụ), loại đối tượng hoặc mã đối tượng rồi bấm Lọc (G-FG14-01).
  - Màn hiện loại đối tượng, đối tượng, tệp, thời điểm tải, người tải; bấm một dòng để mở tệp.
  - Máy chủ cấp đường mở tệp có hạn ngắn cho đúng người đang xem, không lộ đường dẫn kho.
  tieu_chi_nghiem_thu:
  - Khi một lô có phiếu nhận thay thế thì danh sách hiện cả bản cũ và bản mới, bản mới đứng trước.
  - Khi đường mở tệp quá thời hạn cấu hình thì không dùng được nữa, người xem phải mở lại từ màn.
  - Khi tệp đã chuyển sang lưu lạnh thì màn hiện nhãn đang lưu lạnh và thời gian khôi phục tối đa 2 ngày, không báo lỗi.
  - Khi người gọi không mang vai được phép thì máy chủ trả 403 M_05; vai hệ đích theo P-12.
  - Màn và API không có lệnh nào sửa hay xoá chứng từ.
  dinh_nghia_xong:
  - Spec SC-140 có ô lọc theo loại và mã đối tượng, cách mở tệp và nhãn lưu lạnh (G-FG14-01).
