  mo_ta: 配送部門 (bộ phận giao hàng) và 照合事務 (nhóm đối soát) tải ảnh làm bằng chứng cho ngoại lệ giao hàng, tranh chấp hay đối soát, rồi xem lại ảnh kèm thời điểm chụp, thiết bị và giá trị băm để chứng minh ảnh chưa bị thay. Ảnh là bằng chứng cho người quyết, máy không tự chấm chất lượng từ ảnh. Giá trị băm do máy chủ tính, không gõ tay (G-FG14-02).
  pham_vi: Màn SC-141 (SPEC-SKM-168) trên thiết bị hiện trường; bảng `evidence_images` (chủ migration, chỉ thêm dòng), mỗi ảnh trỏ một dòng `attachments` (migration thuộc SC-025/DB). API tải và đọc ảnh chưa có spec, SC-141/BE viết rồi làm (P-01).
  luong_chinh:
  - Người dùng chọn đối tượng cần bằng chứng rồi chụp hoặc chọn ảnh.
  - Người dùng bấm Lưu; máy chủ kiểm loại và cỡ tệp theo cấu hình, lưu tệp, tính giá trị băm.
  - Máy chủ thêm một dòng attachments và một dòng evidence_images với người tải của phiên, thời điểm chụp, thiết bị và giá trị băm.
  - Người xem mở ảnh; máy chủ tính lại giá trị băm và báo nếu không khớp.
  tieu_chi_nghiem_thu:
  - Khi bấm Lưu thì giá trị băm do máy chủ tính từ tệp nhận được; giá trị gửi từ trình duyệt bị bỏ qua.
  - Khi tệp sai loại hoặc vượt cỡ theo tham số cấu hình (P-03) thì máy chủ từ chối, không ghi dòng nào.
  - Khi lưu thành công thì có dòng mới chính thức, không có bản nháp; thay ảnh là thêm ảnh mới, ảnh cũ giữ nguyên.
  - Khi giá trị băm tính lại không khớp lúc xem thì màn báo ảnh không còn nguyên vẹn.
  - Khi mất kết nối lúc Lưu thì màn giữ ảnh và báo chưa gửi được; tải ảnh không thuộc ba thao tác ghi tạm (ADR-010).
  dinh_nghia_xong:
  - Spec SC-141 bỏ ô nhập tay giá trị băm và đổi nút Lưu thành ghi chính thức theo G-FG14-02.
