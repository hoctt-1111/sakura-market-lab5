  mo_ta: '照合事務 (nhóm đối soát) xem các khoá nghiệp vụ bị trùng mà hệ thống phát hiện, như mã lô hay mã giao dịch, và xử lý chúng trước khi chốt sổ. Hệ thống chặn bản trùng trước khi nhận một lần nạp hay một thao tác chốt và ghi một dòng phát hiện, còn chọn bản đúng là việc của người. Spec chưa nói nơi phát hiện và chưa có đường ghi kết quả xử lý (G-FG14-05).


    Ràng buộc đặc thù: Máy chặn bản trùng và ghi dòng phát hiện, người đối soát chọn bản đúng; hệ thống thêm dòng kết quả với người của phiên và giờ máy chủ, không tự gộp hay xoá.'
  pham_vi: Màn SC-143 (SPEC-SKM-170) ở văn phòng; bảng `duplicate_key_findings` (migration thuộc DATA-FG14/DB, chỉ thêm dòng). Nơi phát hiện là bước nạp qua bảng đệm của MIG-02, bước đồng bộ lại của SC-151 và các API chốt; API đọc và lệnh ghi kết quả chưa có spec, SC-143/BE viết rồi làm (P-01).
  luong_chinh:
  - 'Một lần nạp, một lần đồng bộ lại hay một thao tác chốt mang khoá đã có: máy chủ từ chối bản ghi đó và thêm dòng phát hiện gồm bảng, khoá, giờ, nguồn.'
  - Người đối soát mở SC-143, lọc theo 業務日 (ngày nghiệp vụ) và trạng thái; dòng chưa xử lý đứng trước.
  - Người đối soát so hai bản, sửa ở màn nghiệp vụ tương ứng nếu cần, rồi ghi kết quả xử lý.
  - Máy chủ thêm một dòng kết quả trỏ về dòng phát hiện với người của phiên và giờ máy chủ.
  tieu_chi_nghiem_thu:
  - Khi một lần nạp chứa mã lô đã có thì bản trùng không vào bảng lots và SC-143 có đúng một dòng phát hiện.
  - Khi người đối soát ghi kết quả thì hệ thống thêm dòng ghi người của phiên, giờ máy chủ và kết quả; dòng phát hiện gốc giữ nguyên.
  - Khi còn dòng chưa xử lý của một 業務日 thì màn đánh dấu ngày đó là cần xử lý trước khi khoá.
  - Máy không tự gộp hay tự xoá bản trùng nào.
  - Khi người gọi không mang vai được phép thì máy chủ trả 403 M_05; vai hệ đích theo P-12.
  dinh_nghia_xong:
  - Spec SC-143 đổi nhãn cột khoá, ghi nơi phát hiện và đường ghi kết quả theo G-FG14-05.
