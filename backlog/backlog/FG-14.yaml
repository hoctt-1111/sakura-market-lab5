  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Mọi story con của FG-14 đã đóng.
  - Khi một thao tác ghi tạm đồng bộ lại mà xung đột thì không bản nào bị ghi đè; thao tác chờ ở SC-151 tới khi có người chọn, và hệ thống ghi ai chọn, lúc nào.
  - Khi chứng từ hay ảnh đã lưu thì không đường nào sửa hay xoá được; tới hạn thì chỉ chuyển sang lưu lạnh, không xoá (P-19).
  - Khi một lần nạp hay một thao tác chốt mang khoá nghiệp vụ đã có thì bản ghi đó không vào bảng và SC-143 có một dòng phát hiện.
  dinh_nghia_xong: []
