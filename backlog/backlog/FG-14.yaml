  luong_chinh:
  - Thiết bị mất kết nối lúc làm một trong ba thao tác; màn giữ dữ liệu cục bộ và hiện số việc chờ gửi.
  - Có kết nối lại, thiết bị gửi lại mọi thao tác chờ; máy chủ ghi từng thao tác vào sync_queue, áp nếu không xung đột, còn thao tác xung đột hay trùng khoá (SC-143) thì chờ người xử.
  - Người xử mở SC-151, so bản trên thiết bị với bản trên máy chủ, chọn bản giữ rồi bấm Xử lý.
  - Máy chủ áp bản được chọn qua API của thao tác đó, ghi người của phiên, giờ máy chủ và audit_log.
  tieu_chi_nghiem_thu:
  - Khi thiết bị gửi thao tác ngoài ba thao tác ghi tạm thì máy chủ từ chối, không đưa vào hàng đợi.
  - Khi thao tác đồng bộ lại xung đột thì không bản nào bị ghi đè; dòng chờ người xử tới khi có người chọn.
  - Khi người xử chọn bản giữ thì hệ thống ghi người của phiên, giờ máy chủ, bản đã chọn; bản bỏ vẫn tra lại được.
  - Khi đồng bộ lại kết quả 目利き thì người xác nhận và thời điểm gốc trên thiết bị được giữ nguyên.
  - Khi người gọi không mang vai được phép thì máy chủ trả 403 M_05; vai hệ đích theo P-12.
  dinh_nghia_xong:
  - Spec SC-151 có nút Xử lý, khung so hai bản và tên ba thao tác ghi tạm (G-FG14-07).
