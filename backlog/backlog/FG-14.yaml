  mo_ta: '運用管理者 (quản lý vận hành) và システム管理者 (quản trị hệ thống) theo dõi số đối soát của từng 業務日 (ngày nghiệp vụ) cùng bốn nhóm giám sát vận hành: sức khoẻ dịch vụ, lỗi tác vụ nền và lô xuất, lỗi gửi thông báo, sự kiện bảo mật (N11). Thông báo mức Critical (khẩn nhất) gửi chậm quá 5 phút phải hiện ở đây, không bị bỏ qua (EV2). Màn tự làm mới theo chu kỳ, không dùng kênh đẩy (ADR-013); story bổ sung các ô mà spec còn thiếu (G-FG14-06).'
  pham_vi: Màn SC-150 (SPEC-SKM-171) ở văn phòng, chỉ đọc `daily_reconciliations` (migration thuộc DATA-FG08), `alert_queue`, `notification_log` (DATA-FG12), `report_runs`, dòng bị từ chối trong `audit_log` và kết quả của API-220. API đọc gộp chưa có spec, SC-150/BE viết rồi làm (P-01).
  luong_chinh:
  - Người vận hành mở SC-150; máy chủ kiểm vai rồi trả số đối soát các ngày gần nhất và bốn ô giám sát.
  - Màn tự tải lại theo chu kỳ cấu hình và luôn hiện dữ liệu lấy lúc mấy giờ.
  - Ô có lỗi hiện số việc và mở được danh sách cần xác nhận.
  - Người vận hành bấm một việc để sang SC-122, SC-121 hoặc SC-070 xử lý; màn này không sửa dữ liệu.
  tieu_chi_nghiem_thu:
  - Khi một thông báo Critical gửi xong sau hơn 5 phút kể từ lúc sự kiện phát sinh thì ô lỗi gửi thông báo đếm nó và danh sách cần xác nhận có dòng đó.
  - Khi API-220 báo dịch vụ không khoẻ thì ô sức khoẻ chuyển sang trạng thái lỗi có chữ, không chỉ đổi màu.
  - Khi một lô xuất hay tác vụ nền ghi trạng thái lỗi thì ô lỗi tác vụ tăng một và mở được đúng dòng đó.
  - Khi tới chu kỳ làm mới thì màn tải lại số liệu và cập nhật mốc giờ; chu kỳ là tham số cấu hình, chưa có số.
  - Khi người gọi chưa mang vai có dòng trong ma trận quyền thì API trả 403 M_05 (P-12).
  dinh_nghia_xong:
  - Spec SC-150 có bốn ô giám sát, nguồn của danh sách cần xác nhận và chu kỳ làm mới theo G-FG14-06.
