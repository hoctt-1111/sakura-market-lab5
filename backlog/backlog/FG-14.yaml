  - G-FG14-07
  mo_ta: Ba bảng retention_policies (thời hạn lưu, sửa được), duplicate_key_findings (phát hiện trùng khoá, chỉ thêm dòng) và sync_queue (hàng đợi đồng bộ, sửa được) không có màn nào làm chủ migration; SC-142, SC-143 và SC-151 đọc, ghi qua API của mình. Story này dựng ba bảng trên kho mã hệ đích, thêm các cột mà bước người xử cần, và nạp sẵn thời hạn lưu theo bảng của RFP trước khi ba story kia chạy (P-06).
  pham_vi: Bảng `retention_policies`, `duplicate_key_findings`, `sync_queue` (chủ migration, chưa thuộc vùng nào trong SKM_DB); chốt ba ô kiểu «—» của retention_policies và ô thiết bị của sync_queue (P-06); thêm cột loại tài liệu (G-FG14-03), dòng kết quả xử lý trùng (G-FG14-05), người xử và bản được chọn của sync_queue (G-FG14-07).
  luong_chinh:
  - BE chốt kiểu các ô còn mở và cột thêm với Tech Lead, ghi vào SKM_DB trước khi viết migration (P-06).
  - BE viết migration ba bảng; duplicate_key_findings bị chặn sửa và xoá ở mức quyền CSDL.
  - BE nạp dữ liệu ban đầu của retention_policies theo bảng thời hạn của RFP, mỗi loại tài liệu một dòng.
  - SC-142/BE, SC-143/BE và SC-151/BE chạy thử trên dữ liệu mẫu trước khi dựng màn.
  tieu_chi_nghiem_thu:
  - Khi migration chạy xong thì retention_policies có dòng cho dữ liệu nghiệp vụ 7 năm trực tuyến và dòng cho ảnh, chứng từ bổ trợ 3 năm trực tuyến, khôi phục tối đa 2 ngày (G-FG14-03).
  - Khi sửa hay xoá một dòng duplicate_key_findings thì CSDL từ chối.
  - Khi ghi vào sync_queue một thao tác ngoài ba thao tác được ghi tạm thì CSDL từ chối.
  dinh_nghia_xong:
  - SKM_DB ghi kiểu và cột thêm của ba bảng, không còn ô «—» (P-06).
