  - G-FG14-03
  - G-FG14-04
  mo_ta: システム管理者 (quản trị hệ thống) đặt thời hạn lưu trực tuyến và lưu lạnh cho từng loại tài liệu, 内部監査 (kiểm toán nội bộ) xem lại. Dữ liệu nghiệp vụ giữ 7 năm trực tuyến, ảnh và chứng từ bổ trợ 3 năm trực tuyến rồi sang lưu lạnh, khôi phục tối đa 2 ngày. Tới hạn chỉ chuyển lớp, không xoá, vì chưa ai được giao duyệt xoá vật lý (P-19).
  pham_vi: Màn SC-142 (SPEC-SKM-169) ở văn phòng; bảng `retention_policies` (migration thuộc DATA-FG14/DB, sửa được, đổi là ghi `audit_log`); API, tác vụ chuyển lớp và bước duyệt xoá chưa có spec, SC-142/BE viết rồi làm (P-01); kho lưu lạnh dựng ở PLT-02.
  luong_chinh:
  - Người quản trị mở SC-142, xem số năm trực tuyến, số năm lưu lạnh và thời gian khôi phục của từng loại.
  - Người quản trị sửa thời hạn một loại rồi bấm Lưu; máy chủ ghi giá trị mới kèm dòng audit_log.
  - Tác vụ nền chạy theo lịch, chuyển tệp quá hạn trực tuyến sang lưu lạnh, ghi kết quả từng lần.
  - Dữ liệu hết mọi hạn được đánh dấu chờ duyệt xoá.
  tieu_chi_nghiem_thu:
  - Khi đổi số năm của một loại thì lần chạy kế tiếp dùng giá trị mới, không phải phát hành lại.
  - Khi tệp quá hạn trực tuyến thì tác vụ chuyển nó sang lưu lạnh, dòng attachments giữ nguyên, tệp khôi phục được trong 2 ngày.
  - Khi giao dịch hay đối soát đã vào báo cáo chính thức thì không lệnh nào xoá cứng được, kể cả khi có người duyệt.
  - Khi chưa ai được giao duyệt xoá thì lệnh xoá vật lý bị từ chối, không dữ liệu nào mất (P-19).
  - Khi người gọi chưa mang vai có dòng trong ma trận quyền thì API trả 403 M_05 (P-12).
  dinh_nghia_xong:
  - Spec SC-142 có ô sửa, hạn theo loại tài liệu của RFP và bước duyệt xoá (G-FG14-03, G-FG14-04).
