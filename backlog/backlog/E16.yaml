  premise_refs:
  - P-04
  gap_refs:
  - G-E16-02
  - G-E16-04
  - G-E16-05
  mo_ta: 'BE làm module migration trong khối triển khai duy nhất (ADR-009): đọc file vào bảng đệm giữ dòng gốc, áp quy tắc của MIG-01, rồi ghi qua hàm công khai của module chủ, không ghi thẳng vào bảng đích. Mỗi lần nạp là một lô chỉ thêm; lô chỉ hoàn tất khi số bản ghi và tổng tiền khớp, hoặc mọi lệch đã có người quyết.'
  pham_vi:
  - Bảng đệm, bảng lô nạp và cột dấu nguồn, chưa có trong 45 thực thể (G-E16-02).
  - Hàm ghi công khai của module chủ từng bảng và khung ghi chỉ-thêm của PLT-03.
  - Danh sách dòng xung đột và lệnh ghi quyết định cho người của chợ (G-E16-05).
  luong_chinh:
  - Người vận hành di trú chọn nguồn và khoảng ngày; module tạo một lô mới.
  - Module đọc file vào bảng đệm, giữ nguyên dòng gốc, mã nguồn và số dòng.
  - Module áp quy tắc; dòng đạt được ghi qua hàm của module chủ kèm dấu nguồn migrated và mã lô, dòng xung đột chờ người quyết.
  - Module so số bản ghi và tổng tiền giữa nguồn và đích; còn lệch thì lô ở trạng thái chờ.
  - Người của chợ quyết từng dòng xung đột; hệ thống ghi quyết định, người của phiên và giờ máy chủ.
  tieu_chi_nghiem_thu:
  - Khi số bản ghi hoặc tổng tiền nguồn khác đích mà còn dòng chưa quyết thì lô không sang hoàn tất.
  - Khi người của chợ quyết một dòng xung đột thì bản ghi lưu quyết định, người của phiên và giờ máy chủ; máy không tự chọn bên đúng.
  - Khi nạp lại cùng nguồn thì có lô mới, lô cũ và dòng đệm cũ giữ nguyên.
  - Khi module migration gọi thẳng lớp ghi của module khác thì luật kiểm kiến trúc làm CI đỏ.
  dinh_nghia_xong:
  - SKM_DB có bảng lô nạp, bảng đệm và cột dấu nguồn mang nhãn thiết kế-chưa-build trước khi viết migration (G-E16-02).
