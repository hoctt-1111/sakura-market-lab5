  - G-E16-01
  mo_ta: BE cùng người phụ trách dữ liệu phía chợ lập bảng kiểm kê cho từng nguồn di trú (người chịu trách nhiệm, khoảng ngày, khoá định danh, số dòng) rồi viết quy tắc ánh xạ và làm sạch từ cột của file sang bảng của hệ đích. Bảng kiểm kê và ánh xạ là đầu vào của MIG-02; chưa có kiểm kê thì chưa khoá được ánh xạ (ADR-016).
  pham_vi:
  - Ba loại nguồn rc7 nêu tên, tối đa 5 nguồn theo giả định GD-02 chờ khách xác nhận (G-E16-01).
  - Bảng đích thuộc 45 bảng của hệ đích (P-04); mỗi dòng ánh xạ ghi bảng, cột đích và module chủ.
  - 'Quy tắc cho ba lỗi mẫu DS-DIRTY-01: mã người tham gia lệch giữa hai nguồn, khoá lô trùng trong cùng 業務日 (ngày nghiệp vụ), ô trống ở trường trọng yếu.'
  luong_chinh:
  - BrSE gửi khách mẫu bảng kiểm kê; người phụ trách dữ liệu của chợ điền nguồn, khoảng ngày và số dòng.
  - BE đọc mẫu file từng nguồn, ghi cột nguồn sang bảng và cột đích nào.
  - BE viết quy tắc làm sạch; quy tắc nào cũng nói dòng không đạt sẽ đi đâu.
  - Tech Lead duyệt bảng ánh xạ, người phụ trách dữ liệu xác nhận cách hiểu cột nghiệp vụ.
  - Bảng kiểm kê và ánh xạ đã duyệt được khoá làm đầu vào cho MIG-02.
  tieu_chi_nghiem_thu:
  - Khi nguồn còn thiếu người chịu trách nhiệm, khoảng ngày hoặc khoá định danh thì nguồn đó chưa vào ánh xạ.
  - Khi cột của file không có đích thì ánh xạ ghi cột đó bị bỏ, chỉ quét lưu hay ngoài phạm vi, kèm người quyết.
  - Khi dòng nguồn mắc một trong ba lỗi mẫu thì dòng chuyển sang chờ người quyết, không tự sửa.
  - Khi kiểm kê vượt 5 nguồn, 200.000 dòng hoặc 3 năm thì PM tính lại công di trú trước khi khoá ánh xạ.
  dinh_nghia_xong:
  - Bảng kiểm kê có xác nhận của người phụ trách dữ liệu phía chợ, ghi tên và ngày.
