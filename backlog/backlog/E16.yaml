- key: MIG-02-1
  cha: E16
  tracker: story
  title_vi: Bảng đệm, lô nạp và đọc file vào đệm (1/2)
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr:
    - ADR-016
    nfr: []
  labels:
  - type:story
