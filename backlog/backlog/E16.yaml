    fr: []
    adr:
    - ADR-016
    nfr: []
  labels:
  - type:story
  - spec-gap
  owner: BE-1
  priority: 3
  premise_refs: []
  gap_refs:
  - G-E16-03
  mo_ta: Đội dự án chạy ít nhất một buổi diễn tập di trú đầy đủ trên môi trường thử với dữ liệu đã che, theo đúng ba đợt nạp, rồi lập biên bản đối chiếu số bản ghi và số tiền trước–sau. Tiêu chí cho chạy thật hay dừng và cách hoàn tác phải được viết và duyệt trước buổi diễn tập đầu (G-E16-03).
  pham_vi: Môi trường thử của PLT-02 với dữ liệu đã che (G-E15-03); công cụ của MIG-02; ba đợt nạp theo FIG-022 (người tham gia, quyền; rồi lô, giao dịch; rồi tất toán, báo cáo); thời điểm đóng băng dữ liệu nguồn, biên bản đối chiếu và tiêu chí dừng.
  luong_chinh:
  - PM và Tech Lead viết tiêu chí chạy thật hay dừng và cách hoàn tác; khách duyệt qua BrSE.
  - Infra nạp bản che của file nguồn vào môi trường thử và đóng băng bản dùng cho buổi diễn tập.
  - BE chạy ba đợt nạp theo thứ tự và đo thời gian từng đợt.
  - BE lập biên bản đối chiếu theo nguồn; người của chợ quyết các chênh lệch.
  - BE hoàn tác thử một lô bằng bút toán đảo và đối chiếu số trên khung nhìn.
  - PM ghi kết quả và quyết chạy thật hay diễn tập lại theo tiêu chí đã duyệt.
  tieu_chi_nghiem_thu:
  - Khi buổi diễn tập xong thì biên bản có số bản ghi, tổng tiền nguồn và đích của từng nguồn, mỗi chênh lệch có người quyết và giờ quyết.
  - Khi hoàn tác một lô thì không dòng nào bị xoá và số đọc qua khung nhìn bằng số trước khi nạp lô đó.
  - Khi chạm một tiêu chí dừng thì ngày chạy thật không được chốt, kể cả khi lịch đã đặt.
  - Khi đo thời gian nạp thì số đo thật ghi vào biên bản; lô lớn đặt ngoài cửa sổ dịch vụ 02:00–10:00 giờ Nhật.
  dinh_nghia_xong:
  - Tiêu chí chạy thật hay dừng và cách hoàn tác có người duyệt phía khách và ngày duyệt, có trước buổi diễn tập đầu (G-E16-03).
