  owner: BE-1
  priority: 3
  premise_refs:
  - P-04
  gap_refs:
  - G-E16-02
  mo_ta: 'Phần 1/2 của công cụ nạp qua bảng đệm (ADR-016): dựng bảng đệm, bảng lô nạp và cột dấu nguồn trong SKM_DB, rồi làm bước đọc file của module migration trong khối triển khai duy nhất (ADR-009): mỗi lần nạp mở một lô mới, dòng file vào bảng đệm nguyên giá trị kèm mã nguồn và mã lô. Phần này dừng ở dòng đã nằm trong đệm; áp quy tắc của MIG-01, ghi qua module chủ và đối chiếu thuộc phần 2/2 (MIG-02-2).'
  pham_vi:
  - Bảng đệm, bảng lô nạp và cột dấu nguồn, mã lô ở bảng đích chỉ-thêm, chưa có trong 45 thực thể (G-E16-02).
  - Bước mở lô và đọc file vào đệm của module migration; chưa gồm áp quy tắc, ghi bảng nghiệp vụ và đối chiếu.
  luong_chinh:
  - BE viết migration cho bảng đệm, bảng lô nạp và cột dấu nguồn, mã lô ở bảng đích chỉ-thêm; Tech Lead duyệt trước khi viết mã đọc file.
  - Người vận hành di trú chọn nguồn và khoảng ngày; module tạo một lô mới.
  - Module đọc file vào bảng đệm, giữ nguyên dòng gốc, mã nguồn và số dòng.
  - Lô dừng ở trạng thái đã vào đệm, chờ MIG-02-2 áp quy tắc và đối chiếu.
  tieu_chi_nghiem_thu:
  - Khi file đã đọc xong thì số dòng đệm của lô bằng số dòng của file và mỗi dòng đệm giữ nguyên giá trị gốc kèm mã nguồn, mã lô.
  - Khi nạp lại cùng nguồn thì có lô mới, lô cũ và dòng đệm cũ giữ nguyên.
  - Khi bước đọc file chạy thì không bảng nghiệp vụ nào bị ghi; dòng chỉ nằm ở bảng đệm.
  dinh_nghia_xong:
  - SKM_DB có bảng lô nạp, bảng đệm và cột dấu nguồn mang nhãn thiết kế-chưa-build trước khi viết migration (G-E16-02).
