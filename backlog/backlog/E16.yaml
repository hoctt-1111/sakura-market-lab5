  - G-E16-04
  - G-E16-05
  mo_ta: 'Phần 2/2 của công cụ nạp qua bảng đệm (ADR-016), tiếp sau MIG-02-1 đã đưa dòng file vào đệm: module áp quy tắc ánh xạ và làm sạch của MIG-01 lên dòng đệm, ghi dòng đạt qua hàm công khai của module chủ, không ghi thẳng vào bảng đích, rồi so số bản ghi và tổng tiền giữa nguồn và đích. Lô chỉ hoàn tất khi khớp, hoặc mọi lệch đã có người của chợ quyết; máy không tự chọn bên đúng.'
  pham_vi:
  - Hàm ghi công khai của module chủ từng bảng và khung ghi chỉ-thêm của PLT-03.
  - Phép so số bản ghi và tổng tiền theo tổng lô, theo ngày nghiệp vụ và theo người tham gia (G-E16-04).
  - Danh sách dòng xung đột và lệnh ghi quyết định cho người của chợ (G-E16-05).
  luong_chinh:
  - Module áp quy tắc của MIG-01 lên dòng đệm của lô; dòng đạt được ghi qua hàm của module chủ kèm dấu nguồn migrated và mã lô, dòng xung đột chờ người quyết.
  - Module so số bản ghi và tổng tiền giữa nguồn và đích; còn lệch thì lô ở trạng thái chờ.
  - Người của chợ quyết từng dòng xung đột; hệ thống ghi quyết định, người của phiên và giờ máy chủ.
  - Khi hết lệch hoặc mọi lệch đã có người quyết thì lô sang hoàn tất.
  tieu_chi_nghiem_thu:
  - Khi số bản ghi hoặc tổng tiền nguồn khác đích mà còn dòng chưa quyết thì lô không sang hoàn tất.
  - Khi người của chợ quyết một dòng xung đột thì bản ghi lưu quyết định, người của phiên và giờ máy chủ; máy không tự chọn bên đúng.
  - Khi module migration gọi thẳng lớp ghi của module khác thì luật kiểm kiến trúc làm CI đỏ.
  - Khi lô hoàn tất thì mọi dòng ghi vào bảng đích mang dấu nguồn migrated và mã lô của lô đó.
  dinh_nghia_xong:
  - Mức so và chỗ người của chợ quyết dòng xung đột được chốt bằng văn bản ở issue trước khi đóng, thay cho giả định đang dùng (G-E16-04, G-E16-05).
