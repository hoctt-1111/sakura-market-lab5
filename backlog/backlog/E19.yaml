- key: DOC-01
  cha: E19
  tracker: story
  title_vi: Hướng dẫn người dùng cho vai văn phòng
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
    sd:
    - trien_khai.d
  labels:
  - type:story
  owner: QA
  priority: 3
  premise_refs:
  - P-54
  - P-55
  gap_refs: []
  mo_ta: 'BrSE viết hướng dẫn người dùng tiếng Nhật cho các vai văn phòng, QA kiểm bằng cách làm theo từng bước trên môi trường thử. Nội dung đi theo luồng chính của story: quản trị tài khoản và quyền (FG-01), tư cách người tham gia (FG-02), sửa sau chốt (FG-06), đối soát ngày và khoá 業務日 (ngày nghiệp vụ, FG-08), 完納奨励金 (thưởng thanh toán đủ hạn) và bản quy tắc (FG-09, FG-10), báo cáo và xuất kế toán (FG-11), thông báo và cảnh báo (FG-12), kiểm toán và dữ liệu cá nhân (FG-13). Tài liệu là giáo trình cho 4 lớp đào tạo theo vai của EF-26 LAB-1 (BrSE, 22 man-day) và đi cùng gói bàn giao REL-04, thành issue theo review PM 21/10.'
  pham_vi: 'Hướng dẫn tiếng Nhật có ảnh màn chụp trên môi trường thử với dữ liệu đã che (G-E15-03), nhãn màn theo ngôn ngữ giao diện P-55; phủ 56 màn chỉ dùng ở văn phòng và 9 màn dùng cả hai nơi theo cột thiết bị của danh sách màn LAB-4, cùng 2 khuôn báo cáo. Không gồm sổ tay vận hành (EF-24, REL-04) và tài liệu kỹ thuật. Nguồn: EF-26 (effort-other.yaml:191 của LAB-1).'
  luong_chinh:
  - BrSE cùng QA lập dàn ý theo vai, mỗi mục bám luồng chính của story liên quan; PM chốt dàn ý.
  - BrSE viết bản tiếng Nhật, chụp ảnh màn trên môi trường thử; người thứ hai đọc lại.
  - QA làm theo từng bước bằng tài khoản đúng vai trên môi trường thử, ghi chỗ lệch giữa tài liệu và màn.
  - BrSE sửa theo ghi nhận của QA, gửi khách góp ý trước lớp đào tạo đầu tiên; góp ý ghi ở issue, bản cuối vào gói bàn giao REL-04.
  tieu_chi_nghiem_thu:
  - Khi QA làm theo từng bước với tài khoản của vai thì tới được kết quả tài liệu mô tả, không bước nào cần quyền của vai khác.
  - Khi tài liệu gửi khách thì bản tiếng Nhật đã có người thứ hai đọc, ngày gửi và người nhận ghi ở issue.
  - Khi một thao tác cần người xác nhận (duyệt bản quy tắc, 確定 (xác nhận cuối) khoản thưởng, khoá ngày) thì tài liệu nêu ai làm, điều kiện và hệ thống ghi gì theo quyền của đúng thao tác đó (FG-10 tách người lập và người duyệt; TECH-304 thì không).
  - Khi một màn trong tài liệu đổi sau ngày chụp ảnh thì ảnh và bước được cập nhật trước phát hành production.
  dinh_nghia_xong:
  - Khách đã góp ý và bản cuối nằm trong gói bàn giao REL-04.
