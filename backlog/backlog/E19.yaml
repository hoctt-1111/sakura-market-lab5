  mo_ta: 'Phần 1/3 của REL-03 (diễn tập phát hành trên môi trường thử): PM lên lịch diễn tập như một lần phát hành thật, Infra triển khai bản dựng ứng viên lên môi trường thử theo đúng quy trình REL-01 và đo thời gian từng bước. Nạp dữ liệu di trú và kiểm khói là phần 2; thử lùi bản và biên bản là phần 3.'
  pham_vi: Môi trường thử của PLT-02; bản dựng ứng viên; quy trình và lịch của REL-01; thời gian từng bước so với 16 giờ ngoài cửa sổ dịch vụ mỗi ngày (ADR-009).
