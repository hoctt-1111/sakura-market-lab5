  mo_ta: 'Phần 1/3 của story gốc REL-01 (môi trường production và quy trình phát hành): Infra dựng production từ cùng bộ cấu hình với môi trường thử, chỉ khác các tham số đã khai. Phần này dừng ở chỗ production đứng được và giám sát đã lên; thứ tự phát hành và lịch thuộc phần 2, lần phát hành thật thuộc phần 3.'
  pham_vi: 'Production ở ap-northeast-1 theo ADR-015: nhiều máy ứng dụng, CSDL có bản dự phòng đồng bộ, sao lưu, giám sát, chặn dữ liệu ra ngoài vùng Nhật. Không gồm bước triển khai bản dựng hay migration.'
  luong_chinh:
  - Infra tách tham số môi trường ra khỏi cấu hình chung trong repo và khai bộ tham số production.
  - Infra dựng production bằng cấu hình đó, bật bản dự phòng đồng bộ, sao lưu định kỳ và giám sát.
  - Infra chặn đường dữ liệu ra ngoài vùng Nhật và ghi cách dựng lại từ đầu vào README vận hành.
  - QA so cấu hình production với môi trường thử và ghi lại mọi chỗ khác.
  tieu_chi_nghiem_thu:
  - Khi so cấu hình production với môi trường thử thì chỉ khác các tham số đã khai, không có tài nguyên dựng tay.
  - Khi dựng lại production từ đầu theo README thì ra cùng bộ tài nguyên, không cần bước làm tay.
  - Khi CSDL chính bị ngắt thử thì bản dự phòng đồng bộ tiếp quản và giám sát có cảnh báo.
  dinh_nghia_xong:
  - Cách dựng production và bộ tham số khác môi trường thử ghi trong README vận hành, có Tech Lead duyệt.
