  - G-E19-03
  mo_ta: 'PM và Tech Lead viết kế hoạch hoàn nguyên cho từng bước phát hành: bản ứng dụng lùi về bản trước, migration đã có dữ liệu thật thì sửa tiến bằng migration mới, lô di trú thì đảo bằng bút toán đảo. Khi đã vận hành thật, khoá 業務日 (ngày nghiệp vụ) và tệp xuất kế toán đã gửi là hai bước không quay lại được, nên kế hoạch chỉ có đường bù cho hai bước này (G-E19-03).'
  pham_vi:
  - Mọi bước của REL-01; lô di trú của E16 (ADR-016); bảng business_day_locks; lô xuất export_batches (ADR-014, P-17).
  - 'Đường bù: sai sót sau khoá đi qua điều chỉnh có duyệt của FG-06; tệp xuất sai thì chạy lại cùng mã lô để bên nhận đối chiếu.'
  luong_chinh:
  - Tech Lead liệt kê từng bước phát hành, ghi bước đó hoàn tác được không và bằng cách nào.
  - 'PM đặt mốc không quay lại trên lịch: sau lần khoá ngày hoặc lần xuất kế toán thật đầu tiên chỉ còn đường bù.'
  - BE giữ migration ở dạng chỉ thêm bảng, thêm cột, để bản ứng dụng trước vẫn chạy được trên lược đồ mới.
  - QA chạy thử từng đường lùi trên môi trường thử trong buổi diễn tập của REL-03.
  - Khách duyệt kế hoạch qua BrSE trước ngày phát hành.
  tieu_chi_nghiem_thu:
  - Khi lùi bản ứng dụng thì bản trước chạy được trên lược đồ CSDL hiện tại và không mất dữ liệu đã ghi.
  - Khi cần bỏ một lô di trú thì dữ liệu được đảo bằng bút toán đảo, không dòng nào bị xoá.
  - Khi ngày đã khoá có sai sót thì kế hoạch dẫn sang điều chỉnh có duyệt, không có bước xoá bản khoá.
  - Khi tệp xuất đã gửi bị sai thì kế hoạch chạy lại cùng mã lô, không sinh lô mới (ADR-014).
  dinh_nghia_xong:
  - Kế hoạch hoàn nguyên có ngày khách duyệt, và mốc không quay lại được ghi trên lịch phát hành (G-E19-03).
