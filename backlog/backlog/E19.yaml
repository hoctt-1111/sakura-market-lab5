  - P-55
  gap_refs: []
  mo_ta: Viết hướng dẫn người dùng tiếng Nhật cho vai hiện trường theo dàn ý đã chốt, chụp ảnh màn trên môi trường thử, gửi khách góp ý và cập nhật bản cuối cho gói bàn giao.
  pham_vi: ''
  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Bản tiếng Nhật có người thứ hai đọc trước khi gửi; người nhận là người phụ trách nghiệp vụ phía khách, bản sao cho PM và QA; ngày gửi ghi ở issue.
  - Ảnh màn chụp trên môi trường thử, không có dữ liệu thật; mỗi bước nêu ai làm và màn hiện gì.
  - Góp ý của khách và chỗ lệch QA ghi nhận đều có dòng xử lý ở issue trước khi bản cuối vào REL-04.
  dinh_nghia_xong: []
- key: DOC-03-1
  cha: E19
  tracker: story
  title_vi: Hai lớp đào tạo vai văn phòng (1/2)
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
    sd:
    - trien_khai.d
  labels:
  - type:story
  owner: PM
  priority: 3
  premise_refs:
  - P-54
  gap_refs: []
  mo_ta: 'Phần 1/2 của việc tổ chức bốn lớp đào tạo theo vai (EF-26 LAB-1, BrSE 22 man-day; tách hai phần theo nhóm vai vì lá BrSE vượt trần một sprint, P-58): lớp một về tài khoản, tư cách, bản quy tắc và 完納奨励金 (thưởng thanh toán đủ hạn); lớp hai về đối soát ngày, khoá 業務日 (ngày nghiệp vụ), báo cáo và xuất kế toán, trên giáo trình DOC-01 cho 照合事務, người duyệt, bộ phận đối soát và kế toán. Học trên môi trường thử với dữ liệu đã che, tài khoản đúng vai, có bài thực hành và xác nhận của khách. Thành issue 23/10 theo review 22/10 vì viết giáo trình chưa phải thực hiện đào tạo của EF-26.'
  pham_vi:
  - Hai lớp, mỗi lớp nửa ngày, tối đa mười hai người.
  - Tài khoản theo vai và dữ liệu đã che trên môi trường thử (PLT-02-5); bài thực hành bám luồng chính của story liên quan.
  - Điểm danh, phiếu góp ý; lỗi tài liệu phát hiện trong lớp ghi về DOC-01.
  - Không gồm huấn luyện đội vận hành của khách (REL-04) và tài liệu kỹ thuật.
  luong_chinh:
  - PM chốt lịch hai lớp và danh sách học viên với khách qua BrSE, ít nhất hai tuần trước lớp đầu.
  - BrSE dạy từng lớp theo giáo trình, QA hỗ trợ tài khoản; học viên làm bài thực hành trên đúng vai.
  - PM thu điểm danh, phiếu góp ý và kết quả thực hành; lỗi tài liệu chuyển về DOC-01.
  - BrSE gửi khách biên bản hai lớp; khách xác nhận bằng văn bản, biên bản vào gói bàn giao REL-04.
  tieu_chi_nghiem_thu:
  - Khi một lớp kết thúc thì có danh sách tham dự ký tên, bài thực hành của từng học viên hoàn thành trên tài khoản đúng vai và phiếu góp ý.
  - Khi học viên làm bài thực hành thì không bước nào cần quyền của vai khác và không dùng dữ liệu thật (dữ liệu che của PLT-02-5).
  - Khi lớp phát hiện tài liệu lệch màn thì ghi nhận chuyển về DOC-01 trong ngày và sửa trước phát hành.
  - Khi đủ hai lớp thì khách xác nhận bằng văn bản, ghi ngày và người xác nhận ở issue.
  dinh_nghia_xong:
  - Hai biên bản lớp và xác nhận của khách nằm trong gói bàn giao REL-04; DOC-01 đã sửa theo lỗi phát hiện trong lớp.
