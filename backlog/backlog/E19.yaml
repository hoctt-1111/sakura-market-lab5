  mo_ta: 'Phần 2/3 của REL-03: BE nạp dữ liệu di trú đã che lên bản vừa triển khai ở phần 1, QA chạy kiểm khói và theo dõi cảnh báo. Mục «cách biết là hỏng» của LAB-4 chỉ nói về cổng kiểm của bộ tài liệu (G-E19-04), nên phần này đặt dấu hiệu hỏng cho hệ đang chạy: API-220, kiểm khói các luồng lõi và cảnh báo của bốn nhóm giám sát.'
  pham_vi: Diễn tập di trú MIG-03 với dữ liệu đã che; bộ kiểm khói của REL-01; cảnh báo của NFR-OPS; danh sách dấu hiệu hỏng cho hệ đang chạy.
  luong_chinh:
