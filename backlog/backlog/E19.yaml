  mo_ta: 'Phần 2/3 của REL-01: viết quy trình phát hành một bản dựng đã qua môi trường thử và đặt lịch ngoài cửa sổ dịch vụ. Thứ tự ở mục triển khai của LAB-4 là thứ tự làm tài liệu (G-E19-01) nên phần này viết lại thứ tự cho hệ viết mới; lần phát hành nào cũng đặt ngoài cửa sổ dịch vụ và báo trước người dùng (G-E19-02). Phần 1 đã có production; lần chạy thật là phần 3.'
  pham_vi: 'Thứ tự phát hành: migration cả 45 bảng (P-04), bản ứng dụng, dữ liệu di trú của E16, rồi mới mở cho người dùng; không bước nào coi 18 bảng của prototype là đã có. Bước triển khai production trong luồng CI cần người duyệt và chỉ nhận bản dựng đã qua môi trường thử.'
  luong_chinh:
  - Tech Lead viết thứ tự phát hành cho hệ viết mới, từng bước ghi ai làm và điều kiện đi tiếp.
  - 'Infra thêm bước triển khai production vào luồng CI: cần người duyệt, chỉ nhận bản dựng đã qua môi trường thử, chặn lịch rơi vào cửa sổ dịch vụ.'
  - PM chốt lịch phát hành ngoài cửa sổ dịch vụ và báo trước người dùng của chợ.
  - Tech Lead duyệt quy trình và ghi vào README vận hành.
  tieu_chi_nghiem_thu:
  - Khi phát hành thì thời điểm nằm ngoài cửa sổ dịch vụ và người dùng đã được báo trước.
  - Khi đặt lịch triển khai rơi vào cửa sổ dịch vụ thì luồng chặn và chờ người duyệt riêng.
  - Khi đọc quy trình thì migration cả 45 bảng đứng trước bản ứng dụng, không bước nào coi bảng của prototype là đã có.
  dinh_nghia_xong:
  - Quy trình và thứ tự phát hành ghi trong README vận hành, có Tech Lead duyệt.
