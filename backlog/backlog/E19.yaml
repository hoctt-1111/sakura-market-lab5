  premise_refs:
  - P-04
  gap_refs:
  - G-E19-01
  - G-E19-02
  - G-A-DB-d2-chi-27-bang
  mo_ta: Infra dựng production từ cùng bộ cấu hình với môi trường thử, chỉ khác tham số, và viết quy trình phát hành một bản dựng đã qua môi trường thử. Thứ tự ở mục triển khai của LAB-4 là thứ tự làm tài liệu (G-E19-01), nên story này viết lại thứ tự cho hệ viết mới; lần phát hành nào cũng đặt ngoài cửa sổ dịch vụ và báo trước người dùng (G-E19-02).
  pham_vi: 'Production ở ap-northeast-1 theo ADR-015 (nhiều máy ứng dụng, CSDL có bản dự phòng đồng bộ, sao lưu, giám sát). Thứ tự phát hành: migration cả 45 bảng (P-04), bản ứng dụng, dữ liệu di trú của E16, rồi mới mở cho người dùng; không bước nào coi 18 bảng của prototype là đã có.'
  luong_chinh:
  - Infra dựng production bằng cấu hình trong repo, bật bản dự phòng, sao lưu, giám sát và chặn dữ liệu ra ngoài vùng Nhật.
  - PM chốt lịch phát hành ngoài cửa sổ dịch vụ và báo trước người dùng của chợ.
  - Infra đưa đúng bản dựng đã diễn tập ở REL-03 lên, chạy migration rồi triển khai ứng dụng; BE nạp dữ liệu di trú theo kết quả MIG-03.
  - QA chạy kiểm khói gồm API-220 và một lượt mỗi luồng lõi; PM quyết mở cho người dùng.
  tieu_chi_nghiem_thu:
  - Khi so cấu hình production với môi trường thử thì chỉ khác các tham số đã khai, không có tài nguyên dựng tay.
  - Khi phát hành thì thời điểm nằm ngoài cửa sổ dịch vụ và người dùng đã được báo trước.
  - Khi triển khai thì bản chạy trên production đúng là bản đã diễn tập trên môi trường thử.
  - Khi kiểm khói sau phát hành đỏ thì hệ chưa mở cho người dùng và kế hoạch hoàn nguyên của REL-02 được chạy.
  dinh_nghia_xong:
  - Quy trình và thứ tự phát hành ghi trong README vận hành, có Tech Lead duyệt.
