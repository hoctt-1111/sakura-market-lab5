  mo_ta: 'PM và Infra bàn giao cho đội vận hành của khách những gì cần để chạy hệ hằng ngày: tài liệu vận hành, lịch sao lưu và diễn tập khôi phục, cách đọc bảng giám sát và hàng đợi cảnh báo, người xem nhật ký hành vi bất thường, quyền hạ tầng và tài khoản quản trị đầu tiên. Danh sách D1–D6 của LAB-4 chỉ gồm sản phẩm tài liệu, chưa có mục bàn giao vận hành nào (G-E19-05).'
  pham_vi: Tài liệu vận hành (khởi động, dừng, phát hành, lùi bản, khôi phục); bàn giao bí mật và quyền hạ tầng; tài khoản quản trị đầu tiên (G-FG01-04); một câu trả lời thống nhất rằng nền tảng là lựa chọn của giai đoạn thiết kế, chưa phải điều khoản hợp đồng (ADR-008); buổi huấn luyện cho đội vận hành.
  luong_chinh:
  - Infra viết tài liệu vận hành từ quy trình đã diễn tập ở REL-03.
  - PM cùng khách chỉ định người xem nhật ký hành vi bất thường và người nhận cảnh báo.
  - Infra bàn giao quyền hạ tầng và cách xoay vòng bí mật; đội dự án rút các quyền không còn cần.
  - 'PM tổ chức buổi huấn luyện: đọc SC-150, SC-122 và chạy một lần khôi phục thử.'
  - Khách ký biên bản bàn giao qua BrSE.
  tieu_chi_nghiem_thu:
  - Khi người vận hành của khách làm theo tài liệu thì tự chạy được một lần khôi phục thử trên môi trường thử.
  - Khi có cảnh báo ở SC-122 thì người nhận đã có tên trong danh sách bàn giao.
  - Khi bàn giao xong thì tài khoản và quyền của đội dự án trên production đã rút hoặc chuyển cho khách, có danh sách đối chiếu.
  - Khi ký bàn giao thì biên bản có người nhận phía khách và ngày ký.
  dinh_nghia_xong:
  - Tài liệu vận hành nằm trong repo hệ đích và có bản tiếng Nhật cho đội của khách.
