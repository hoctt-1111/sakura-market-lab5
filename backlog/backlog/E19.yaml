  mo_ta: 'Phần 3/3 của REL-01, lần phát hành thật: đưa bản dựng đã diễn tập ở REL-03 lên production theo quy trình của phần 2, chạy migration, nạp dữ liệu di trú, kiểm khói rồi mở cho người dùng. Phần này đóng story gốc: đây là lần đầu hệ đích chạy cho người dùng thật.'
  pham_vi: Migration cả 45 bảng của hệ đích (P-04) trên CSDL production trống, không bước nào coi 18 bảng của prototype là đã có; bản ứng dụng đã diễn tập; dữ liệu di trú theo kết quả MIG-03; kiểm khói gồm API-220 và một lượt mỗi luồng lõi; quyết định mở của PM.
  luong_chinh:
