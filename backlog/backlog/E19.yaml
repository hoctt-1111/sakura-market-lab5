  mo_ta: 'Phần 1/2 của REL-04 (bàn giao vận hành): Infra viết tài liệu vận hành từ quy trình đã diễn tập ở REL-03 và bàn giao quyền hạ tầng, bí mật, tài khoản quản trị đầu tiên cho đội vận hành của khách. Danh sách D1–D6 của LAB-4 chỉ gồm sản phẩm tài liệu, chưa có mục bàn giao vận hành nào (G-E19-05). Huấn luyện và ký biên bản là phần 2.'
  pham_vi: Tài liệu vận hành (khởi động, dừng, phát hành, lùi bản, khôi phục) có bản tiếng Nhật; lịch sao lưu và diễn tập khôi phục; cách đọc bảng giám sát SC-150 và hàng đợi cảnh báo SC-122; bàn giao bí mật và quyền hạ tầng; tài khoản quản trị đầu tiên (G-FG01-04); một câu trả lời thống nhất rằng nền tảng là lựa chọn của giai đoạn thiết kế, chưa phải điều khoản hợp đồng (ADR-008).
  luong_chinh:
  - Infra viết tài liệu vận hành từ quy trình đã diễn tập ở REL-03.
  - PM cùng khách chỉ định người xem nhật ký hành vi bất thường và người nhận cảnh báo.
  - Infra bàn giao quyền hạ tầng và cách xoay vòng bí mật; đội dự án rút các quyền không còn cần.
  - BrSE chuyển tài liệu sang tiếng Nhật và gửi khách đọc trước buổi huấn luyện của phần 2.
  tieu_chi_nghiem_thu:
  - Khi có cảnh báo ở SC-122 thì người nhận đã có tên trong danh sách bàn giao.
  - Khi bàn giao xong thì tài khoản và quyền của đội dự án trên production đã rút hoặc chuyển cho khách, có danh sách đối chiếu.
  - Khi khách nhận tài khoản quản trị đầu tiên thì cách nhận và cách đổi bí mật ghi trong tài liệu, đội dự án không còn giữ bí mật đó.
  dinh_nghia_xong:
  - Tài liệu vận hành nằm trong repo hệ đích và có bản tiếng Nhật cho đội của khách.
