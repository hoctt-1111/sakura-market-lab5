  tieu_chi_nghiem_thu:
  - Khi API-220 trả 500, kiểm khói đỏ hoặc có cảnh báo ở nhóm nào thì diễn tập dừng và ghi là hỏng.
  - Khi nạp dữ liệu di trú xong thì số đọc qua khung nhìn khớp kết quả diễn tập MIG-03.
  dinh_nghia_xong:
  - Danh sách dấu hiệu hỏng cho hệ đang chạy được Tech Lead duyệt, thay cho mục «cách biết là hỏng» của LAB-4 (G-E19-04).
