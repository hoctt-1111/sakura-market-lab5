  pham_vi: Môi trường thử của PLT-02; bản dựng ứng viên; kế hoạch của REL-01, REL-02; diễn tập di trú MIG-03; cảnh báo của NFR-OPS; thời gian từng bước so với 16 giờ ngoài cửa sổ dịch vụ mỗi ngày (ADR-009).
  luong_chinh:
  - PM lên lịch diễn tập như một lần phát hành thật, kể cả báo trước.
  - Infra triển khai bản dựng ứng viên lên môi trường thử theo đúng quy trình REL-01 và đo thời gian từng bước.
  - BE nạp dữ liệu di trú đã che; QA chạy kiểm khói và theo dõi cảnh báo.
  - Infra thử lùi bản ứng dụng và khôi phục CSDL theo REL-02.
  - 'PM ghi biên bản: các bước, thời gian, dấu hiệu hỏng gặp phải, quyết định đi tiếp hay sửa.'
  tieu_chi_nghiem_thu:
  - Khi diễn tập xong thì tổng thời gian các bước nằm gọn trong khoảng ngoài cửa sổ dịch vụ.
  - Khi API-220 trả 500, kiểm khói đỏ hoặc có cảnh báo ở nhóm nào thì diễn tập dừng và ghi là hỏng.
  - Khi thử lùi bản và khôi phục thì hệ trở về trạng thái trước diễn tập, có số đo thời gian.
  - Khi lưu biên bản thì có người chạy, ngày chạy và bản dựng đã dùng.
