  - spec-gap
  owner: QA
  priority: 3
  premise_refs:
  - P-17
  - P-59
  gap_refs:
  - G-E19-03
  mo_ta: 'Phần 2/2 của REL-02: khi đã vận hành thật, khoá 業務日 (ngày nghiệp vụ) và tệp xuất kế toán đã gửi là hai bước không quay lại được, nên kế hoạch chỉ có đường bù cho hai bước này (G-E19-03). Phần này đặt mốc không quay lại trên lịch và đưa khách duyệt toàn bộ kế hoạch, kể cả phần 1.'
  pham_vi:
  - Bảng business_day_locks; lô xuất export_batches (ADR-014, P-17); mốc không quay lại trên lịch phát hành.
  - 'Đường bù: sai sót sau khoá đi qua điều chỉnh có duyệt của FG-06. Tệp xuất đã gửi: lỗi truyền nhận thì chạy lại cùng mã lô để bên nhận đối chiếu; sai nội dung thì không sửa hay thay tệp đã gửi, điều chỉnh có duyệt của FG-06 ở 業務日 kế tiếp và xuất ở lô của ngày đó (P-59).'
  luong_chinh:
  - Tech Lead ghi hai bước không hoàn tác vào kế hoạch, mỗi bước kèm đường bù thay cho bước lùi.
  - 'PM đặt mốc không quay lại trên lịch: sau lần khoá ngày hoặc lần xuất kế toán thật đầu tiên chỉ còn đường bù.'
  - BrSE giải thích hai đường bù cho khách bằng ví dụ; khách duyệt kế hoạch qua BrSE trước ngày phát hành.
  tieu_chi_nghiem_thu:
  - Khi ngày đã khoá có sai sót thì kế hoạch dẫn sang điều chỉnh có duyệt, không có bước xoá bản khoá.
  - Khi tệp xuất đã gửi bị lỗi truyền nhận thì kế hoạch chạy lại cùng mã lô, không sinh lô mới (ADR-014); khi tệp đã gửi sai nội dung thì kế hoạch dẫn sang điều chỉnh có duyệt của FG-06 và lô của 業務日 kế tiếp, không có bước sửa hay thay tệp đã gửi (P-59).
  - Khi đọc lịch phát hành thì mốc không quay lại có ngày và khách đã biết trước.
  dinh_nghia_xong:
  - Kế hoạch hoàn nguyên có ngày khách duyệt, và mốc không quay lại được ghi trên lịch phát hành (G-E19-03).
