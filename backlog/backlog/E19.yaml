  - BE nạp dữ liệu di trú theo kết quả MIG-03.
  - QA chạy kiểm khói gồm API-220 và một lượt mỗi luồng lõi.
  - PM quyết mở cho người dùng; kiểm khói đỏ thì chạy kế hoạch hoàn nguyên của REL-02.
  tieu_chi_nghiem_thu:
  - Khi triển khai thì bản chạy trên production đúng là bản đã diễn tập trên môi trường thử.
  - Khi kiểm khói sau phát hành đỏ thì hệ chưa mở cho người dùng và kế hoạch hoàn nguyên của REL-02 được chạy.
  - Khi migration xong thì CSDL production có đủ 45 bảng và không bảng nào mang dữ liệu thử.
  - Khi mở cho người dùng thì biên bản phát hành ghi bản dựng, kết quả kiểm khói, người quyết và giờ mở.
  dinh_nghia_xong:
  - Biên bản phát hành thật lưu trong repo hệ đích, có bản dựng, kết quả kiểm khói và quyết định mở.
