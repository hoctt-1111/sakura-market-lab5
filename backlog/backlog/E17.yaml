- key: REG-01-1
  cha: E17
  tracker: story
  title_vi: Bảng phủ hồi quy và gom ca chạy một lệnh (1/2)
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
  labels:
  - type:story
  owner: QA
  priority: 3
  premise_refs:
  - P-54
  gap_refs: []
  mo_ta: 'Phần 1/2 của bộ hồi quy REG-01: QA lập bảng phủ 14 nhóm chức năng FG-01 tới FG-14, gom ca từ lá TEST của story đã đóng và từ mười hai kịch bản AC1 tới AC12 cùng API-220 trên khung QA-00 thành bộ chạy được bằng một lệnh, và giữ bảng phủ cập nhật khi luồng chính đổi. Việc chạy trước phát hành và xử ca trượt nằm ở REG-01-2. Là phần của EF-14 LAB-1 (QA, 65 man-day), thành issue theo review PM 21/10.'
  pham_vi: 'Bảng phủ 14 dòng, mỗi dòng một nhóm chức năng với luồng chính của story dẫn và ca hồi quy tương ứng; mười hai kịch bản AC; API-220; nhãn và lệnh chạy gộp. Không gồm lần chạy trước phát hành và quyết định khi trượt (REG-01-2); không gồm ca kiểm riêng của từng story và đo tải (E18). Nguồn: EF-14 của LAB-1; P-54.'
  luong_chinh:
  - 'QA lập bảng phủ: mỗi nhóm chức năng một dòng ghi luồng chính và ca hồi quy phủ nó; nhóm chưa có story đóng ghi «chưa phủ».'
  - QA gom ca từ lá TEST của story đã đóng và từ AC1 tới AC12 vào bộ hồi quy, gắn nhãn để chạy được bằng một lệnh.
  - QA chạy thử bộ hai lần trên cùng bản dựng để chắc lệnh gộp ổn định và báo cáo ra đúng khuôn.
  - Khi một story đóng làm đổi luồng chính của nhóm chức năng, QA cập nhật ca hồi quy của nhóm đó trong cùng sprint.
  tieu_chi_nghiem_thu:
  - Khi một nhóm chức năng có story dẫn đã đóng mà bảng phủ chưa có ca hồi quy cho luồng chính thì bộ chưa được coi là đủ để phát hành.
  - Khi chạy bộ bằng một lệnh thì ra báo cáo có số ca theo nhóm chức năng, số đạt và trượt, bản dựng và ngày chạy.
  - Khi chạy bộ hai lần trên cùng bản dựng và cùng dữ liệu thì cùng kết quả, không ca chập chờn.
  dinh_nghia_xong:
  - Bảng phủ 14 nhóm chức năng đính ở issue.
