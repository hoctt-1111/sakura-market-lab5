  mo_ta: 'Phần 1/2 của kịch bản AC11: せり進行役 (người điều hành phiên) nhập kết quả せり (đấu giá) của một lô ở SC-040, còn người ghi và thời điểm ghi do máy chủ gán từ phiên; màn không có ô nhập người ghi hay thời điểm. Gọi thẳng API-212 với giá trị giả, rà danh sách API và nghiệm thu nằm ở AC-11-2.

    Ràng buộc đặc thù: Màn không có ô nhập người ghi và thời điểm; giá trị trình duyệt gửi kèm bị bỏ qua.'
