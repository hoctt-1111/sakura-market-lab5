  premise_refs:
  - P-10
  gap_refs: []
  mo_ta: 'Kịch bản AC8 chứng minh 完納奨励金 (thưởng thanh toán đủ hạn) tính theo loại bên mua: cùng một hoá đơn 123.457 yên trả trong hạn, 仲卸 (trung gian bán buôn) và hai mức của 売買参加者 (người tham gia mua bán) ra ba số khác nhau, còn 買出人 (người mua lẻ) không có dòng suất thì 判定 (xét) ra 保留 (treo), không ra số. Bảng suất là giả định GD-17 (P-10); thứ tự và tiêu chí xếp mức chờ khách ở INV-GD-03.

    Ràng buộc đặc thù: nhân hệ số thuế 110/100 trước, rồi mới bỏ phần lẻ dưới một yên; dòng 保留 không 確定 (xác nhận cuối) được nên không thành tiền.'
  pham_vi: SC-080; API-215 (判定), API-216 (確定); TECH-304; bảng `incentives` (loại bên mua, mức, suất, số tiền, kết quả xét), `participants` (loại và mức), bản suất của FG-10; quy tắc A6, A9.
  luong_chinh:
  - 'Chuẩn bị: QA tạo bốn hoá đơn có 適格金額 (số tiền đủ điều kiện) 123.457 yên, trả trong hạn, cho một 仲卸, một 売買参加者 mức A, một 売買参加者 mức B và một 買出人; bản suất GD-17 đang hiệu lực.'
  - 'Thực hiện: 照合事務 (nhóm đối soát) chạy 判定 cho kỳ ở SC-080.'
  - 'Kiểm 1: số tiền ba dòng đầu là 2.037, 1.358, 1.086 yên; QA tính tay để đối chiếu.'
  - 'Kiểm 2: dòng 買出人 là 保留, suất 0, số tiền 0; bấm 確定 bị chặn, 却下 (bác) vẫn được.'
  - Khách và BrSE đối chiếu số tiền với cách tính của chợ, ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi chạy 判定 cho ba bên mua có dòng suất thì số tiền là 2.037 / 1.358 / 1.086 yên; ra 2.036 / 1.357 / 1.085 là đã cắt lẻ trước, sai.
  - Khi loại bên mua không có dòng trong bảng suất thì 判定 ghi 保留, suất 0, số tiền 0, không đủ điều kiện.
  - Khi bấm 確定 dòng 保留 thì máy chủ trả 422 NOT_ELIGIBLE, màn hiện M_12, dòng không đổi; 却下 kèm lý do vẫn được.
  - Khách nghiệm thu qua BrSE; bằng chứng gồm số tính tay, bốn dòng incentives và mã lỗi của lần 確定 bị chặn, ghi vào story kèm ngày chạy.
  dinh_nghia_xong:
  - Biên bản nghiệm thu có tên người nghiệm thu phía khách và ngày ký.
  - Số kỳ vọng của AC8 sửa lại nếu INV-GD-03 đáp suất hoặc tiêu chí mức khác GD-17 (P-10).
