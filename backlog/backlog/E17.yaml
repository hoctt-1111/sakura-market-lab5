- key: AC-3
  cha: E17
  tracker: story
  title_vi: Lô せり ế chỉ mở lại 相対 hoặc 直販
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
    ac:
    - AC3
    sd:
