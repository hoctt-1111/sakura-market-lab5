  - Khi khoá đã có 4 lần duyệt trong năm mà duyệt thêm thì trả 422 M_20, kể cả khi trước đó có lần lùi bản (G-FG10-03).
  - Khi người duyệt khác người lập và khoá chưa chạm trần thì bản được duyệt, chứng minh hai ca trên bị chặn đúng lý do.
