  title_vi: 'Giao nhận nhiều lần: 完了, 一部引渡 hay 例外あり theo luỹ kế và ngoại lệ'
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
    ac:
    - AC10
    sd:
    - A8
  labels:
  - type:story
  - constraint:hitl
  owner: PM
  priority: 2
  premise_refs:
  - P-13
  gap_refs: []
  mo_ta: 'Kịch bản AC10 chứng minh giao dịch giao nhiều lần đổi trạng thái theo luỹ kế đã giao và ngoại lệ còn mở: thiếu là 一部引渡 (giao một phần), đủ là 完了 (xong), vượt có lý do là 例外あり (có ngoại lệ) tới khi 照合事務 (nhóm đối soát) đóng ngoại lệ, vượt không lý do bị chặn. Khớp nghĩa là dung sai 0, giả định nhà thầu chờ khách ở Q-SD1 (P-13).

    Ràng buộc đặc thù: Ngoại lệ chỉ đóng khi 照合事務 bấm đóng kèm lý do; người đóng và giờ đóng do máy chủ gán, máy không tự khớp.'
  pham_vi: SC-060 (ghi lần giao), SC-063 (ngoại lệ, đóng ngoại lệ); bảng `deliveries`, `delivery_exceptions`, `transactions` (trạng thái giao nhận), `audit_log`; quy tắc A8.
  luong_chinh:
  - 'Chuẩn bị: QA tạo các giao dịch 相対取引 (giao dịch thỏa thuận) 100 kg chưa giao lần nào (待機中, chờ giao), mỗi ca một giao dịch.'
  - 'Ca 1: 配送部門 (bộ phận giao hàng) ghi lần giao 60 kg rồi 40 kg ở SC-060, sau đó ghi trả lại 10 kg; 照合事務 đóng ngoại lệ 返却 (trả lại).'
  - 'Ca 2: ghi một lần giao 105 kg kèm lý do; 照合事務 đóng ngoại lệ ở SC-063 kèm lý do.'
  - 'Ca 3: ghi một lần giao 105 kg không lý do.'
  - QA đọc trạng thái, luỹ kế sau từng bước cùng các dòng delivery_exceptions, audit_log; khách và BrSE ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi giao 60 rồi 40 kg thì trạng thái là 一部引渡 (luỹ kế 60, còn 40) rồi 完了; trả lại 10 kg thì luỹ kế 90, 例外あり tới khi đóng ngoại lệ 返却, đóng xong là 一部引渡.
  - Khi giao 105 kg có lý do thì trạng thái 例外あり, không 完了; có dòng ngoại lệ 引渡超過 (giao vượt) ở trạng thái 未処理 (chưa xử lý), người xác nhận và giờ JST do máy chủ gán.
  - Khi 照合事務 đóng ngoại lệ đó thì trạng thái 完了, người đóng và giờ đóng do máy chủ gán, audit_log ghi lý do, trước và sau; số tính 精算 (quyết toán) là 100 kg (giả định nhà thầu, Q-SD1).
  - Khi giao 105 kg không lý do thì máy chủ trả 422, không ghi dòng nào.
  - Khách nghiệm thu qua BrSE; bằng chứng gồm các dòng deliveries, delivery_exceptions, trạng thái sau từng bước và dòng audit_log, ghi vào story kèm ngày chạy.
  dinh_nghia_xong:
  - Biên bản nghiệm thu có tên người nghiệm thu phía khách và ngày ký.
