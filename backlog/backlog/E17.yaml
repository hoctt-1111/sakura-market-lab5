  - 'Chuẩn bị: QA tạo trong 業務日 2026/10/16 ba giao dịch 相対取引 (giao dịch thỏa thuận): X chưa giao lần nào, Y đã giao 60 trên 100 kg, Z đã 完了 (xong).'
  - 'Thực hiện: 照合事務 mở SC-071 để khoá 業務日 2026/10/16.'
  - 'Kiểm 1: 未処理一覧 liệt kê X và Y, không có Z.'
  - 'Kiểm 2: bấm một dòng thì SC-031 mở đã lọc sẵn 業務日 và ba trạng thái 待機中, 一部引渡, 例外あり.'
  - 照合事務 khoá ngày; QA kiểm dòng khoá và phần đã giao của Y trong 精算 của ngày; khách và BrSE ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi mở SC-071 cho 業務日 có X, Y, Z thì 未処理一覧 có X và Y, không có Z.
  - Khi giao dịch chưa có dòng deliveries nào thì vẫn hiện, vì nguồn là trạng thái giao nhận thuộc 待機中, 一部引渡 (giao một phần) hoặc 例外あり (có ngoại lệ).
  - Khi bấm một dòng thì SC-031 mở đã lọc 業務日 và ba trạng thái trên.
  - Khi 照合事務 khoá ngày thì khoá được ghi và phần đã giao của Y vào 精算 của ngày đó (giả định nhà thầu).
  - Khách nghiệm thu qua BrSE; bằng chứng gồm ảnh 未処理一覧, trạng thái giao nhận của ba giao dịch và dòng khoá ngày, ghi vào story kèm ngày chạy.
  dinh_nghia_xong:
  - Biên bản nghiệm thu có tên người nghiệm thu phía khách và ngày ký.
