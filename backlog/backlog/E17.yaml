  mo_ta: 'Kịch bản AC6 chứng minh 業務日 (ngày nghiệp vụ) đã khoá thì không sửa thẳng được: sai sót chỉ sửa qua yêu cầu điều chỉnh có duyệt, sinh dòng đảo hoặc dòng chênh lệch, dòng gốc giữ nguyên. Kịch bản đi xuyên FG-08 khoá ngày và FG-06 sửa bằng 赤伝 (bút toán đảo).

    Ràng buộc đặc thù: Khoá ngày và duyệt điều chỉnh là hai bước người quyết; ca kiểm ghi ai khoá, ai duyệt và lúc nào.'
  pham_vi: SC-071 (khoá ngày), API-223 (huỷ, bị chặn sau khoá), SC-050 và SC-052 (lập và duyệt điều chỉnh); bảng `business_day_locks`, `transactions`, `adjustment_requests`, `adjustment_entries`; quy tắc A7, A10.
  luong_chinh:
  - 'Chuẩn bị: QA tạo giao dịch trong một 業務日, rồi người đối soát khoá ngày đó ở SC-071.'
  - 'Thực hiện 1: người dùng thử sửa thẳng: huỷ giao dịch qua API-223 và ghi một lần giao hàng mới vào ngày đó.'
  - 'Kiểm 1: cả hai bị chặn bằng mã ngày đã khoá (P-24) và có dòng audit_log.'
  - 'Thực hiện 2: người dùng lập yêu cầu điều chỉnh ở SC-050, một người khác duyệt ở SC-052.'
  - 'Kiểm 2: có dòng đảo hoặc dòng chênh lệch, dòng gốc không đổi, số đọc qua khung nhìn đã tính điều chỉnh.'
  - Khách và BrSE xem kết quả, ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi ghi thẳng vào ngày đã khoá thì bị chặn bằng mã ngày đã khoá, có dòng audit_log và dữ liệu không đổi.
  - Khi yêu cầu điều chỉnh được duyệt thì có dòng adjustment_entries loại reverse hoặc delta, dòng gốc giữ nguyên giá trị.
  - Khi người lập yêu cầu tự duyệt thì bị từ chối; người đề nghị và người duyệt là hai tài khoản khác nhau (P-16).
  - Khách nghiệm thu qua BrSE; bằng chứng gồm dòng khoá ngày, hai lần bị chặn, dòng gốc trước và sau, dòng điều chỉnh, ghi vào story kèm ngày chạy.
  dinh_nghia_xong:
  - Nơi giữ dòng đảo (G-FG06-04) và cách bảng khoá ngày phân biệt khoá với mở lại (G-FG08-09) đã chốt trước khi chạy.
