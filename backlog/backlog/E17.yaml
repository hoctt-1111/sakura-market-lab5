  mo_ta: 'Kịch bản AC7 chứng minh lỗi gửi thông báo không bị nuốt: khi kênh email hỏng, hệ thống gửi đúng số lần cho phép, ghi trạng thái cuối thất bại vào nhật ký gửi, và sự kiện mức Critical quá 5 phút thì người vận hành thấy cảnh báo. Thông báo trong ứng dụng vẫn hiện dù email lỗi, và nghiệp vụ sinh ra sự kiện không dừng lại.'
  pham_vi: Module notify (FG-12) theo sự kiện EV2; SC-121 (nhật ký gửi), SC-122 (hàng đợi cảnh báo), SC-150 (bảng giám sát); bảng `notification_log`, `alert_queue`.
  luong_chinh:
  - 'Chuẩn bị: Infra làm hỏng kênh email trên staging; QA tạo một bên tham gia có tư cách sắp hết hạn và một sự kiện mà INV-FG12-MUC-KHAN xếp mức Critical (G-FG12-01).'
  - 'Thực hiện: hệ thống gửi lần đầu rồi thử lại theo khoảng cách cấu hình (chưa có số); lần đầu và cả ba lần thử lại đều thất bại.'
  - 'Kiểm 1: notification_log có trạng thái cuối thất bại, số lần thử lại bằng 3; thông báo trong ứng dụng vẫn hiện.'
  - 'Kiểm 2: sau 5 phút, sự kiện Critical có một dòng alert_queue hiện ở SC-122 và được đếm ở SC-150.'
  - Khách và BrSE xem kết quả, ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi lần gửi đầu và cả ba lần thử lại đều thất bại thì notification_log có một dòng trạng thái cuối thất bại, số lần thử bằng 3, không có lần gửi thứ năm.
  - Khi sự kiện mức Critical chưa gửi được sau 5 phút thì có cảnh báo ở hàng đợi cảnh báo vận hành, không mất im lặng.
  - Khi email lỗi thì thông báo trong ứng dụng vẫn hiện và nghiệp vụ sinh sự kiện vẫn hoàn tất.
  - Khách nghiệm thu qua BrSE; bằng chứng gồm các dòng notification_log, dòng cảnh báo, giờ sự kiện và giờ cảnh báo, ghi vào story kèm ngày chạy.
  dinh_nghia_xong:
  - Tech Lead chốt cách đếm lần thử (G-FG12-02) và nơi hiện cảnh báo, kịch bản AC7 sửa theo đó (G-E17-04).
