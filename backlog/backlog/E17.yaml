  - Khi trả lại 10 kg thì luỹ kế 90, trạng thái 例外あり (có ngoại lệ) tới khi đóng ngoại lệ 返却, đóng xong là 一部引渡.
  - Khi 照合事務 đóng ngoại lệ 返却 thì người đóng và giờ đóng do máy chủ gán, audit_log ghi lý do, trước và sau.
