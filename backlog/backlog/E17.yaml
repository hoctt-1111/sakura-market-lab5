  mo_ta: 'Kịch bản AC5 chứng minh 完納奨励金 (thưởng thanh toán đủ hạn) chỉ thành tiền khi có người 確定 (xác nhận cuối): máy 判定 (xét) và tính số tiền, nhưng không đường nào tự chuyển khoản thưởng sang đã xác nhận. Số tiền nhân hệ số thuế 110/100 trước rồi mới cắt lẻ về yên.

    Ràng buộc đặc thù: Khoản thưởng chỉ thành tiền khi một người 確定, nên ca kiểm phải chứng minh không đường máy nào tự xác nhận.'
  pham_vi: SC-080, SC-081; API-215 (判定), API-216 (確定); TECH-304; bảng `incentives` (cột người và thời điểm xác nhận), `audit_log`; quy tắc A6, A9.
  luong_chinh:
  - 'Chuẩn bị: QA tạo một hoá đơn trả đủ trong hạn và một bản suất đang hiệu lực, rồi chạy 判定 để có khoản thưởng chưa xác nhận.'
  - 'Thực hiện 1: QA thử mọi đường không có thao tác người: chạy lại 判定, gọi các API khác, chờ tác vụ nền.'
  - 'Kiểm 1: khoản thưởng vẫn chưa xác nhận, cột người xác nhận còn rỗng.'
  - 'Thực hiện 2: một người của 照合事務 (nhóm đối soát) bấm 確定 ở SC-080.'
  - 'Kiểm 2: có người của phiên, giờ máy chủ và dòng audit_log; số tiền khớp số tính tay theo công thức.'
  - Khách và BrSE đối chiếu số tiền với cách tính của chợ, ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi chưa có thao tác 確定 thì không đường gọi nào làm khoản thưởng sang đã xác nhận.
  - Khi người dùng 確定 thì hệ thống ghi người của phiên, giờ máy chủ và một dòng audit_log; người và giờ gửi từ trình duyệt bị bỏ qua.
  - Khi tính số tiền thì nhân hệ số thuế 110/100 trước, cắt lẻ về yên sau; hoá đơn trả quá hạn có thưởng bằng 0.
  - Khách nghiệm thu qua BrSE; bằng chứng gồm số tính tay, số của hệ thống, người và giờ 確定, dòng audit_log, ghi vào story kèm ngày chạy.
  dinh_nghia_xong:
  - Cách ghi bước 確定 trên bảng chỉ-thêm đã chốt ở SC-080/DB trước khi chạy (G-FG09-01).
