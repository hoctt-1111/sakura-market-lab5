- key: QA-00
  cha: E17
  tracker: story
  title_vi: Khung kiểm thử tích hợp và E2E
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
  labels:
  - type:story
  owner: QA
  priority: 3
  premise_refs:
  - P-54
  gap_refs: []
  mo_ta: 'QA dựng khung kiểm thử tích hợp và đầu cuối cho kho mã hệ đích: cách chạy ca tích hợp (API cùng CSDL thật) trong CI, cách chạy ca đầu cuối qua trình duyệt trên môi trường thử, bộ dữ liệu kiểm thử nạp lại được, và báo cáo kết quả gắn vào issue. Mười hai kịch bản AC1 tới AC12 của E17 và lá TEST của mọi story chạy trên khung này, nên QA-00 xong trước ca tích hợp đầu tiên. Là phần nền của EF-13 (QA, 70 man-day) và EF-14 (QA, 65 man-day) LAB-1, thành issue theo review PM 21/10.'
  pham_vi: 'Kho mã hệ đích và CI của PLT-01; môi trường thử của PLT-02 với dữ liệu đã che (G-E15-03); bộ dữ liệu kiểm thử nền gồm bốn loại người tham gia của chợ, vài lô, một bản quy tắc có hiệu lực; mẫu ca tích hợp và mẫu ca đầu cuối; báo cáo kết quả theo mẫu định nghĩa xong TEST (môi trường, ngày chạy). Không gồm ca kiểm của story nào và không gồm đo NFR (E18). Nguồn: EF-13, EF-14 (effort-other.yaml:100, 107 của LAB-1); P-54.'
  luong_chinh:
  - QA cùng Tech Lead chọn cách chạy ca tích hợp với CSDL thật trong CI và công cụ chạy ca đầu cuối qua trình duyệt, kể cả cỡ màn tablet; ghi vào README kho mã.
  - QA viết bộ dữ liệu kiểm thử nền nạp từ CSDL trống, chạy lại cho cùng kết quả, không chứa bản ghi thật.
  - QA làm một ca tích hợp mẫu (gọi API, kiểm bảng) và một ca đầu cuối mẫu (đăng nhập, thao tác, kiểm CSDL), máy chạy đặt UTC+7 nhưng mọi so sánh ngày giờ theo JST.
  - 'Infra nối vào CI của PLT-01: ca tích hợp chạy ở mỗi yêu cầu gộp mã; ca đầu cuối chạy theo lịch trên môi trường thử và trước mỗi lần bàn giao sprint.'
  - QA làm báo cáo kết quả tự sinh (bản dựng, môi trường, ngày, số ca đạt và trượt) đính được vào issue.
  tieu_chi_nghiem_thu:
  - Khi một yêu cầu gộp mã làm đỏ một ca tích hợp thì CI đỏ và nhánh chính không nhận gộp.
  - Khi nạp bộ dữ liệu nền hai lần từ CSDL trống thì hai lần cho cùng số dòng và cùng giá trị.
  - Khi ca đầu cuối chạy trên máy đặt UTC+7 thì ngày giờ kiểm theo JST và ca mẫu xanh trên cỡ màn văn phòng lẫn tablet.
  - Khi một lượt chạy xong thì báo cáo có bản dựng, môi trường, ngày chạy, số ca đạt và trượt, và đính được vào story.
  dinh_nghia_xong:
  - README kho mã có cách viết và chạy ca tích hợp, ca đầu cuối; lá TEST của story khác trỏ về đây.
