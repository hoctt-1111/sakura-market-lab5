- key: REG-01-2
  cha: E17
  tracker: story
  title_vi: Chạy hồi quy trước phát hành, xử ca trượt (2/2)
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
  labels:
  - type:story
  owner: QA
  priority: 3
  premise_refs:
  - P-54
  gap_refs: []
  mo_ta: 'Phần 2/2 của bộ hồi quy REG-01, dùng bộ REG-01-1 đã gom: trước mỗi phát hành lớn (đưa bản lên môi trường thử cho khách nghiệm thu, diễn tập REL-03, phát hành production REL-01) QA chạy bộ trên đúng bản dựng sẽ phát hành; có ca trượt thì PM quyết dừng hay chấp nhận kèm lý do. Kết quả bộ là điều kiện đi tiếp của phát hành; phần này mang tiêu chí tổng của REG-01.'
  pham_vi: 'Lần chạy trước mỗi phát hành lớn trên môi trường thử với bản dựng sẽ phát hành; đường báo PM và quyết định khi trượt; báo cáo đính vào issue phát hành. Bảng phủ và lệnh gộp thuộc REG-01-1. Nguồn: EF-14 của LAB-1; P-54.'
  luong_chinh:
  - Trước mỗi phát hành lớn, QA chạy bộ trên đúng bản dựng sẽ phát hành, trên môi trường thử.
  - QA đính báo cáo (số ca theo nhóm, đạt và trượt, bản dựng, ngày chạy) vào issue phát hành tương ứng.
  - Có ca trượt thì QA báo PM; PM quyết dừng phát hành tới khi sửa, hoặc ghi quyết định chấp nhận kèm lý do vào issue phát hành.
  - Sau mỗi lần phát hành lớn, QA cập nhật bảng phủ của REG-01-1 theo ca đã thêm hay đổi.
  tieu_chi_nghiem_thu:
  - Khi bộ hồi quy có ca trượt thì phát hành dừng, hoặc issue phát hành có quyết định chấp nhận của PM kèm lý do và ngày.
  - Khi chạy trước REL-01 thì bản chạy đúng là bản dựng sẽ phát hành và báo cáo kết quả đính vào REL-01.
  - Khi chạy trước lần đưa bản cho khách nghiệm thu hay trước REL-03 thì issue phát hành đó có báo cáo cùng khuôn.
  dinh_nghia_xong:
  - Bảng phủ 14 nhóm chức năng cập nhật ở mỗi lần phát hành lớn.
