  luong_chinh:
  - 'Chuẩn bị: QA tạo một phiên せり của 業務日 (ngày nghiệp vụ), một lô chờ せり và hai tài khoản cùng vai せり進行役 do SC-003/DB nạp.'
  - 'Thực hiện: せり進行役 chọn kết quả 落札 (trúng giá), người trúng, đơn giá ở SC-040 rồi bấm 登録 (đăng ký).'
  - 'Kiểm: auction_results có người tạo là người đang đăng nhập, thời điểm tạo là lúc bấm theo JST; màn không có ô nhập người tạo hay thời điểm.'
  - QA ghi phiên, lô và dòng auction_results vào issue để AC-11-2 gọi API-212 trên cùng phiên.
  tieu_chi_nghiem_thu:
  - Khi bấm 登録 thì auction_results ghi người tạo là người của phiên và thời điểm bấm theo JST, cả hai do máy chủ gán.
