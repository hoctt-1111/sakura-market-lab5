  mo_ta: 'Kịch bản AC4 chứng minh hai luật của bản 業務規程 (quy chế nghiệp vụ): người lập không tự duyệt bản của mình, và mỗi khoá quy tắc không đổi quá 4 lần trong một năm dương lịch. Cả hai được kiểm ở máy chủ tại bước duyệt theo TECH-303 của FG-10, vì mã vượt trần chỉ trả ở bước duyệt chứ không ở bước lập (G-E17-03).'
