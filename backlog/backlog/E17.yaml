  premise_refs:
  - P-18
  gap_refs:
  - G-E17-02
  - G-FG05-07
  mo_ta: 'Kịch bản AC3 chứng minh lô せり (đấu giá) ế không bị đấu lại quá trần và không kẹt ở せり: vượt trần 再せり (đấu lại) thì bị từ chối, lô chỉ đi tiếp qua 相対取引 (giao dịch thỏa thuận) hoặc 直販 (bán trực tiếp). Kịch bản kiểm theo thiết kế TECH-302 của FG-05, vì chữ của AC3 lệch với quy tắc A4 và mã M_23 về số lần được đấu lại (G-E17-02).'
  pham_vi: SC-040, API-212, TECH-302; bảng `auction_results` (cột lần thử), `lots` (trạng thái); quy tắc A4; đường đi tiếp qua SC-030 hoặc API-209, mặc định tắt (P-18).
  luong_chinh:
  - 'Chuẩn bị: QA tạo một lô đã qua lần thử 1 và một lần 再せり (lần thử 2), cả hai lần đều ế.'
  - 'Thực hiện: người điều hành phiên chọn 再せり thêm một lần ở SC-040.'
  - 'Kiểm: API-212 trả 409 M_23 và không thêm dòng auction_results.'
  - Người điều hành chọn chuyển lô sang 相対; lô sang trạng thái chờ 相対 và chọn được ở SC-030.
  - Khách và BrSE xem kết quả, ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi lô đã có lần thử 2 mà chọn 再せり nữa thì trả 409 M_23 và số dòng auction_results không đổi.
  - Khi lô mới qua lần thử 1 và ế thì lần 再せり đầu vẫn được phép; chặn ở lần này là lỗi.
  - Khi lô ế được chuyển 相対 thì lô hiện ở SC-030; khi quy tắc bán cho bên thứ ba đang tắt thì API-209 từ chối lô đó (P-18).
  - Khách nghiệm thu qua BrSE; bằng chứng gồm các dòng auction_results của lô, mã lỗi, trạng thái lô trước và sau, ghi vào story kèm ngày chạy.
  dinh_nghia_xong:
  - Kịch bản AC3 trong spec hệ thống được sửa cho khớp TECH-302, hoặc khách xác nhận cách đọc (G-E17-02).
