  owner: PM
  priority: 2
  premise_refs:
  - P-12
  gap_refs:
  - G-E17-01
  - G-FG04-02
  mo_ta: 'Kịch bản AC2 chứng minh hạn giấy được so với ngày chốt chứ không đọc cờ trạng thái: bên mua có giấy đã quá hạn mà trạng thái vẫn active thì vẫn bị từ chối. Hạn lấy đúng cột của tầng giấy: 仲卸 (trung gian bán buôn) theo hạn 許可 (giấy phép), 売買参加者 (người tham gia mua bán) theo hạn 承認 (chấp thuận), nên 失効 (mất hiệu lực) không lọt qua chỉ vì tác vụ đổi trạng thái chưa chạy.'
  pham_vi: SC-030, API-208, TECH-301; bảng `participants` với hai bộ cột hạn của thiết kế đích; quy tắc A2, A3; đường phục hồi qua SC-013.
  luong_chinh:
  - 'Chuẩn bị: QA tạo hai bên mua đang active, một 仲卸 có hạn 許可 đã qua và một 売買参加者 có hạn 承認 đã qua so với 業務日 (ngày nghiệp vụ) của lần chạy.'
  - 'Thực hiện: người vận hành chốt một giao dịch 相対取引 (giao dịch thỏa thuận) với từng bên mua ở SC-030.'
  - 'Kiểm: API-208 trả 422 M_21 cho cả hai, không có dòng transactions nào.'
  - QA dời hạn của một bên sang sau 業務日 rồi chốt lại, để thấy lần từ chối trước là do hạn.
  - Khách và BrSE xem kết quả, ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi hạn của đúng tầng giấy đã qua tại 業務日 thì trả 422 M_21, bất kể cờ active.
  - Khi dữ liệu của bên mua điền cả hai bộ cột 許可 và 承認 thì CSDL từ chối ghi, vì mỗi tầng chỉ có một bộ cột (A2).
  - Khi so hạn thì mốc là 業務日 theo giờ Nhật, không phải ngày theo giờ UTC của máy chủ (G-FG04-02).
  - Khách nghiệm thu qua BrSE; bằng chứng gồm hạn giấy của hai bên mua, mã lỗi trả về và số dòng giao dịch, ghi vào story kèm ngày chạy.
  - Khi máy chạy kiểm thử đặt múi giờ UTC+7 và nhập lúc 02:31 JST thì 業務日 ghi đúng ngày JST và màn hiển thị giờ JST.
  dinh_nghia_xong:
  - Biên bản nghiệm thu có tên người nghiệm thu phía khách và ngày ký.
