  - Khi bấm một dòng thì SC-031 mở đã lọc 業務日 và ba trạng thái trên.
  - Khi 照合事務 khoá ngày thì khoá được ghi và phần đã giao của Y vào 精算 của ngày đó (giả định nhà thầu).
  - Khách nghiệm thu qua BrSE; bằng chứng gồm ảnh 未処理一覧, trạng thái giao nhận của ba giao dịch và dòng khoá ngày, ghi vào story kèm ngày chạy.
  dinh_nghia_xong:
