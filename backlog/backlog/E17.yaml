- key: AC-1
  cha: E17
  tracker: story
  title_vi: Bên mua không có quyền 相対 bị chặn, có dòng audit denied
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
    ac:
    - AC1
    sd:
    - A1
  labels:
  - type:story
  - constraint:two-tier
  - spec-gap
  owner: PM
  priority: 2
  premise_refs:
  - P-12
  gap_refs:
  - G-E17-01
  mo_ta: Kịch bản AC1 chứng minh lúc chốt 相対取引 (giao dịch thỏa thuận), máy chủ kiểm tư cách của bên mua chứ không tin giao diện. Bên mua chưa có 許可 (giấy phép) hay 承認 (chấp thuận) hợp lệ thì lần chốt bị từ chối, không có dòng giao dịch nào, và vết kiểm toán có một dòng bị từ chối. Kịch bản đi xuyên SC-030, API-208 và TECH-301 của FG-04.
  pham_vi: Màn SC-030, API-208, luồng TECH-301; bảng `participants` (đọc), `transactions` (không được thêm dòng), `audit_log` (một dòng kết quả denied); quy tắc A1 của thiết kế hệ thống.
  luong_chinh:
  - 'Chuẩn bị: QA tạo trên môi trường thử một bên mua không có giấy hợp lệ cho 相対, một lô còn hàng và một tài khoản của 取引運用 (nhóm vận hành giao dịch).'
  - 'Thực hiện: người vận hành nhập giao dịch 相対 cho bên mua đó ở SC-030 rồi bấm chốt.'
  - 'Kiểm: API-208 trả 403 M_01 và màn hiện lý do ở SC-033.'
  - QA đếm dòng transactions của lô và tìm dòng audit_log của lần chốt bị từ chối.
  - Khách xem lại kết quả cùng BrSE và ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi bên mua không có giấy hợp lệ thì API-208 trả 403 M_01 và số dòng transactions của lô không đổi.
  - Khi lần chốt bị từ chối thì audit_log có đúng một dòng kết quả denied, ghi người bấm của phiên, vai và giờ máy chủ.
  - Khi gọi thẳng API-208 không qua màn thì kết quả vẫn như trên.
  - Khách nghiệm thu qua BrSE; bằng chứng gồm ảnh màn lý do, dòng audit_log, số dòng giao dịch trước và sau, ghi vào story kèm ngày chạy.
  dinh_nghia_xong:
  - Biên bản nghiệm thu có tên người nghiệm thu phía khách và ngày ký.
