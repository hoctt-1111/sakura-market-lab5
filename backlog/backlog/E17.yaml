  mo_ta: 'Kịch bản AC9 chứng minh giờ và 業務日 (ngày nghiệp vụ) luôn theo giờ Nhật, không theo giờ máy người dùng hay máy chủ: máy người dùng đặt UTC+7, máy chủ chạy UTC. Ranh 業務日 là 02:00 JST, nên thao tác lúc 01:59 JST vẫn thuộc ngày trước. Ranh 02:00 là giả định nhà thầu; RFP chỉ cho 業務日 bắt đầu trong khung 02:00–02:30 JST.'
  pham_vi: SC-030, API-208 (ghi giao dịch 相対取引 (giao dịch thỏa thuận)); hàm tính 業務日 dùng chung; bảng `transactions` (業務日 và giờ ghi), `audit_log`; quy tắc A7.
  luong_chinh:
  - 'Chuẩn bị: QA đặt máy người dùng ở UTC+7, máy chủ của môi trường thử chạy UTC, tạo một lô còn hàng cho 相対.'
  - 'Thực hiện 1: 取引運用 (nhóm vận hành giao dịch) ghi một giao dịch 相対 lúc 2026/10/16 02:31 JST; máy người dùng hiện 00:31.'
  - 'Kiểm 1: 業務日 là 2026/10/16, màn hiện 2026/10/16 02:31, nhật ký ghi giờ JST.'
  - 'Thực hiện 2: ghi một giao dịch khác lúc 2026/10/16 01:59 JST; kiểm 業務日 là 2026/10/15.'
  - Khách và BrSE xem kết quả, ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi ghi lúc 2026/10/16 02:31 JST thì 業務日 là 2026/10/16 và màn hiện 2026/10/16 02:31, dù máy người dùng hiện 00:31 và máy chủ là 2026-10-15 17:31 UTC.
  - Khi ghi lúc 2026/10/16 01:59 JST (máy chủ 2026-10-15 16:59 UTC) thì 業務日 là 2026/10/15.
  - Khi đọc nhật ký kiểm toán của hai lần ghi thì giờ hiện theo JST.
  - Khách nghiệm thu qua BrSE; bằng chứng gồm giờ ở máy người dùng, máy chủ và màn, 業務日 của hai giao dịch, ghi vào story kèm ngày chạy.
  - Khi máy chạy kiểm thử đặt múi giờ UTC+7 và nhập lúc 02:31 JST thì 業務日 ghi đúng ngày JST và màn hiển thị giờ JST.
  dinh_nghia_xong:
  - Biên bản nghiệm thu có tên người nghiệm thu phía khách và ngày ký.
  - Khách đáp ranh 業務日 khác 02:00 JST thì ca biên được sửa trước khi chạy.
