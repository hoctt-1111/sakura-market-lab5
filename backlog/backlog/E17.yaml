  - 'Chuẩn bị: QA tạo một khoá quy tắc đã có 4 lần duyệt trong năm dương lịch đang chạy, cùng hai tài khoản người lập và người duyệt khác nhau.'
  - 'Thực hiện 1: người lập tạo bản mới ở SC-091 rồi tự bấm duyệt ở SC-092.'
  - 'Kiểm 1: API-218 trả 422 M_26, bản vẫn ở trạng thái nháp.'
  - 'Thực hiện 2: người duyệt khác bấm duyệt bản đó, tức lần đổi thứ năm trong năm.'
