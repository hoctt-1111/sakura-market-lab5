  mo_ta: 'Phần 1/2 của kịch bản AC2: dựng hai bên mua đang active mà hạn giấy đã qua, mỗi bên một tầng, rồi chạy ca chốt bị chặn. Hạn so với 業務日 (ngày nghiệp vụ) và lấy đúng cột của tầng giấy: 仲卸 (trung gian bán buôn) theo hạn 許可 (giấy phép), 売買参加者 (người tham gia mua bán) theo hạn 承認 (chấp thuận). Ca phục hồi hạn, ca qua nửa đêm giờ Nhật và nghiệm thu nằm ở AC-2-2.

    Ràng buộc đặc thù: Mỗi tầng giấy có bộ cột hạn riêng; máy chủ so hạn với 業務日 chứ không đọc cờ trạng thái.'
  pham_vi: SC-030, API-208, TECH-301; bảng `participants` với hai bộ cột hạn của thiết kế đích; quy tắc A2, A3. Không gồm đường phục hồi qua SC-013 và ca giờ Nhật (AC-2-2).
  luong_chinh:
  - 'Chuẩn bị: QA tạo hai bên mua đang active, một 仲卸 có hạn 許可 đã qua và một 売買参加者 có hạn 承認 đã qua so với 業務日 của lần chạy.'
  - 'Thực hiện: người vận hành chốt một giao dịch 相対取引 (giao dịch thỏa thuận) với từng bên mua ở SC-030.'
  - 'Kiểm: API-208 trả 422 M_21 cho cả hai, không có dòng transactions nào.'
  - QA thử ghi một bên mua điền cả hai bộ cột hạn để thấy CSDL từ chối, rồi ghi dữ liệu đã dựng vào issue cho AC-2-2.
  tieu_chi_nghiem_thu:
  - Khi hạn của đúng tầng giấy đã qua tại 業務日 thì trả 422 M_21, bất kể cờ active.
  - Khi dữ liệu của bên mua điền cả hai bộ cột 許可 và 承認 thì CSDL từ chối ghi, vì mỗi tầng chỉ có một bộ cột (A2).
  - Khi phần này đóng thì issue có hạn giấy của hai bên mua và mã lỗi trả về để AC-2-2 dùng lại.
  - Khi máy chạy kiểm thử đặt múi giờ UTC+7 và nhập lúc 02:31 JST thì 業務日 ghi đúng ngày JST và màn hiển thị giờ JST.
  dinh_nghia_xong:
