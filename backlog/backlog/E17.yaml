  - 照合事務 khoá ngày; QA kiểm dòng khoá và phần đã giao của Y trong 精算 của ngày; khách và BrSE ký nghiệm thu.
  tieu_chi_nghiem_thu:
  - Khi mở SC-071 cho 業務日 có X, Y, Z thì 未処理一覧 có X và Y, không có Z.
