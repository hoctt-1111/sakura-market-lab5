  mo_ta: 'Kịch bản AC11 chứng minh kết quả せり (đấu giá) do người nhập: せり進行役 (người điều hành phiên) nhập kết quả 手やり (ra giá bằng tay) hoặc 符丁 (mật mã giá) của một lô ở SC-040, còn người ghi và thời điểm ghi do máy chủ gán từ phiên. Không API nào nhận kết quả せり từ máy hay từ ảnh (CAP-HUMAN-01).

