  premise_refs:
  - P-15
  gap_refs:
  - G-FG01-01
  - G-FG01-10
  mo_ta: 'Story này kiểm bảo mật ở mức toàn hệ thống: tài khoản quản trị và vai duyệt phải qua MFA, người tham gia không bị đòi MFA vì họ không dùng màn hình ở phạm vi nền, phiên có thời hạn và khoá tạm sau nhiều lần sai, TLS trên mọi đường truyền và bí mật tách khỏi mã nguồn. Ngưỡng phiên và khoá tạm chưa có số nên đọc từ cấu hình (P-15).'
  pham_vi: NFR-SEC-01, SEC-IAM-02, NFR-SEC-03, NFR-SEC-04 (N6–N9); Cognito user pool, SC-001 đăng nhập và SC-006 thiết lập MFA của FG-01; ngưỡng phiên chờ INV-Q-SD3; quét bảo mật tự động trong CI.
  luong_chinh:
  - BE bật MFA bắt buộc cho vai 市場管理者 (quản lý chợ) và 承認者 (người duyệt); vai hiện trường không bị đòi MFA (ADR-011).
  - BE đọc thời hạn phiên, số lần sai và thời gian khoá từ cấu hình, ghi nhật ký khi khoá tạm.
  - Infra bật TLS ở mọi điểm vào và giữa các thành phần, giữ bí mật trong Secrets Manager.
  - QA chạy ca đăng nhập không MFA, nhập sai liên tiếp và quét bí mật; Tech Lead rà chỗ lưu bí mật trước mỗi lần phát hành.
  tieu_chi_nghiem_thu:
  - Khi tài khoản 市場管理者 hoặc 承認者 đăng nhập không có mã MFA thì bị chặn.
  - Khi nhập sai quá số lần cấu hình thì tài khoản bị khoá tạm trong thời gian cấu hình và có dòng nhật ký; hai giá trị chưa có số (P-15).
  - Khi gọi một điểm vào bằng kết nối không mã hoá thì không có dữ liệu nghiệp vụ nào trả về.
  - Khi quét repo và bản dựng thì không có bí mật, khoá hay chuỗi kết nối.
  - Khi tìm tài khoản đăng nhập của 仲卸 (trung gian bán buôn) hay 売買参加者 (người tham gia mua bán) thì không có, vì người tham gia chỉ là dữ liệu (SEC-IAM-02).
  dinh_nghia_xong:
  - Kết quả quét bảo mật và rà bí mật của lần phát hành đầu ghi vào story.
