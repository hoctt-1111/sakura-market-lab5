  - G-E18-02
  mo_ta: 'Story này gom ba yêu cầu khả dụng: đạt 99,5% mỗi tháng tính trong cửa sổ dịch vụ 02:00–10:00 giờ Nhật, làm tiếp được khi mất kết nối ngắn ở hiện trường, và khôi phục sau sự cố trong RTO 4 giờ, RPO 15 phút. Theo ADR-010, chỉ ba thao tác nhập ở hiện trường được lưu cục bộ rồi đồng bộ; chốt giao dịch và khoá ngày luôn cần mạng.'
  pham_vi:
  - NFR-AVL-01, NFR-AVL-02, NFR-AVL-03 (N1–N3); sao lưu hằng ngày và bản dự phòng đồng bộ cùng vùng của PLT-02; đồng hồ đo gọi API-220.
  - 'Ba thao tác lưu cục bộ theo AD-04 của LAB-01: nhập lô ở SC-020, ghi 目利き (thẩm định bằng mắt) ở SC-023, ghi lần giao ở SC-060 (G-FG14-07); điều giải xung đột ở SC-151.'
  luong_chinh:
  - Infra cấu hình đồng hồ đo chỉ tính trong cửa sổ dịch vụ; bảo trì đặt ngoài cửa sổ.
  - Infra bật sao lưu hằng ngày, nhật ký liên tục và bản dự phòng đồng bộ.
  - QA ngắt kết nối thiết bị hiện trường trên staging, làm ba thao tác ghi tạm rồi thử chốt giao dịch và khoá ngày.
  - Infra diễn tập khôi phục trên staging, đo thời gian và lượng dữ liệu mất; PM ghi số đo vào story.
  tieu_chi_nghiem_thu:
  - Khi tính khả dụng thì chỉ các phút trong cửa sổ dịch vụ được tính, bảo trì ngoài cửa sổ không bị trừ.
  - Khi mất kết nối thì ba thao tác nhập được lưu tạm và đồng bộ lại khi có mạng; chốt 相対取引 (giao dịch thỏa thuận) và khoá ngày bị chặn, màn báo rõ đang mất kết nối.
  - Khi đồng bộ gặp xung đột thì dòng đó chờ người xử ở SC-151, không tự trộn.
  - Khi diễn tập khôi phục thì thời gian không quá 4 giờ, dữ liệu mất không quá 15 phút, và số đo thật ghi vào story.
  dinh_nghia_xong:
  - Danh sách ba thao tác nằm ở ràng buộc của bảng sync_queue và ở PREMISE, không chỉ trong mã (G-FG14-07); tiêu chí lưu tạm đã có ở FE của ba màn (G-E18-01).
