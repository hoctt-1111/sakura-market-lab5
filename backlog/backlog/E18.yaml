  - G-E18-03
  mo_ta: 'Story này đo hai yêu cầu hiệu năng: thao tác tra cứu thông thường có p95 không quá 2 giây ở tải thiết kế, và hệ thống chịu được hồ sơ tải FIG-LOAD-01 (350 lô và 700 giao dịch ngày thường, 600 lô và 1.200 giao dịch ngày cao điểm) mà tác vụ lõi không chậm đi. Khung nhìn của bảng chỉ-thêm (ADR-003) và nền tảng đã chọn (ADR-008) chưa từng được đo tải.'
  pham_vi:
  - NFR-PERF-01 (N4), NFR-PERF-02 (N5); hồ sơ tải 180 tài khoản, 60 người đồng thời.
  - Danh sách thao tác tra cứu và tác vụ lõi cần đo do Tech Lead duyệt (G-E18-03); đề xuất tác vụ lõi là nhập lô, chốt giao dịch và ghi giao hàng.
  - Staging của PLT-02; công cụ tạo tải k6 hoặc tương đương.
  luong_chinh:
  - Tech Lead chốt danh sách thao tác tra cứu và tác vụ lõi cần đo.
  - QA dựng kịch bản tải theo FIG-LOAD-01 cho mức ngày thường và mức cao điểm.
  - QA chạy tải trên staging trước mỗi lần phát hành, ghi p95 từng thao tác và độ trễ tác vụ lõi.
  - BE xem truy vấn chậm, nhất là khung nhìn tổng hợp của bảng chỉ-thêm, sửa rồi đo lại.
  - PM ghi kết quả vào story và giữ lại bản phát hành khi chưa đạt.
  tieu_chi_nghiem_thu:
  - Khi chạy tải mức thiết kế thì p95 của mỗi thao tác tra cứu trong danh sách không quá 2 giây.
  - Khi chạy tải cao điểm thì độ trễ tác vụ lõi được so với mức ngày thường và Tech Lead xác nhận không chậm đi; mức tăng chấp nhận được chưa có số (G-E18-03).
  - Khi đọc số dư qua khung nhìn của bảng chỉ-thêm thì đã có số đo trên lượng dữ liệu ngày cao điểm.
  - Khi ghi kết quả đo thì có môi trường, ngày chạy và phiên bản bản dựng.
  dinh_nghia_xong:
  - Danh sách thao tác cần đo và kịch bản tải được Tech Lead duyệt và lưu trong repo (G-E18-03).
