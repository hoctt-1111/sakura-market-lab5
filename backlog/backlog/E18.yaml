  mo_ta: 'Story này làm yêu cầu lưu trữ DR-RET-01: dữ liệu nghiệp vụ giữ trực tuyến 7 năm, ảnh và chứng từ bổ trợ giữ trực tuyến 3 năm rồi chuyển sang lớp lưu lạnh. Hệ thống chỉ chuyển lớp theo lịch, không xoá vật lý dữ liệu đến hạn vì chưa có người duyệt xoá cứng (P-19); dòng giao dịch và đối soát đã vào báo cáo chính thức không bao giờ bị xoá cứng.'
  pham_vi:
  - DR-RET-01 (N10); bảng retention_policies và màn SC-142 của FG-14, mỗi loại tài liệu một dòng thời hạn (G-FG14-03); S3 có khoá đối tượng và vòng đời theo thời hạn (ADR-015).
  - Tác vụ chuyển lớp chạy theo lịch ngoài cửa sổ dịch vụ; nơi lưu lạnh chờ INV-Q-19, số năm ở lớp lạnh để trống vì chưa có nguồn số.
  - Không có lệnh xoá vật lý dữ liệu quá hạn.
  luong_chinh:
  - Infra cấu hình vòng đời lưu trữ của ảnh và chứng từ theo số năm đọc từ retention_policies.
  - Infra đặt khoá đối tượng cho chứng từ để không ai ghi đè hay xoá trước hạn.
  - Tác vụ nền chuyển dữ liệu đến hạn sang lớp lạnh theo lịch và ghi vết mỗi lần chạy.
  - QA lấy lại thử một chứng từ từ lớp lạnh và đo thời gian.
  tieu_chi_nghiem_thu:
  - Khi ảnh hay chứng từ bổ trợ đủ 3 năm trực tuyến thì tác vụ chuyển nó sang lớp lạnh, bản ghi nghiệp vụ trỏ tới vẫn tra được; phiếu và bảng chính vẫn ở trực tuyến đủ 7 năm.
  - Khi thử xoá hay ghi đè chứng từ còn trong hạn thì kho lưu từ chối.
  - Khi lấy lại một chứng từ ở lớp lạnh thì xong trong 2 ngày, đúng mức của retention_policies.
  - Khi dữ liệu đến hạn mà chưa có người duyệt xoá thì không có lệnh xoá vật lý nào chạy (P-19).
  dinh_nghia_xong:
  - Số năm lưu của từng loại dữ liệu nằm trong retention_policies, đổi được mà không sửa mã.
