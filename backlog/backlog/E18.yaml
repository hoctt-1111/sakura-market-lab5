  mo_ta: 'Story này kiểm NFR-USE-01: ba luồng nhập lô, chốt giao dịch và ghi nhận giao hàng làm trọn được bằng bàn phím, và lỗi được báo rõ tại đúng ô. Trên tablet hiện trường, vùng chạm và độ tương phản theo giả định của P-11, chờ khách xác nhận qua INV-GD-04.'
  pham_vi:
  - NFR-USE-01 (N13); màn SC-020, SC-030, SC-060.
  - Mã lỗi chung M_nn; vùng chạm tối thiểu 64 px và tương phản 7 trên 1 ở lớp tablet (P-11, giả định).
  luong_chinh:
  - 'QA lập kịch bản đi hết ba luồng chỉ bằng bàn phím: di chuyển giữa các ô, chọn, gửi, sửa lỗi.'
  - BE bảo đảm mọi lỗi kiểm dữ liệu trả mã M_nn kèm tên ô bị sai để giao diện chỉ đúng chỗ.
  - QA chạy kịch bản trên PC văn phòng và tablet hiện trường, đo vùng chạm và độ tương phản ở lớp tablet.
  - PM ghi kết quả; chỗ chưa đạt mở việc ở sub-issue FE của màn liên quan.
  tieu_chi_nghiem_thu:
  - Khi người dùng chỉ dùng bàn phím thì làm trọn được nhập lô ở SC-020, chốt giao dịch ở SC-030 và ghi lần giao ở SC-060.
  - Khi gửi dữ liệu sai thì màn chỉ ra đúng ô sai, câu báo theo mã lỗi chung và không lộ chi tiết lỗi máy chủ.
  - Khi đo ở lớp tablet thì vùng chạm và độ tương phản đạt giá trị của P-11; khách đổi giá trị thì chỉ soát lại FE.
  dinh_nghia_xong:
  - Kết quả chạy kịch bản bàn phím của ba màn ghi vào story kèm thiết bị và trình duyệt đã dùng.
