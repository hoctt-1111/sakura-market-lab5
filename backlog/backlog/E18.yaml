  mo_ta: 'Story này dựng phần giám sát của NFR-OPS-01: tình trạng sống, lỗi tác vụ nền và xuất dữ liệu, lỗi gửi thông báo, sự kiện bảo mật đều phải tới được người vận hành. Story kiểm thêm NFR-OPS-02: đổi quy tắc hay suất bằng thay đổi cấu hình có duyệt, không sửa dữ liệu lịch sử. Thời gian chờ và số lần thử của tác vụ đối soát ngày là tham số chưa có số (P-14).'
  pham_vi: NFR-OPS-01, NFR-OPS-02 (N11, N12); SC-150 bảng giám sát của FG-14, SC-122 hàng đợi cảnh báo của FG-12 và bảng alert_queue; CloudWatch, CloudTrail của PLT-02; API-220; luồng đổi bản quy tắc của FG-10.
  luong_chinh:
  - 'Infra đặt cảnh báo cho bốn nhóm: API-220 hỏng, tác vụ nền hoặc lô xuất thất bại, gửi thông báo thất bại, sự kiện bảo mật.'
  - Mỗi cảnh báo thêm một dòng alert_queue để người vận hành thấy ở SC-122; SC-150 hiện số đếm theo nhóm (G-FG14-06).
  - QA gây lỗi từng nhóm trên staging và xem cảnh báo có tới không.
  - Tech Lead rà một lần đổi bản quy tắc ở FG-10, xác nhận bản cũ và giao dịch đã chốt không đổi.
  tieu_chi_nghiem_thu:
  - Khi API-220 trả 500 trên một máy ứng dụng thì có cảnh báo nhóm tình trạng sống ở SC-122.
  - Khi tác vụ đối soát ngày hết số lần thử cấu hình thì có cảnh báo và ngày không bị tự khoá (P-14).
  - Khi lô xuất kế toán hoặc lần gửi thông báo thất bại thì có cảnh báo đúng nhóm, không mất im lặng.
  - Khi tài khoản bị khoá tạm vì nhập sai thì có cảnh báo nhóm bảo mật.
  - Khi một bản quy tắc mới có hiệu lực thì bản cũ và mọi giao dịch đã chốt theo bản cũ giữ nguyên giá trị.
  dinh_nghia_xong:
  - SC-150 hiện được bốn nhóm giám sát theo G-FG14-06 trước khi đóng story.
