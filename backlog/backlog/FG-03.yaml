  - Khi lọc theo bất kỳ tổ hợp ngày, loài, cỡ, trạng thái thì chỉ các lô khớp mọi điều kiện được trả về, có phân trang.
  - Khi bỏ trống mọi điều kiện thì màn vẫn trả danh sách; bấm Lọc không làm đổi dữ liệu lô.
  - Khi người dùng không thuộc ba vai trên thì máy chủ trả 403; vai của 取引運用 và 照合事務 theo giả định P-12.
  dinh_nghia_xong:
  - Spec API đọc danh sách lô đã viết và có người duyệt trước khi SC-021/BE làm.
