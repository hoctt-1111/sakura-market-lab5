# Seed epic FG-03 — sinh bởi gen-backlog-seed.py từ registry LAB-4 + xuyen-suot.yaml + team.yaml.
# Chỉ sửa tay 5 trường văn (mo_ta, pham_vi, luong_chinh, tieu_chi_nghiem_thu, dinh_nghia_xong), gap_refs, premise_refs; trường khác sửa ở nguồn rồi chạy lại bộ sinh.
epic:
  key: FG-03
  tracker: epic
  title_vi: Tiếp nhận lô và thẩm định 目利き
  feature: lot-intake
  spec_refs:
    sc: []
    api: []
    tech: []
    bang: []
    fr: []
    adr: []
    nfr: []
  labels:
  - type:epic
  owner: PM
  priority: 2
  premise_refs:
  - P-01
  - P-04
  - P-06
  gap_refs: []
  mo_ta: 'Nhóm chức năng này đưa hàng từ tàu cá vào sổ của chợ: ghi chuyến cập bến, tách thành lô có mã riêng, lưu kết quả 目利き (thẩm định bằng mắt) do người làm và giữ vết mọi lần sửa thuộc tính lô. Lô là đầu vào của cả 相対取引 (giao dịch thỏa thuận) lẫn せり (đấu giá), nên sai mã lô hay sai khối lượng ở đây sẽ lan sang giao dịch, đối soát và hoá đơn.'
  pham_vi: Các màn SC-020 đến SC-025, hai API ghi chuyến và tách lô (API-205, API-206), các bảng của vùng D-LOT cùng bảng attachments; không gồm cân điện tử và bước đưa lô lên kênh bán (API-207 thuộc FG-04).
  luong_chinh: []
  tieu_chi_nghiem_thu:
  - Mọi story con của FG-03 đã đóng.
  - Khi một chuyến cập bến được tách thành lô thì mỗi lô có mã không trùng, truy ngược được về chuyến và tàu, và nằm ở trạng thái chưa lên kênh bán.
  - Khi mở chi tiết một lô thì thấy người đã xác nhận 目利き, thời điểm xác nhận và đủ lịch sử điều chỉnh kèm lý do.
  - Các bảng lots, lot_evaluations, lot_adjustments, attachments, arrivals, species, vessels có migration chạy được trên kho mã hệ đích.
  dinh_nghia_xong: []
