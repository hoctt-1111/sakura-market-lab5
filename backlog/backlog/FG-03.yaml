  - G-FG03-01
  mo_ta: 受入担当者 (người tiếp nhận lô) ghi chuyến cập bến của tàu cá rồi tách thành nhiều lô có loài, cỡ, hạng độ tươi, khối lượng, số lượng. Mã lô sinh ra ở đây, mọi giao dịch về sau dựa vào nó.
  pham_vi: Màn SC-020 (SPEC-SKM-112) ở hiện trường; API-205 ghi `arrivals`, API-206 tách lô vào `lots` (chủ migration); đọc `vessels`, `species`.
  luong_chinh:
  - Người tiếp nhận chọn tàu, nhập giờ cập bến, tổng trọng lượng; API-205 ghi chuyến.
  - Người tiếp nhận nhập các dòng lô, hạng độ tươi theo 目利き (thẩm định bằng mắt); API-206 tách lô.
  - Tổng lô lệch quá 5% so với chuyến thì màn cảnh báo, người nhận tự quyết.
  tieu_chi_nghiem_thu:
  - Khi cỡ ngoài L/M/S, hạng ngoài A/B/C, khối lượng ≤ 0 hoặc số lượng < 1 thì API-206 từ chối cả lần tách.
  - Khi tàu không tồn tại thì API-205 trả 404 (P-24), không ghi chuyến.
  - Khi tách xong thì mỗi lô có mã không trùng, trạng thái unlisted; màn không cho nhập kênh bán (G-FG03-02).
  - Khi người gọi không mang vai 受入担当者 thì API trả 403.
  - Khi máy chạy kiểm thử đặt múi giờ UTC+7 và nhập lúc 02:31 JST thì 業務日 ghi đúng ngày JST và màn hiển thị giờ JST.
  dinh_nghia_xong:
  - Spec SC-020 thêm ô theo tham số API-205, API-206 (G-FG03-01).
