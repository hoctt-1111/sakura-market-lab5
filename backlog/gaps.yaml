  # ----- P3 E19 (gaps/E19.yaml) -----
  - ma: G-E19-01
    spec: SKM_SYSTEM_DESIGN.md §10 (thứ tự triển khai, D1–D6) · P-04
    mo_ta: Thứ tự triển khai ở mục 10 là thứ tự làm bộ tài liệu LAB-4, không phải thứ tự đưa hệ đích lên production. Năm bước đi từ D2 migration 27 bảng sang D3–D6 là spec API, luồng chi tiết, spec màn và các file chia sẻ nội bộ, còn D1 coi 18 bảng đã có nhờ migration của prototype.
    xu_ly: issue:REL-01
    ly_do: Theo đúng mục 10 thì kế hoạch phát hành không có bước nào cho ứng dụng hay dữ liệu di trú, và 18 bảng bị bỏ qua; REL-01 viết thứ tự cho hệ viết mới (migration cả 45 bảng theo P-04, ứng dụng, dữ liệu di trú, mở cho người dùng).
    phat_hien: E19
  - ma: G-E19-02
    spec: SKM_SYSTEM_DESIGN.md §10 (downtime) · ADR-009 §5 (hệ quả 1)
    mo_ta: Mục 10 ghi không cần ngừng dịch vụ, trong khi ADR-009 nói lần triển khai nào cũng dừng cả khối. Câu đó dựa trên việc mọi bước chỉ thêm bảng, thêm tài liệu; còn ADR-009 nói sửa một dòng cũng phải chờ ra ngoài cửa sổ dịch vụ.
    xu_ly: issue:REL-01
    ly_do: Tin câu của mục 10 thì có thể phát hành trong giờ chợ chạy và cắt ngang giao dịch; REL-01 đặt mọi lần phát hành ngoài cửa sổ 02:00–10:00 giờ Nhật, báo trước người dùng, và coi câu không cần ngừng dịch vụ chỉ đúng với bộ tài liệu LAB-4.
    phat_hien: E19
  - ma: G-E19-03
    spec: SKM_SYSTEM_DESIGN.md §10 (hoàn nguyên) · ADR-016 §2 (Hoàn tác) · ADR-014 §2 (Chạy lại) · A7
    mo_ta: Hoàn nguyên ở mục 10 chỉ có cho tài liệu, và hai bước không hoàn tác được chưa có đường bù. Mục 10 nêu khoá 業務日 (ngày nghiệp vụ) và tệp xuất kế toán đã gửi là hai bước không quay lại được khi đã vận hành thật nhưng không nói xử lý thế nào, cũng chưa có đường lùi cho bản ứng dụng hay cho migration khi đã có dữ liệu thật.
    xu_ly: issue:REL-02
    ly_do: Không có kế hoạch viết trước thì lúc sự cố người vận hành dễ xoá bản khoá hoặc sinh lô xuất mới, đúng điều A7 và ADR-014 cấm; REL-02 viết đường lùi từng bước và đường bù cho hai bước kia (điều chỉnh có duyệt của FG-06, chạy lại cùng mã lô), khách duyệt trước ngày phát hành.
    phat_hien: E19
  - ma: G-E19-04
    spec: SKM_SYSTEM_DESIGN.md §10 (cách biết là hỏng)
    mo_ta: «Cách biết là hỏng» ở mục 10 chỉ dùng cổng kiểm của bộ tài liệu LAB-4. Ba dấu hiệu nêu ra đều là cổng kiểm cây spec và đối chiếu SKM_DB với SQL, không có dấu hiệu nào cho hệ đang chạy như API-220, kiểm khói hay cảnh báo vận hành.
    xu_ly: issue:REL-03
    ly_do: Diễn tập phát hành cần biết khi nào dừng; REL-03 lấy API-220, bộ kiểm khói của REL-01 và bốn nhóm cảnh báo của NFR-OPS-01 làm dấu hiệu hỏng, Tech Lead duyệt danh sách.
    phat_hien: E19
  - ma: G-E19-05
    spec: SKM_SYSTEM_DESIGN.md §10 (Deliverables D1–D6) · ADR-008 §5 (hệ quả 2) · ADR-011 §5 (hệ quả 3)
    mo_ta: Danh sách sản phẩm bàn giao D1–D6 không có mục nào cho vận hành. Sáu mục đều là migration của prototype hoặc tài liệu thiết kế; tài liệu vận hành, lịch sao lưu và diễn tập khôi phục, người xem nhật ký hành vi bất thường mà ADR-011 đòi, và câu trả lời thống nhất về tư cách của nền tảng mà ADR-008 đòi ghi vào tài liệu bàn giao đều chưa có chỗ.
    xu_ly: issue:REL-04
    ly_do: Thiếu các mục này thì khách nhận hệ mà không tự vận hành được và nhật ký bất thường thành dữ liệu không ai đọc; REL-04 gom chúng vào biên bản bàn giao có người nhận phía khách.
    phat_hien: E19
