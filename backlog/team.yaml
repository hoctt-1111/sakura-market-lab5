sprint: {ten: Sprint, bat_dau: "2026-11-09", so_ngay: 14, so_luong: 6}   # P2 21/10: Sprint 1 = kickoff LAB-1 (P-51); 6 Iteration = 6 sprint đầu của 19

# Khoá logic → tên field đúng như trên Project (148 viết hoa «Start Date», «Due Date»).
