ma_hoc_vien: HocTT   # U10, user cung cấp 13/10/2026; in ở dòng đầu README
status_dau: New

# Priority trừu tượng 3 mức trong seed → tên lựa chọn của field «Priority» trên Project.
#   1: điều tra có hạn «trước Sprint 1» (bản đầu ghi «trước LAB-5») hoặc đã quá hạn so với ngay_xet_qua_han
#   2: issue mang nhãn ràng buộc đặc thù (constraint:*) hoặc thuộc FG-01, FG-03, FG-04, FG-07, FG-08
#   3: còn lại
priority_map: {1: Urgent, 2: High, 3: Normal}
ngay_xet_qua_han: "2026-10-12"   # ngày lập seed P1; cố định để chạy lại ra cùng byte

# Owner theo vai (field single-select «Owner»). Từ 22/10 (plan 261021-2151, P-53): lá FE/BE/DB chia theo MIỀN nghiệp vụ
# (owner_mien), không theo FG lẻ/chẵn; story Owner = người dẫn (BE → FE → QA → Infra → PM theo lá có); epic giữ PM.
# Ngoại lệ: lá BE của story DSG-xx → BE-1 (Tech Lead là slot BE-1 thứ nhất). owner_chuyen: story chuyển trọn lá FE/BE/DB sang
# slot khác để cân ±10% giờ/người — sinh bởi tools/can-owner.py vào registry/owner-chuyen.yaml, bộ sinh seed đọc file đó.
owner_theo_tracker:
  epic: PM
  story: PM            # dự phòng khi story không có lá; luật người dẫn ghi đè sau khi sinh lá
  investigation: {khach: BrSE, tech_lead: BE-1, pm: PM}
owner_theo_leaf:
  FE: {mien: {giao_dich: FE-1, tai_chinh_nen: FE-2}}
  BE: {mien: {giao_dich: BE-2, tai_chinh_nen: BE-1}}   # BE-1 có 2 người (P-52) nhận miền nặng hơn; can-owner cân phần dư
  DB: {mien: {giao_dich: BE-2, tai_chinh_nen: BE-1}}
  TEST: QA
  INFRA: Infra
  PM: PM
  BRSE: BrSE
owner_mien:
  giao_dich: [FG-03, FG-04, FG-05, FG-06, FG-07, FG-08]
  tai_chinh_nen: [FG-01, FG-02, FG-09, FG-10, FG-11, FG-12, FG-13, FG-14, E15, E16, E17, E18, E19, E20]
