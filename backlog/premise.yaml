  # P-46, P-48 (21/10): góp ý BTC LAB-4 vào backlog; mã đánh tiếp sau P-45, P-47 nằm ở nhóm giả định, P-49 và P-50 ở nhóm hướng chốt.
  - ma: P-46
    nhom: thay_doi
    spec: "Trạng thái 相対, せり theo FIG-012: chờ xác nhận, 確認者, số lượng trúng"
    loai: sua
    truoc: "Spec LAB-4 chốt giao dịch 相対 (giao dịch thỏa thuận) và kết quả せり (đấu giá) ngay khi người nhập bấm 登録 (đăng ký): SC-040 lưu chính người bấm làm 確認者 (người xác nhận), bảng transactions không có cột trạng thái hay người xác nhận, auction_results chưa có cột số lượng trúng. Không spec nào dẫn sơ đồ trạng thái FIG-012 của RFP."
    sau: "Bản ghi 相対 và bản ghi trúng giá せり đi theo các mũi tên của FIG-012: 下書き (nháp) →提出 (gửi)→ 確認待ち (chờ xác nhận); 確認待ち →承認 (duyệt)→ 確定 (đã chốt); 確認待ち →却下 (trả lại)→ 取消 (huỷ bỏ); 確定 →訂正申請 (đề nghị sửa)→ 更正 (đang sửa); 更正 →再確定 (chốt lại)→ 確定. Rút gọn có chủ ý: 下書き chỉ là phần màn đang nhập, chưa gửi, không lưu thành dòng, nên lưu bốn trạng thái 確認待ち, 確定, 取消, 更正; lý do: bước nháp không có người duyệt và RFP không đòi giữ bản nháp; khách được hỏi ở INV-FG04-XAC-NHAN. Trạng thái không là cột của transactions: bảng mới transaction_status_events, chỉ thêm, ghi mỗi bước (mã giao dịch, trạng thái trước, trạng thái sau, thao tác 提出/承認/却下/訂正申請/再確定, người làm, giờ máy chủ hiển thị theo JST, lý do bắt buộc khi 却下); trạng thái hiện tại là sự kiện mới nhất; chỉ mục duy nhất một phần trên mã giao dịch với điều kiện trạng thái trước là 確認待ち, để 承認 và 却下 không cùng áp lên một dòng; mọi bước khác (訂正申請, 再確定) kiểm trạng thái hiện tại trong lúc khoá dòng giao dịch (SELECT … FOR UPDATE), người ghi thứ hai cùng lúc nhận 409 RECORD_STATE_INVALID, nên một giao dịch sửa được nhiều vòng 訂正申請 → 再確定. Giao dịch không có sự kiện nào (bán trực tiếp API-209, dòng di trú) coi là 確定. Dòng sự kiện 承認 mang luôn căn cứ giấy (basis_kind, basis_no, basis_expires_on) chụp lúc duyệt và trade_no cấp lúc duyệt; bốn giá trị này không ghi vào transactions. SC-031, SC-032, SC-041 và API đọc giao dịch lấy trade_no, basis_* từ dòng sự kiện 承認 mới nhất; dòng đang 確認待ち hiện «—» ở cột mã giao dịch. transactions giữ đúng luật chỉ thêm, ngoại lệ duy nhất là delivery_status mà LAB-4 đã cho ghi lại; cột này do migration của SC-030/DB tạo cùng bảng (cột thiết kế đích), SC-061/BE ghi. SKM_DB thêm bảng sự kiện với nhãn thiết kế đích chưa build; migration thuộc SC-030/DB, chủ bảng transactions. Bị 却下 thì bản ghi dừng ở 取消, người nhập lập bản ghi mới; với せり, bản nhập lại là dòng auction_results mới cùng lần thử, attempt_no không tăng nên 却下 không tiêu lượt tái せり, ràng buộc duy nhất đổi thành lô + lần thử + số thứ tự dòng; số thứ tự tăng cho mọi dòng mới của cùng lô và lần thử (nhập lại sau 却下, hay nhiều lần trúng giá một phần), nên một lô có thể có nhiều dòng trúng giá trong cùng lần thử. Người duyệt là tài khoản khác người nhập, vai duyệt đọc từ ma trận quyền (P-47). SC-030/BE thêm hai hàng vào bảng mã lỗi chung như P-24 đã làm (không dùng lại M_26 vì câu của M_26 nói người lập và bản quy tắc): 422 SELF_CONFIRM_FORBIDDEN — vi «Người nhập không được tự duyệt bản ghi của mình», en «The person who entered this record cannot confirm it», ja «入力者本人は確認できません»; 409 RECORD_STATE_INVALID — vi «Bản ghi không ở trạng thái cho phép thao tác này», en «This record cannot be processed in its current state», ja «この記録は現在の状態では操作できません» (BrSE soát câu tiếng Nhật). auction_results thêm số lượng trúng; giao dịch kênh せり sinh lúc gửi kết quả trúng giá; lô đang có kết quả trúng giá ở 確認待ち thì mọi kết quả khác cho lô bị 409 M_10. TECH-301 kiểm tư cách lúc gửi theo 業務日 của lần gửi và lúc duyệt theo 業務日 của lần duyệt. Lượng còn lại theo P-30: dòng 確認待ち chỉ tính khi kiểm bán quá lô lúc gửi; lô sang đã bán chỉ khi phần còn lại tính từ dòng 確定 và 更正 bằng 0, xét lúc 承認 và lúc 再確定; 却下 không bao giờ đổi trạng thái lô. 訂正申請 và 再確定 là sự kiện ghi trên giao dịch gốc khi FG-06 nhận yêu cầu sửa (SC-050) và chốt yêu cầu (SC-052, duyệt hay từ chối đều đưa về 確定); bút toán đảo và chênh lệch là bản ghi mới nối với gốc, gốc giữ nguyên (FR-CORR-02); đối tượng sửa không phải giao dịch giữ luồng LAB-4. Huỷ giao dịch đã chốt (SC-034, API-223, P-21) là luồng FR-AITAI-03, không phải mũi tên của FIG-012: vẫn ghi dòng huỷ, cờ đã huỷ đọc từ dòng huỷ. Người duyệt làm trên SC-030, SC-040 ở chế độ xác nhận, mở từ dòng 確認待ち của SC-031, SC-041. Kết quả tái せり và chuyển 相対 không sinh giao dịch nên ghi ngay; đây là chỗ lệch có chủ ý với FIG-012 (sơ đồ ghi chung bản ghi せり), hỏi khách ở INV-FG04-XAC-NHAN."
    vi_sao: "Góp ý BTC LAB-4 (trục B): «Khối đấu giá (せり) còn thiếu chi tiết: chưa có sơ đồ trạng thái của khách, chưa lưu số lượng trúng»; mục ưu tiên của BTC ghi «Thêm bước chờ xác nhận và lưu người xác nhận (確認者) theo sơ đồ của khách». FIG-012 vẽ chung cho 相対 và せり nên backlog làm đủ năm mũi tên cho cả hai kênh; có hai chỗ rút gọn, đều nêu lý do và đưa vào câu hỏi cho khách ở P-47: 下書き không lưu thành dòng, và kết quả tái せり, chuyển 相対 ghi ngay không qua 確認待ち; bảng sự kiện giữ luật chỉ thêm của ADR-003 mà vẫn có trạng thái. FR-SERI-02 (rfp p.40) yêu cầu giữ năm dữ liệu của kết quả せり là bên trúng, khối lượng, đơn giá, lúc chốt và người xác nhận; để người bấm tự làm người xác nhận thì bước duyệt của sơ đồ không có ai làm. Chỉ bản ghi sinh giao dịch đi qua 確認待ち, phần còn lại hỏi khách; ai giữ vai duyệt là quy chế của chợ nên hỏi khách ở INV-FG04-XAC-NHAN (chỗ hở G-FG05-01)."
    nguon: "`specs/auction-result/screen-specification/SKM_SERI_RESULT_ENTRY_SPEC.md:77` «Người xác nhận (người bấm 登録)» · `specs/auction-result/screen-specification/SKM_SERI_RESULT_ENTRY_SPEC.md:174` «chưa có cột số lượng» · `specs/negotiated-trade/screen-specification/SKM_AITAI_TRADE_ENTRY_SPEC.md:127` «Máy chủ kiểm theo thứ tự» · `specs/system-design/database-design/SKM_DB.md:738` «mọi kênh đổ về một bảng» · `rfp p.39` FIG-012, sơ đồ trạng thái giao dịch 相対 và せり (diễn đạt lại) · `specs/correction/screen-specification/SKM_CORRECTION_APPROVAL_SPEC.md:48` «bản gốc giữ nguyên» · `specs/system-design/database-design/SKM_DB.md:766` «cột duy nhất của bảng được ghi lại» · `specs/system-design/database-design/SKM_DB.md:763` «Loại căn cứ (許可/承認)» · `specs/system-design/database-design/SKM_DB.md:767` «Mã giao dịch (取引番号)» · `adr/ADR-003-append-only-and-reversal.md:185` «vẫn cấm sửa» · `specs/negotiated-trade/screen-specification/SKM_TRADE_LIST_SPEC.md:112` «transactions.trade_no» · `rfp p.40` FR-AITAI-03, đường huỷ giao dịch chưa khoá (diễn đạt lại) · `rfp p.40` FR-CORR-02, bản gốc giữ nguyên sau duyệt (diễn đạt lại) · `rfp p.40` FR-SERI-02, năm dữ liệu phải lưu của kết quả せり (diễn đạt lại) · `tran-thai-hoc-feedback-lab04.html` (feedback LAB-4 của BTC, ngoài repo) «chưa có sơ đồ trạng thái của khách, chưa lưu số lượng trúng»"
