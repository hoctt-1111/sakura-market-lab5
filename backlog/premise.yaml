    spec: "買出人 (người mua lẻ) có là bên mua của 相対 không; hạn tham gia của 卸売業者 và 買出人 (GD-19, Q-22)"
    cho_de_ngo: "FR-AITAI-01 (p.40) có trường 買出人 ở giao dịch 相対, nhưng tư cách ở Phụ lục B.2 (p.70) chỉ quy định 許可 của 仲卸 và 承認 của 売買参加者; RFP cũng không nói hạn tham gia của 卸売業者, 買出人 quản lý dựa trên gì và cảnh báo trước bao lâu. LAB-4 0.4.1 giữ phản hồi 403 làm mặc định (GD-19) và hỏi khách ở Q-22, mức quan trọng."
    sau: "Bên mua của 相対 chỉ là 仲卸 và 売買参加者; bên mua là 買出人 thì máy chủ trả 403, như GD-19. Hạn tham gia của 卸売業者 và 買出人 là một ngày hết hạn ở participants.qualified_until; SC-011 và SC-014 có ô hạn này."
    anh_huong_uoc: "TECH-301/BE và SC-030/BE ước theo một nhánh 403 cho 買出人; khách đáp 買出人 được mua qua 相対 thì bỏ nhánh 403, thêm điều kiện tư cách của 買出人 ở TECH-301 và ca kiểm thử; đáp hạn tham gia quản lý khác một ngày hết hạn thì SC-011/DB thêm cột hoặc bảng."
    vi_sao: "Đây là giả định GD-19 của LAB-4 0.4.1, backlog giữ nguyên để ước. Dòng này có mặt vì backlog mở issue điều tra INV-Q-22 để khách trả lời Q-22 trước khi làm TECH-301/BE, như cách các giả định LAB-4 khác (P-08, P-09) được theo dõi."
    nguon: "`PREMISE.md:42` «買出人 không là bên mua của 相対 (U3): giữ phản hồi 403 làm thiết kế mặc định» · `PREMISE.md:176` «máy chủ trả 403 khi bên mua là 買出人»"
    anh_huong: [TECH-301/BE, SC-030/BE, SC-011/BE, SC-014/BE]
