  - ma: P-48
    nhom: thay_doi
    spec: "SC-122 và alert_queue: thao tác xử lý, trạng thái, cột thêm"
    loai: sua
    truoc: "SC-122 ghi là màn xử lý hàng đợi cảnh báo nhưng chỉ có ô lọc 業務日 (ngày nghiệp vụ), ô lọc trạng thái và nút Lọc; ô lọc trạng thái không ứng với cột nào, còn alert_queue chỉ có loại, mức khẩn, giờ tạo, giờ xử lý và người thực hiện, không có trạng thái, nguồn hay ghi chú."
    sau: "Cảnh báo có hai trạng thái 未処理 (chưa xử lý) → 処理済 (đã xử lý), một chiều. 運用管理者 (quản lý vận hành) xử lý việc gốc ngoài màn rồi bấm «処理済にする» (đánh dấu đã xử lý) ở dòng 未処理, ghi chú xử lý bắt buộc, dài 5–500 ký tự sau khi bỏ khoảng trắng hai đầu như ô lý do của SC-080; máy chủ ghi trạng thái, giờ xử lý (xu_ly_luc) theo giờ máy chủ, người thực hiện (boi) theo phiên, ghi chú và một dòng audit_log trong cùng giao dịch CSDL. alert_queue thêm ba cột: trạng thái (mặc định 未処理), nguồn (module hay tác vụ sinh cảnh báo kèm mã dòng gốc, ví dụ dòng notification_log hỏng hay lượt EV3 hết lần thử) và ghi chú xử lý; giữ xu_ly_luc, boi. Ô lọc trạng thái lọc theo cột mới, tập giá trị 未処理 và 処理済, mặc định 未処理."
    vi_sao: "Góp ý BTC LAB-4 (trục R): «màn hàng đợi cảnh báo mô tả là “xử lý hàng đợi” nhưng không có thao tác xử lý, không có trạng thái, và ô lọc trạng thái không ứng với cột nào trong bảng alert_queue». Lưu trạng thái thành cột thay vì suy từ giờ xử lý để ô lọc và SC-150 đọc cùng một giá trị; ghi chú bắt buộc để người sau biết cảnh báo đã xử lý bằng cách nào. Vai 運用管理者 chưa gán vai hệ thống nên lệnh vẫn chặn theo P-12 tới khi INV-Q-SD4 có đáp (chỗ hở G-FG12-04)."
    nguon: "`specs/notification/screen-specification/SKM_OPS_ALERT_QUEUE_SPEC.md:48` «Xử lý hàng đợi cảnh báo vận hành» · `specs/notification/screen-specification/SKM_OPS_ALERT_QUEUE_SPEC.md:90` «giao-dien.loc_trang_thai» · `specs/notification/screen-specification/SKM_OPS_ALERT_QUEUE_SPEC.md:111` «Lọc lại danh sách theo điều kiện» · `specs/system-design/database-design/SKM_DB.md:1584` «Xu Ly Luc» · `specs/system-design/database-design/SKM_DB.md:1585` «Boi» · `tran-thai-hoc-feedback-lab04.html` (feedback LAB-4 của BTC, ngoài repo) «không có thao tác xử lý, không có trạng thái»"
    anh_huong: [SC-122, SC-122/FE, SC-122/BE, SC-122/TEST, DATA-FG12/DB]

