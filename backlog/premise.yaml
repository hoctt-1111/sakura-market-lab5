    vi_sao: "Hồi quy trên màn hình giải thích gần như không chút nào độ lệch giờ giữa các màn (R² so trung bình âm), nên k đó chỉ là mức trung bình của việc màn; đem áp cho dựng hai môi trường hay diễn tập di trú thì giờ còn một phần năm LAB-1 mà không có lý do nghiệp vụ. Hiệu chuẩn từng nhóm trên EF của LAB-1 giữ một quy ước tự động có nguồn, tổng theo nhóm so được với estimate khách đã nhận."
    nguon: "`lab-05/registry/uoc-luong/quy-uoc-gio.yaml` «dinh-muc-ef» · `lab-05/registry/team.yaml` «nhom_gio_theo_tien_to» · `lab-01/registry/effort-other.yaml` (EF-04, EF-07, EF-23, EF-13, EF-15 tới EF-27, EF-30, EF-32) · bản soát của senior PM/dev ngày 21/10 (nội bộ)"
