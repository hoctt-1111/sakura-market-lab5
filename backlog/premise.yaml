    vi_sao: "LAB-4 đặt mốc trả lời trước khi viết phân quyền ở LAB-5, tức ngay sprint đầu; mặc định chặn với vai chưa gán là cách duy nhất không tự cấp quyền mà khách chưa đồng ý."
