    anh_huong_uoc: "Sub-issue BE của SC-001 và issue NFR-SEC làm cơ chế đọc tham số; câu trả lời của khách chỉ đổi giá trị, không đổi ước lượng."
    vi_sao: "PREMISE LAB-4 ghi NFR-SEC-03 chưa có ngưỡng số trong RFP; tự đặt số khi chưa có đáp là lấy ý bên làm thay cho chỗ RFP để ngỏ."
