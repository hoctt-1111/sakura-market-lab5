    spec: "Luồng TECH-301 và bảng lots: lượng khả dụng của lô khi bán một phần 相対 (`SKM_AITAI_BUYER_ELIGIBILITY_TECH.md`, `SKM_DB.md`)"
    loai: sua
    truoc: "TECH-301 kiểm số lượng bán không vượt toàn bộ khối lượng lô (so `quantityKg` với `weight_kg`), rồi trong cùng một giao dịch CSDL ghi giao dịch và chuyển cả lô sang trạng thái đã bán qua 相対 (`sold_aitai`); bảng lots không có cột phần còn lại, nên mỗi lô chỉ bán được một lần."
    sau: "Một lô bán được nhiều lần cho tới hết. Lượng còn lại tính lúc đọc bằng khối lượng lô trừ tổng số lượng của các giao dịch còn hiệu lực (chưa có dòng huỷ); lô chỉ sang trạng thái đã bán khi phần còn lại bằng 0, không thêm cột số dư vào lots. Huỷ giao dịch thì phần còn lại tự tăng lại, khớp P-21."
    cho_de_ngo: "FR-AITAI-01 đòi trừ đúng lượng khả dụng và API-208, API-209 đòi số lượng không vượt phần còn lại, nhưng TECH-301 so số lượng với toàn bộ khối lượng lô rồi chuyển cả lô sang đã bán, và bảng lots không có cột phần còn lại."
    anh_huong_uoc: "SC-030/BE và SC-034/BE ước theo một hàm tính lượng còn lại dùng chung; nếu khách đáp mỗi lô chỉ bán một lần thì bỏ hàm này và giữ cách chuyển cả lô của TECH-301."
    vi_sao: "FR-AITAI-01 đòi trừ đúng lượng khả dụng và API-208, API-209 đòi số lượng không vượt phần còn lại, trái với cách TECH-301 chuyển cả lô, nên đây là sửa luồng của spec chứ không chỉ lấp chỗ để ngỏ. Tính từ dòng giao dịch thì không cột nào bị sửa, đúng luật chỉ thêm của ADR-003, và lần huỷ ở SC-034 không phải hoàn lượng vào đâu. Cách này không đổi điều RFP nêu; khách đáp mỗi lô chỉ bán một lần thì quay về cách của TECH-301, câu hỏi nằm ở INV-LOT-KHA-DUNG (chỗ hở G-FG04-01)."
