# PREMISE LAB-05 — nguồn của PREMISE.md (P2 viết tay, P4 gộp và chốt; mã P-xx không đánh lại; P4 thêm P-26…P-42, dòng nằm
# trong nhóm của nó nên mã trong một bảng không liền số; P2 đầu việc 3–5 nối P-43…P-45 ở cuối nhóm giả định).
# Mốc so sánh: repo hoctt-1111/sakura-market-lab4-spec, nhánh main, commit df4a6b0 (gói 0.4.1), nộp ngày 17/10/2026.
# Đường dẫn trong `nguon`, `lab4_041` là đường dẫn đầy đủ tính từ gốc repo LAB-4 đó (không có thư mục = file ở gốc: README.md,
# PREMISE.md, AI-report.md); tài liệu ngoài repo nộp (ghi chú bàn giao và bản soát nội bộ, `rfp p.NN`) chỉ dẫn bằng câu trích, không kèm đường dẫn.
# Kiểm bằng `lab-05/tools/kiem-con-tro-lab4.py` (mọi `file:dòng «trích»` phải khớp đúng dòng ở commit trên).
# Dòng LAB-4 0.4.1 nay đã nói giống: `trang_thai: da_vao_lab4_041` + `lab4_041` (chỗ LAB-4 nói, có trích); dòng đó ra khỏi
# 3 bảng bắt buộc của PREMISE.md, sang mục «Lịch sử tiền đề»; mã giữ để issue đang trỏ còn tra được.
# Cách ghép cột (đề Lab_05.txt mục IV.3):
#   thay_doi   → Spec = spec · Thêm/Bỏ/Sửa = loai · Trước → sau = truoc → sau · Vì sao = vi_sao · Issue bị ảnh hưởng = anh_huong
#   gia_dinh   → Giả định = sau · Chỗ spec/RFP để ngỏ = cho_de_ngo · Ảnh hưởng tới issue/estimate = anh_huong + anh_huong_uoc
#                (anh_huong_uoc là trường thêm ngoài hợp đồng: câu nói ước lượng đổi thế nào nếu đáp khác giả định)
#                Issue điều tra = inv; Owner và Mốc đọc từ chính issue điều tra trong seed, không chép vào đây
#   huong_chot → Vấn đề = spec · Các phương án ở LAB-4 = phuong_an_lab4 · Phương án chốt = chot · Vì sao = vi_sao
# anh_huong chỉ ghi key (SC-031, SC-031/BE, API-209, TECH-304, FG-04 …); P5 đổi sang #số qua board-map.json.
p:
  # ---------- Nhóm 1: spec thêm / bỏ / sửa ----------
  - ma: P-01
    nhom: thay_doi
    spec: "55 màn + 2 khuôn chưa có API; thêm màn SC-041 có API ghi (tạo phiên せり) nhưng thiếu API đọc"
    loai: them
    truoc: "LAB-4 có 23 spec API, trường screen_id của chúng gắn 17 trong 72 màn; README mục 8 đếm 57 spec chưa có API nào, gồm 55 màn và 2 khuôn báo cáo dùng chung. Màn SC-041 nằm trong 17 màn đó nhưng chỉ được gắn API ghi (tạo phiên せり (đấu giá)); các cột danh sách của nó đọc thẳng cơ sở dữ liệu, không có API đọc."
    sau: "Mỗi issue của 55 màn và 2 issue khuôn báo cáo có sub-issue BE làm hai bước nối tiếp: viết spec API theo khuôn BM-2-901-52 như 23 spec đã có, rồi làm API đó trên kho mã hệ đích. Sub-issue BE của SC-041 viết thêm spec API đọc theo cùng khuôn."
    vi_sao: "Sai khác #7 của LAB-4 tự ghi phần API còn lại «cấp ở LAB-5», nên thiếu bước thiết kế API thì 55 màn không có đường lấy dữ liệu để làm. Bản 0.4.1 bỏ SC-081, SC-082 khỏi screen_id của API tính thưởng, nên hai màn này nay nằm trong 55 màn và đi theo cách chung; số đếm của LAB-4 nay khớp số đếm lại từ dòng 11 (screen_id) của 23 file API (chỗ hở G-01). SC-041 vẫn lọt khỏi con số 55 vì screen_id của API ghi nhắc tới nó (chỗ hở G-FG05-06)."
    nguon: "`README.md:176` «số màn chưa có API đếm một chỗ ở README mục 8» · `README.md:211` «55 màn và 2 khuôn báo cáo» · `PREMISE.md:132` «các màn còn lại chưa có API» · `specs/system-design/api-design/negotiated-trade/SKM_TRADE_DETAIL_READ_API.md:11` «screen_id: [SC-032, SC-034]» · `specs/system-design/api-design/auction-result/SKM_SERI_SESSION_CREATE_API.md:11` «screen_id: [SC-041]» · `specs/system-design/api-design/full-payment-incentive/SKM_INCENTIVE_EVALUATE_API.md:11` «screen_id: [SC-080]» · `specs/auction-result/screen-specification/SKM_SERI_RESULT_LIST_SPEC.md:100` «DB (server)»"
    anh_huong: [FG-01, FG-02, FG-03, FG-06, FG-07, FG-08, FG-09, FG-10, FG-11, FG-12, FG-13, FG-14, SC-041/BE, SC-081/BE, SC-082/BE]
  - ma: P-02
    nhom: thay_doi
    spec: "Kho mã của hệ đích (sai khác #25, `README.md`)"
    loai: them
    truoc: "LAB-4 chưa có kho mã của hệ đích; README chỉ trỏ prototype LAB-3 làm bằng chứng nghiệp vụ, kho spec và kho mã chưa trỏ nhau."
    sau: "Issue PLT-01 dựng kho mã hệ đích Java 21, Spring Boot 3 cùng dây chuyền kiểm tự động khi đẩy mã; README của kho spec và kho mã trỏ nhau hai chiều, prototype LAB-3 chỉ còn là tài liệu tham chiếu."
    vi_sao: "Sai khác #25 ghi rõ kho mã hệ đích do LAB-5 tạo và hai kho chưa có liên kết hai chiều mà chuẩn đòi; không có issue này thì mọi sub-issue BE và DB không có chỗ đặt mã và migration."
    nguon: "`README.md:194` «Chưa có repo code của hệ đích (LAB-5 tạo)» · `PREMISE.md:228` «LAB-5 chia việc theo hệ đích này»"
    anh_huong: [PLT-01-1, PLT-01-2, PLT-01-3, PLT-01-1/INFRA, PLT-01-2/INFRA, PLT-01-3/INFRA]
  - ma: P-03
    nhom: thay_doi
    spec: "Kiểm tra đầu vào chi tiết của 18 spec ngoài 10 màn lõi (sai khác #29, `specs/_common/common-spec.md`)"
    loai: them
    truoc: "Chỉ 10 màn lõi có bảng 4.2 đủ kiểu, ngưỡng, định dạng và mã thông báo lỗi; 16 màn nhập liệu và 2 khuôn báo cáo chỉ ghi item nào bắt buộc rồi trỏ về common-spec."
    sau: "Issue của 16 màn và 2 khuôn mang tiêu chí nghiệm thu về kiểm tra đầu vào; sub-issue FE và BE làm kiểm tra phía trình duyệt và phía máy chủ, sub-issue TEST có ca cho từng luật. Ngưỡng chỉ lấy từ RFP hoặc tham số của API; chỗ không nguồn nào cho số thì ghi «chưa có số, để cấu hình», không tự đặt ngưỡng."
    vi_sao: "Sai khác #29 dừng độ sâu của phần kiểm tra đầu vào có chủ ý ở LAB-4 và common-spec giao phần còn lại cho LAB-5. Bản 0.4.1 nâng SC-013, SC-060, SC-063, SC-071 lên màn lõi có bảng 4.2 đủ, nên bốn màn này ra khỏi dòng này và theo bảng của LAB-4; đếm lại ở 0.4.1 còn 16 spec màn mang dòng «Chưa thiết kế chi tiết» cộng 2 khuôn báo cáo cũng mang dòng đó (chỗ hở G-14)."
    nguon: "`README.md:198` «chỉ viết cho 10 màn lõi» · `specs/_common/common-spec.md:25` «Validation chưa thiết kế chi tiết» · `specs/_common/common-spec.md:42` «việc này thuộc LAB-5»"
    anh_huong: [SC-001, SC-003, SC-005, SC-006, SC-020, SC-023, SC-024, SC-025, SC-034, SC-050, SC-052, SC-053, SC-093, SC-120, SC-131, SC-141, KH-181, KH-182]
  - ma: P-04
    nhom: thay_doi
    spec: "Thứ tự triển khai D1–D3 (`architecture/SKM_SYSTEM_DESIGN.md` mục 10)"
    loai: sua
    truoc: "D1 coi 18 bảng là đã có nhờ migration 0001–0007 của prototype; D2 chỉ viết migration cho 27 bảng còn ở mức thiết kế; D3 cập nhật 20 API đã build và thêm 3 API thiết kế đích."
    sau: "Kho mã hệ đích viết migration cho cả 45 bảng và làm mới cả 23 API; migration và route của prototype chỉ dùng để đối chiếu nghiệp vụ. Sub-issue DB có ở mọi issue làm chủ bảng, kể cả chủ của 18 bảng prototype đã có; riêng bảng đặt trước đi cùng API-210 và chờ giả định P-20."
    vi_sao: "LAB-4 chốt hệ đích Java trên AWS và nói LAB-5 không viết tiếp trên Supabase, nhưng D1 vẫn tính 18 bảng là xong theo migration Supabase; giữ D2, D3 như cũ thì 18 bảng và 20 API không có việc nào trong backlog dù hệ đích chưa có dòng mã nào."
    nguon: "`architecture/SKM_SYSTEM_DESIGN.md:402` «18 bảng đã build» · `architecture/SKM_SYSTEM_DESIGN.md:403` «Migration cho 27 bảng» · `architecture/SKM_SYSTEM_DESIGN.md:393` «D3 20 API đã build» · `PREMISE.md:228` «không viết tiếp trên Supabase» · `specs/system-design/database-design/SKM_DB.md:23` «18/45 bảng đã build ở LAB-3»"
    anh_huong: [PLT-01-1, PLT-01-2, PLT-01-3, FG-01, FG-02, FG-03, FG-04, FG-05, FG-08, FG-09, FG-10, FG-13]
  - ma: P-05
    nhom: thay_doi
    spec: "Dòng «Xác thực» của 17 spec API (`specs/system-design/api-design/*/*_API.md`, mục 2)"
    loai: sua
    truoc: "17 spec API ghi vai của prototype (wholesaler, admin, nakaoroshi, sanka) ở dòng Xác thực; 3 API thiết kế đích của 相対 (giao dịch thỏa thuận trực tiếp giữa hai bên) đã ghi vai đích; 3 API còn lại là công khai, không cần vai."
    sau: "Sub-issue BE của 17 API kiểm quyền theo vai đích lấy từ mục 6.1 của spec màn gắn API, đúng cách 3 API 相対 đã làm; API không gắn màn lấy vai từ mục 7 của System Design. Vai nào chưa gán thì theo giả định P-12."
    vi_sao: "PREMISE LAB-4 liệt kê dòng Xác thực của API trong số tài liệu phải sửa khi có đáp về vai, còn mâu thuẫn Supabase chỉ được đóng bằng nhãn prototype. Làm theo vai prototype thì hệ đích kiểm quyền bằng những tên vai không có trong 19 vai của thiết kế. Ghi chú bàn giao nội bộ của LAB-4 nói «20 API»; đếm lại 17 file mang vai prototype vì 3 trong 20 là công khai (chỗ hở G-20)."
    nguon: "`specs/system-design/api-design/negotiated-trade/SKM_AITAI_TRADE_CREATE_API.md:40` «prototype LAB-3 dùng Supabase Auth» · `specs/system-design/api-design/negotiated-trade/SKM_TRADE_LIST_READ_API.md:39` «vai đích theo mục 6.1 spec màn» · `PREMISE.md:175` «dòng Xác thực của API» · `architecture/SKM_SYSTEM_DESIGN.md:336` «không nằm trong 19 vai»"
    anh_huong: [API-203/BE, SC-010/BE, SC-013/BE, SC-014/BE, SC-020/BE, API-207/BE, SC-030/BE, SC-033/BE, API-209/BE, API-210/BE, SC-040/BE, SC-041/BE, API-213/BE, API-214/BE, SC-080/BE, SC-081/BE, SC-082/BE, SC-091/BE, SC-092/BE, SC-093/BE]
    trang_thai: da_vao_lab4_041
    lab4_041: "`PREMISE.md:47` «20 API đã build có dòng vai đích, sinh từ màn gọi API, mục 6.1 của màn và bảng vai của System Design» · `specs/system-design/api-design/negotiated-trade/SKM_AITAI_TRADE_CREATE_API.md:42` «suy từ ô gửi tới API này ở mục 4.3» · `specs/system-design/api-design/account-access/SKM_PERMISSION_UPDATE_API.md:42` «chưa suy được từ màn — chờ Q-SD4»"
  - ma: P-06
    nhom: thay_doi
    spec: "Kiểu cột, NOT NULL và khoá ngoại của 27 bảng thiết kế (`specs/system-design/database-design/SKM_DB.md`)"
    loai: sua
    truoc: "138 ô kiểu còn ghi «chốt ở LAB-5»: 107 ô suy theo quy ước §0.7 và 31 ô để «—» vì chưa khớp quy ước; cột Not Null của cả 27 bảng thiết kế còn 145 ô «—»; thêm 8 cột kết thúc bằng _id chưa rõ trỏ tới bảng nào (câu hỏi mở Q1–Q8 cuối SKM_DB)."
    sau: "Sub-issue DB của issue làm chủ bảng chốt kiểu và NOT NULL từng cột, cùng quan hệ của 8 cột, trước khi viết migration, rồi ghi lại vào SKM_DB.md; định nghĩa xong của sub-issue DB đòi bảng đó không còn ô «—» ở cột kiểu và cột NOT NULL, và không còn câu hỏi mở."
    vi_sao: "SKM_DB.md tự ghi kiểu chính thức chốt khi viết migration ở LAB-5 và để 8 câu hỏi khoá ngoại cho Tech Lead với hạn «trước LAB-5»; không gắn việc chốt vào sub-issue DB thì migration tự đặt kiểu mà không ai duyệt. Ghi chú bàn giao nội bộ của LAB-4 chỉ nêu 31 ô «—»; đếm lại có thêm ô suy cùng ghi chú chờ chốt, bản 0.4.1 tự ghi 107 ô (bản nộp 12/10 ghi 99, tăng qua bản sửa 2 và 3) (chỗ hở G-12, G-04, G-18). Góp ý BTC LAB-4 (trục A) thêm phần NOT NULL: «27 bảng thiết kế đích còn để trống NOT NULL, vài cột chưa ghi kiểu»; cột để trống là chỗ người viết migration phải đoán, nên NOT NULL vào cùng bước chốt và cùng định nghĩa xong với kiểu."
    nguon: "`specs/system-design/database-design/SKM_DB.md:23` «chốt khi viết migration ở LAB-5» · `specs/system-design/database-design/SKM_DB.md:23` «107 ô suy theo data-model.md §0.7, 31 ô còn —» · `specs/system-design/database-design/SKM_DB.md:418` «chưa khớp quy ước 0.7 (bảng C)» · `specs/system-design/database-design/SKM_DB.md:1858` «không khớp quan hệ nào» · `specs/system-design/database-design/SKM_DB.md:1581` «suy từ quy ước 0.7 — chốt ở LAB-5» · `tran-thai-hoc-feedback-lab04.html` (feedback LAB-4 của BTC, ngoài repo) «còn để trống NOT NULL, vài cột chưa ghi kiểu»"
    anh_huong: [FG-01, FG-02, FG-03, FG-04, FG-06, FG-07, FG-08, FG-10, FG-11, FG-12, FG-13, FG-14]
  - ma: P-07
    nhom: thay_doi
    spec: "Spec màn SC-033 và SC-034 (`SKM_TRADE_REJECT_REASON_SPEC.md`, `SKM_TRADE_CANCEL_SPEC.md`)"
    loai: sua
    truoc: "SC-034 ghi cột Data Source là «DB (server)» dù ghi chú cùng dòng nói màn đọc giao dịch qua API 222; mục xử lý lỗi của SC-033 ghi «Đang gọi» API tạo giao dịch dù màn không gọi API nào."
    sau: "Sub-issue FE của SC-034 lấy dữ liệu qua API 222 và gửi huỷ qua API 223, không đọc bảng trực tiếp; sub-issue FE của SC-033 chỉ hiện lỗi mà SC-030 đã nhận từ API tạo giao dịch, không gọi lại API."
    vi_sao: "Người soát nội dung của LAB-4, ở lượt soát thứ hai, nêu hai chỗ này là mục Low chưa sửa trước khi nộp; làm theo đúng chữ của cột thì FE đọc thẳng cơ sở dữ liệu hoặc gọi lại API tạo, trái với ghi chú của chính hai spec (chỗ hở G-08, G-09)."
    nguon: "`specs/negotiated-trade/screen-specification/SKM_TRADE_CANCEL_SPEC.md:87` «DB (server)» · `specs/negotiated-trade/screen-specification/SKM_TRADE_REJECT_REASON_SPEC.md:108` «Màn không gọi API nào khi mở» · `specs/negotiated-trade/screen-specification/SKM_TRADE_REJECT_REASON_SPEC.md:112` «Đang gọi `SKM_AITAI_TRADE_CREATE`» · bản soát nội dung LAB-4 lượt 2: «phát hiện mới (mức Low, không chặn)» — dịch từ câu của bản soát"
    anh_huong: [SC-034/FE, SC-033/FE]

  - ma: P-26
    nhom: thay_doi
    spec: "Bảng đệm, bảng lô nạp và cột dấu nguồn di trú (`SKM_DB.md`, ADR-016)"
    loai: sua
    truoc: "ADR-016 nạp dữ liệu cũ qua bảng đệm giữ nguyên dòng gốc, ghi mỗi lần nạp thành một lô và đánh dấu bảng nghiệp vụ bằng cột nguồn (dữ liệu của hệ hay dữ liệu di trú) kèm mã lô, nhưng 45 thực thể của SKM_DB không có bảng hay cột nào cho ba thứ này."
    sau: "MIG-02/DB thêm bảng đệm và bảng lô nạp vào SKM_DB với nhãn thiết kế chưa build rồi viết migration của chúng. Cột nguồn và mã lô được MIG-02/DB thêm bằng một migration chạy sau vào bảng đích của ba đợt nạp (người tham gia; lô, giao dịch và giao hàng; đối soát, hoá đơn và thanh toán), giá trị mặc định là dữ liệu của hệ, nên sub-issue DB của từng bảng đích không phải sửa."
    vi_sao: "Thiếu ba thứ này thì công cụ nạp không giữ được dòng gốc để đối chiếu, không hoàn tác được theo lô, và báo cáo không lọc được dữ liệu di trú như ADR-003 và ADR-016 đòi. Gom việc thêm cột vào một migration của MIG-02/DB để sub-issue DB của từng bảng không phải chờ quyết định di trú (chỗ hở G-E16-02)."
    nguon: "`adr/ADR-016-di-tru-tu-file-so-theo-rc7.md:55` «Bảng nghiệp vụ mang» · `adr/ADR-016-di-tru-tu-file-so-theo-rc7.md:52` «người tham gia và quyền» · `specs/system-design/database-design/SKM_DB.md:31` «Khởi tạo — 45 thực thể»"
    anh_huong: [MIG-02-1/DB, MIG-02-2/DB, SC-011/DB, SC-020/DB, DATA-FG03/DB, SC-030/DB, SC-060/DB, DATA-FG08/DB, DATA-FG09/DB]

  # P-29, P-30: soát độc lập P6 (M2) dời từ nhóm giả định sang đây vì cả hai sửa điều spec LAB-4 đã viết. `cho_de_ngo`,
  # `anh_huong_uoc` giữ lại cho issue điều tra và cho bước ước lượng; bảng 1 của PREMISE.md không in hai trường này.
  - ma: P-29
    nhom: thay_doi
    spec: "Trạng thái tư cách và bảng chuyển trạng thái, thêm 再審査 (xét lại) (`SKM_PARTICIPANT_QUALIFICATION_UPDATE_API.md`, `SKM_QUALIFICATION_CHANGE_SPEC.md`)"
    loai: sua
    truoc: "Spec của API-204 (đổi tư cách) chỉ cho trường trạng thái tư cách nhận một trong ba giá trị `active`, `suspended`, `expired`, tức có hiệu lực, tạm dừng và 失効 (mất hiệu lực); spec màn SC-013 chỉ có ba thao tác dừng, mở lại và 失効. Trạng thái 再審査 (xét lại) mà sơ đồ FIG-010 của RFP vẽ không có trong spec LAB-4."
    sau: "Trạng thái tư cách gồm ba trạng thái của spec LAB-4 cộng 再審査 (xét lại) mà sơ đồ của RFP vẽ, để cột trạng thái không phải đổi về sau. Bảng chuyển trạng thái là cấu hình của dịch vụ đổi tư cách, khởi tạo đúng ba thao tác của LAB-4 (dừng từ có hiệu lực, mở lại từ tạm dừng, 失効 (mất hiệu lực) từ hai trạng thái kia) và chưa có bước nào vào 再審査 tới khi khách đáp. Giấy quá hạn không tự đổi trạng thái, chỉ bị chặn lúc chốt giao dịch theo TECH-301."
    cho_de_ngo: "Spec LAB-4 có ba trạng thái (có hiệu lực, tạm dừng, 失効 (mất hiệu lực)) với ba thao tác dừng, mở lại, 失効, còn sơ đồ FIG-010 của RFP vẽ thêm 再審査; không spec nào ghi bước chuyển nào được phép, 失効 có mở lại được không, giấy quá hạn có tự đổi trạng thái không. FIG-010 có nhãn chuyển 期限切れ (hết hạn), nhưng chưa rõ chuyển này tự động hay do người bấm."
    anh_huong_uoc: "SC-013/BE ước theo bảng chuyển ở cấu hình; khách đáp thêm bước vào, ra 再審査 hay cho mở lại 失効 thì chỉ thêm dòng cấu hình và ca kiểm thử, còn nếu 再審査 cần luồng xét riêng thì SC-011, SC-013 thêm item và TECH-301 thêm một nhánh từ chối."
    vi_sao: "Spec LAB-4 chỉ cho ba giá trị, nên thêm 再審査 là sửa spec chứ không chỉ lấp chỗ để ngỏ. Giữ trạng thái RFP đã vẽ và để bảng chuyển ở cấu hình thì không bỏ điều RFP nêu, cũng không đặt quy chế thay khách, mà máy chủ vẫn từ chối được bước lạ. Phần còn để ngỏ (bước nào vào, ra 再審査, 失効 có mở lại được không) do khách trả lời ở INV-FG02-TRANG-THAI (chỗ hở G-FG02-06)."
