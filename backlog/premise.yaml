    cho_de_ngo: "FR-DEL-03 đòi lý do chọn từ danh mục (理由の一覧) và có người xác nhận nhưng RFP không liệt kê mục nào. LAB-4 0.4.1 chia danh mục theo 種別 (loại ngoại lệ), mới là phương án nhà thầu đưa ra, khách chưa chốt; 確認者 (người xác nhận) do máy chủ gán từ phiên của người ghi; 照合事務 (nhóm đối soát) đóng ngoại lệ ở bước riêng."
    sau: "Dùng đúng đề xuất của LAB-4 0.4.1: danh mục theo 種別 làm giá trị khởi tạo, 配送部門 (bộ phận giao hàng) ghi ngoại lệ với 確認者 là người ghi do máy chủ gán, 照合事務 đóng ngoại lệ bằng nút 処理済にする; hai bước do hai vai khác nhau làm. Khách chốt danh mục khác thì chỉ đổi danh sách giá trị cho phép của reason_code."
    anh_huong_uoc: "SC-063/BE ước theo danh mục và hai bước ghi, đóng của LAB-4; khách đổi danh mục thì chỉ đổi danh sách giá trị và ca kiểm thử, khách cần thêm cấp xác nhận thì thêm bước, quyền và ca kiểm thử."
    vi_sao: "Bản nộp 12/10 chưa có danh mục và người xác nhận, nên P-33 cũ để danh mục rỗng ở cấu hình và đòi người xác nhận khác người ghi. Bản 0.4.1 đã lấp chỗ này bằng đề xuất có nhãn chờ khách và tách hai vai ghi, đóng; backlog theo đúng cách đó, chỉ giữ issue điều tra để khách chốt danh mục, vì danh mục là quy định của chợ (chỗ hở G-FG07-06)."
