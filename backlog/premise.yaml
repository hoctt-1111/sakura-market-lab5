    sau: "Khoá 業務日 (ngày nghiệp vụ) là bước người bấm ở SC-071; tác vụ EV3 chỉ lập bảng đối soát và mở tranh chấp, không tự khoá. Chưa có đường mở lại ngày đã khoá, sửa sau khoá chỉ đi đường điều chỉnh có duyệt của FG-06. Chốt hoá đơn tháng (API-213) chạy độc lập, không chạy kèm khi khoá ngày."
    anh_huong_uoc: "SC-070/BE và SC-071/BE ước theo khoá bằng người, không có đường mở lại; nếu Tech Lead chọn cho mở lại thì SC-071 thêm lệnh, quyền và ca kiểm thử, bảng khoá phải phân biệt khoá với mở lại."
    vi_sao: "Khoá ngày tạo nghĩa vụ pháp lý nên để người quyết. Không làm đường mở lại thì giữ được luật của FR-SETTLE-02 là sau khoá chỉ sửa qua điều chỉnh có duyệt, cho tới khi có đáp (chỗ hở G-FG08-03)."
