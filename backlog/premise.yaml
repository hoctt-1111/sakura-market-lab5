    sau: "Khoá 業務日 (ngày nghiệp vụ) là bước người bấm ở SC-071; tác vụ EV3 chỉ lập bảng đối soát và mở tranh chấp, không tự khoá. Chưa có đường mở lại ngày đã khoá, sửa sau khoá chỉ đi đường điều chỉnh có duyệt của FG-06. Chốt hoá đơn tháng (API-213) chạy độc lập, không chạy kèm khi khoá ngày."
