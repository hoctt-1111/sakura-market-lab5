  - ma: P-10
    nhom: gia_dinh
    spec: "適格金額 (số tiền đủ điều kiện tính thưởng) và 交付率 (tỷ lệ chi thưởng) của 完納奨励金 (thưởng thanh toán đủ hạn)"
    cho_de_ngo: "RFP chỉ cố định cách tính 完納奨励金 (BR-INC-01: hệ số thuế 110/100 nhân trước rồi cắt lẻ xuống yên; trả quá hạn thì không có thưởng; suất có phiên bản và ngày hiệu lực), không cho bảng 交付率 và không định nghĩa 適格金額; BTC xác nhận ngày 17/10 không có tệp bảng suất nào đi kèm RFP. Q-05 còn chờ khách hai ý: (b) tiêu chí xếp mức của 売買参加者, 卸売業者 và 買出人 có được thưởng không; (c) định nghĩa 適格金額 và mốc tra bản quy tắc."
    sau: "Dùng GD-17 làm giả định có nguồn: 仲卸 1,5%; 売買参加者 1,0% (mức A) hoặc 0,8% (mức B), là số BTC công bố ở trang tổng kết LAB-3 ngày 15/10; thứ tự mức là giả định nhà thầu; 卸売業者 và 買出人 chưa có dòng suất; 適格金額 tạm bằng toàn bộ số tiền hoá đơn. 交付率 tra theo loại bên mua (participants.kind) và mức (participants.incentive_tier — cột thiết kế đích) trong bản quy tắc có hiệu lực tại hạn thanh toán; dòng không có suất (保留) ghi rate 0, amount 0, judgement 保留, máy chủ chặn 確定. Hệ số thuế 110/100 nhân trước rồi cắt lẻ xuống yên (BR-INC-01). Ca nghiệm thu AC8: 123.457 yên → 2.037 / 1.358 / 1.086."
    anh_huong_uoc: "Bảng suất ở SC-091 có cột loại bên mua và mức; incentives thêm cột đích buyer_kind, rate_tier, judgement, confirm_status; participants thêm incentive_tier; TEST thêm ca theo loại (AC8) và ca 却下/再判定待ち (AC5). Sub-issue BE của TECH-304, SC-080, SC-091 và 30 issue nhãn incentive phải cập nhật thân theo spec bản sửa 2. Khách đáp suất hoặc tiêu chí mức khác thì chỉ đổi dữ liệu của bản quy tắc và số kỳ vọng của AC8, không đổi cấu trúc bảng suất (loại bên mua × mức)."
    vi_sao: "Feedback cá nhân LAB-3 của BTC (17/10) ghi bảng tỷ lệ cụ thể không có trong PDF RFP và giả định theo Q-05 là cách làm đúng; cùng ngày BTC xác nhận không có tệp bảng suất đi kèm. Vì vậy GD-17 là giả định có nguồn, chờ khách chốt ở INV-GD-03, không phải việc bị chặn. Đây là chỗ LAB-5 khác LAB-4 có chủ ý: bản 0.4.1 đóng băng ngày 17/10 trước tin xác nhận này, nên Q-05, mục 4.1 PREMISE của LAB-4 và A6 vẫn xếp Q-05 ở mức chặn và đợi khách gửi tệp bảng suất; dòng này ở lại bảng tới lượt sửa LAB-4 kế tiếp."
    nguon: "`PREMISE.md:171` «dùng số tạm GD-17 từ trang tổng kết LAB-3 của BTC» · `PREMISE.md:186` «Dùng GD-17 (số BTC công bố ở trang tổng kết LAB-3) làm số tạm» · `PREMISE.md:196` «税係数は 110/100 とし、計算後はJPY単位で切り捨てる» · `references/ban-sua-2/tong-ket-lab3-btc-trich-15-10.md:3` «trang tổng kết LAB-3 của BTC» · `lab-01/registry/assumptions.yaml › GD-17` «tổng kết LAB-3 của BTC bản 7, 15/10» · `lab-04/registry/system-design.yaml › a.5.nguong` (A6) · `tran-thai-hoc-feedback-lab03.html` (feedback LAB-3 của BTC, 17/10, ngoài repo) «Giả định Q-05 là cách làm đúng»"
