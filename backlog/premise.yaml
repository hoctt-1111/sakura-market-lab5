  - ma: P-58
    nhom: huong_chot
    spec: "Việc lớn hơn năng lực một sprint của vai phụ trách"
    phuong_an_lab4:
      - "Giữ mỗi hạng mục là một issue lá dù giờ vượt trần một sprint (85% × 56 giờ × số người của vai): tool xếp sprint coi lá là nguyên khối nên lá đó không vào sprint nào, hoặc phải nới quy tắc để một lá kéo dài nhiều sprint."
      - "Tách story có lá vượt trần thành story con, mỗi story con một phần vừa một sprint, đủ mọi loại lá của story gốc; story gốc và lá gốc đóng thừa, không xoá."
    chot: "Cách thứ hai (biến thể tách trọn story). Số phần = lớn nhất của ceil(giờ lá ÷ trần của vai) trong story, tính trên giờ sau khi người duyệt mẫu SWP ngày 22/10; lá của story con được chấm SWP lại bằng cùng quy trình (tkm:estimate-swp, hai người chấm, người duyệt mẫu) để có bằng chứng, nhưng Story Point chốt của lá con theo luật tổng phần bằng gốc: SWP lá gốc chia đều theo số phần, phần dư dồn cho phần skill chấm cao hơn, tối thiểu 1; mẫu người duyệt thắng luật. Lý do: skill chấm mỗi phần như một việc độc lập nên tổng các phần lớn hơn lá gốc (64 lá con 281 SWP so 27 lá gốc), trong khi giờ nhóm k theo định mức EF cố định, giờ dồn về story nhiều phần và 9 lá con vẫn vượt trần; luật này giữ tổng SWP nhóm và đưa giờ từng phần về đúng cách tính số phần. Tổng giờ của nhóm k theo định mức EF không đổi vì tách; chỉ chia phần."
    vi_sao: "Sau khi hệ số k hiệu chuẩn theo nhóm (P-57), 19 lá hạ tầng, nghiệm thu, di trú và chốt thiết kế có giờ từ 54,5 tới 231, lớn hơn trần 47,6 hay 95,2 giờ một sprint của vai; để nguyên thì Sprint 1 không có lá nền tảng nào và kế hoạch sprint không phản ánh được việc. Tách theo sprint giữ nguyên tổng giờ, cho từng phần có tiêu chí xong riêng và đặt được Start/Due Date thật."
    nguon: "`lab-05/registry/uoc-luong/quy-uoc-sprint.yaml` «nang_luc_gio, brse_inv, tran, so_nguoi» · `lab-05/registry/uoc-luong/gio-final.json` · `lab-05/registry/xuyen-suot.yaml` «tach_theo_sprint» · `lab-05/registry/team.yaml` «dong_thua» · quyết định người duyệt ngày 22/10 (nội bộ)"
