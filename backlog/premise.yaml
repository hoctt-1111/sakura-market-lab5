    anh_huong_uoc: "NFR-COMP/TEST ước theo ma trận này; khách thêm trình duyệt cũ hoặc thiết bị ngoài danh sách thì tăng việc kiểm tương thích và có thể phải sửa FE của màn hiện trường."
    vi_sao: "GD-06 đã dùng để báo giá ở LAB-01 nên giữ cho thống nhất. Ghi rõ trong ma trận thì lỗi trên thiết bị ngoài danh sách không thành tranh cãi phạm vi (chỗ hở G-E18-04)."
