    nhom: gia_dinh
    spec: "Nguồn di trú, quy mô và người quyết chênh lệch (Q-01)"
    cho_de_ngo: "Câu Q-01 mức chặn hỏi khách nguồn nào, bao nhiêu dòng, từ ngày nào và ai bên chợ giữ từng nguồn, nhưng chưa có đáp; nhãn 履歴7年 (lịch sử 7 năm) trên hình di trú của RFP chưa rõ là thời hạn lưu hay độ sâu cần nạp; người quyết chênh lệch mới là đề xuất."
    sau: "Di trú tối đa 5 nguồn, 200.000 dòng, 3 năm gần nhất theo giả định GD-02 mà ADR-016 dùng; người quyết dòng chênh lệch là trưởng bộ phận 照合事務 (nhóm đối soát) theo đề xuất của LAB-4, tên người chốt khi có đáp."
    anh_huong_uoc: "E16 ước theo biên GD-02: {gio_epic:E16} giờ chốt cho tối đa 5 nguồn. Quy tắc tính lại khi kiểm kê ở MIG-01 ra số thật: mỗi nguồn vượt 5 cộng khoảng {gio_epic:E16:5} giờ (giờ E16 chia đều cho 5 nguồn, vì kiểm kê, ánh xạ, làm sạch, nạp và đối chiếu đều làm theo từng nguồn); vượt 200.000 dòng hoặc 3 năm thì không cộng theo tỷ lệ mà PM ước lại riêng bước nạp và đối chiếu (MIG-02, MIG-03), vì công ở đó phụ thuộc chất lượng dữ liệu hơn số dòng và LAB-1, LAB-4 không có số nào để quy đổi. PM tính lại trước khi khoá ánh xạ ở MIG-01, đúng tiêu chí của MIG-01."
    vi_sao: "Ba câu này quyết khối lượng của cả E16 mà chưa có đáp. Giữ biên LAB-4 đã ước và gắn quy tắc tính lại vào MIG-01 thì không tự nới hay thu phạm vi thay khách (chỗ hở G-E16-01)."
    nguon: "`adr/ADR-016-di-tru-tu-file-so-theo-rc7.md:39` «≤5 nguồn, ≤200.000 dòng tổng» · `adr/ADR-016-di-tru-tu-file-so-theo-rc7.md:40` «chưa phải số khách đã xác nhận» · `adr/ADR-016-di-tru-tu-file-so-theo-rc7.md:132` «đề xuất trưởng bộ phận 照合事務»"
