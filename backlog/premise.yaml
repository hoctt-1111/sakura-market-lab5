    cho_de_ngo: "RFP chưa có mã yêu cầu cho phần vận hành nội bộ này; LAB-4 giao Tech Lead trả lời ở Q-SD2, hạn gốc 19/10/2026. Cột thời gian chờ và thử lại của EV3 trong System Design bản 0.4.1 vẫn ghi «RFP không nêu — Q-nn» thay cho mã Q-SD2."
    sau: "Hai giá trị là tham số cấu hình: chưa có số, để cấu hình, không bịa ngưỡng. Hết số lần thử thì tác vụ dừng và đẩy cảnh báo vào hàng đợi cảnh báo vận hành SC-122, không tự khoá ngày."
    anh_huong_uoc: "Thêm tham số và nhánh hết lượt thử vào sub-issue BE của SC-070; giá trị thật chỉ ảnh hưởng cấu hình môi trường, không đổi ước lượng."
    vi_sao: "Đây là câu hỏi nội bộ nhưng cần số đo tải thật mới đặt được; LAB-5 giữ chỗ bằng tham số và để issue điều tra chốt số trước khi chạy thử trước phát hành. Backlog đọc ô «Q-nn» của EV3 là Q-SD2 (góp ý VA2-L1 của lượt soát LAB-4 17/10), để issue điều tra trỏ đúng một câu hỏi."
