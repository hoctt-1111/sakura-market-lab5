    cho_de_ngo: "Yêu cầu tương thích chỉ ghi chạy theo danh sách trình duyệt đã duyệt, không giới hạn phiên bản; câu Q-12 hỏi mẫu thiết bị và trình duyệt chưa có đáp, giả định thay thế GD-06 của LAB-01 chưa được đưa sang LAB-4."
