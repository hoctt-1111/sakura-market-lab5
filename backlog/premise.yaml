  - ma: P-47
    nhom: gia_dinh
    spec: "Vai duyệt bản ghi 相対, せり ở bước 確認待ち (FIG-012)"
    cho_de_ngo: "FIG-012 (rfp p.39) có bước duyệt từ 確認待ち (chờ xác nhận) sang 確定 (đã chốt) và FR-SERI-02 (p.40) đòi lưu người xác nhận, nhưng RFP không nói vai nào duyệt, người duyệt có được trùng người nhập không, và hai kênh có dùng chung vai không. RFP cũng không nói kết quả tái せり và chuyển 相対 (không sinh giao dịch) có phải qua 確認待ち không, dù FIG-012 ghi chung bản ghi せり, và trúng giá ít hơn cả lô thì phần dư đi đâu. Thêm một câu: chợ có cần lưu bản nháp (下書き) trước khi gửi duyệt không, hay bản chưa gửi chỉ nằm trên màn như backlog đang làm (P-46)."
    sau: "Vai được duyệt đặt ở ma trận quyền, khởi tạo 相対 cho 取引運用 (nhóm vận hành giao dịch) và せり cho せり進行役 (người điều hành phiên), là người thực hiện bước chốt ở FR-AITAI-02 và FR-SERI-02 (p.40); người duyệt là tài khoản khác người nhập, máy chủ chặn trùng bằng mã mới 422 SELF_CONFIRM_FORBIDDEN (P-46). Vai không viết cứng trong mã. Hai vai này cùng ánh xạ vào vai hệ thống 運営担当者 và prototype chỉ có một tài khoản mẫu (`wholesaler`) cho vai này, nên dữ liệu khởi tạo của SC-003/DB nạp hai dòng ma trận «được duyệt» và một tài khoản thứ hai cùng vai, mang dấu tạm như P-28; ca AC-11/TEST dùng tài khoản đó. Mặc định khi chưa có đáp: tái せり và chuyển 相対 ghi ngay; số lượng trúng mặc định bằng phần còn lại của lô, nhập ít hơn thì phần dư còn khả dụng theo P-30."
    anh_huong_uoc: "SC-030/BE và SC-040/BE ước theo một lệnh duyệt dùng chung, kiểm khác tài khoản và đọc vai từ ma trận; khách đáp vai khác thì chỉ đổi dòng ma trận; khách cho người nhập tự duyệt thì bỏ điều kiện khác tài khoản và ca kiểm tương ứng, giữ cột người xác nhận. Khách đòi tái せり, chuyển 相対 cũng qua 確認待ち thì TECH-302/BE thêm lệnh duyệt cho hai loại này."
    vi_sao: "Góp ý BTC LAB-4 (trục B) đòi lưu 確認者 (người xác nhận) theo sơ đồ của khách, nhưng ai giữ vai duyệt là quy chế của chợ. Lấy hai người như luồng 赤伝 (P-16) để bước duyệt của sơ đồ có nghĩa, đặt vai ở ma trận quyền để câu trả lời của khách không làm sửa mã; hỏi khách ở INV-FG04-XAC-NHAN trước Sprint 2."
    nguon: "`rfp p.39` FIG-012, bước duyệt từ chờ xác nhận sang đã chốt (diễn đạt lại) · `rfp p.40` FR-AITAI-02, FR-SERI-02, người thực hiện của bước chốt (diễn đạt lại) · `specs/auction-result/screen-specification/SKM_SERI_RESULT_ENTRY_SPEC.md:105` «máy chủ gán = người đang đăng nhập» · `architecture/SKM_SYSTEM_DESIGN.md:312` «nhập kết quả» · `architecture/SKM_SYSTEM_DESIGN.md:321` «運営担当者 (giả định — chờ khách xác nhận)» · `tran-thai-hoc-feedback-lab04.html` (feedback LAB-4 của BTC, ngoài repo) «lưu người xác nhận (確認者) theo sơ đồ của khách»"
