    vi_sao: "Giá trị giữ đúng giả định của LAB-4, nên ước lượng và tiêu chí nghiệm thu không đổi; khác LAB-4 ở chỗ con số đặt ở cấu hình chứ không viết trong luật, để câu trả lời của khách (BrSE hỏi, hạn trước khi viết migration D2) chỉ đổi tham số. Máy chỉ ghi nhận chênh lệch, người của chợ quyết định."
