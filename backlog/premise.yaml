    cho_de_ngo: "RFP không định nghĩa hệ phân quyền; LAB-4 đề xuất 照合事務 dùng vai 市場管理者 (quản lý chợ), 取引運用 dùng vai 運営担当者 (nhân viên vận hành), còn 7 vai chưa gán vai nội bộ nào; 11 màn của FG-12, FG-13 và FG-14 có ít nhất một vai dùng là vai chưa gán."
