    vi_sao: "Khoá ngày tạo nghĩa vụ pháp lý nên để người quyết. Không làm đường mở lại thì giữ được luật của FR-SETTLE-02 là sau khoá chỉ sửa qua điều chỉnh có duyệt, cho tới khi có đáp (chỗ hở G-FG08-03)."
